name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repository-hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Validate repository scaffold
        shell: bash
        run: |
          set -euo pipefail

          required=(
            README.md
            AGENTS.md
            .gitignore
            .github/system_prompts/chatgpt_custom_instructions.md
            .github/system_prompts/codex_system_prompt.md
            .github/workflows/deploy-pages.yml
            docs/index.html
          )

          for file in "${required[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required repository file is missing"
              exit 1
            fi
          done

          prohibited="$({
            git ls-files | grep -E '(^|/)\.env($|\.(local|dev|prod|production|staging)$)|(^|/)(credentials|service-account[^/]*)\.json$|\.(pem|p12|key)$'
          } || true)"

          if [[ -n "$prohibited" ]]; then
            echo "::error::Potential secret-bearing file is tracked; review it before merging"
            exit 1
          fi

          echo "Repository scaffold validation passed."
