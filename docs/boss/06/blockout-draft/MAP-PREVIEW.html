<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width,initial-scale=1" />
        <title>Boss06 V3 Skybridge Arena Preview</title>
        <style>
            html,
            body {
                margin: 0;
                background: #061019;
                color: #dce8ec;
                font-family: system-ui, sans-serif;
            }
            main {
                padding: 18px;
            }
            h1 {
                margin: 0 0 6px;
                font-size: 20px;
            }
            .note {
                margin: 0 0 14px;
                color: #9fb4be;
            }
            .frame {
                border: 1px solid #36505c;
                background: #091923;
                width: min(100%, 1180px);
            }
            svg {
                display: block;
                width: 100%;
                height: auto;
            }
            .surface {
                fill: #263a44;
                stroke: #9aafb9;
                stroke-width: 10;
            }
            .ledge {
                fill: #2b424b;
                stroke: #9eb1ba;
                stroke-width: 8;
            }
            .recovery {
                fill: #244d3a;
                stroke: #78dda4;
                stroke-width: 8;
            }
            .departure {
                fill: #1f343d;
                stroke: #748d98;
                stroke-width: 8;
            }
            .anchor {
                fill: #163745;
                stroke: #67e8f9;
                stroke-width: 7;
            }
            .route {
                fill: none;
                stroke: #67e8f9;
                stroke-width: 6;
                stroke-dasharray: 18 12;
            }
            .boss {
                fill: #4d5b61;
                stroke: #e1eaed;
                stroke-width: 8;
            }
            .jump {
                fill: none;
                stroke: #a78bfa;
                stroke-width: 10;
                stroke-dasharray: 24 16;
            }
            .missile {
                fill: none;
                stroke: #38bdf8;
                stroke-width: 7;
            }
            .summon {
                fill: rgba(74, 222, 128, 0.2);
                stroke: #4ade80;
                stroke-width: 8;
                stroke-dasharray: 18 12;
            }
            .gate {
                fill: #28353d;
                stroke: #ffe998;
                stroke-width: 8;
            }
            .label {
                fill: #dce8ec;
                font-size: 54px;
                font-weight: 700;
            }
            .small {
                fill: #a8bdc7;
                font-size: 36px;
            }
        </style>
    </head>
    <body>
        <main>
            <h1>Boss06 V3 · SKYBRIDGE SECURITY COURT</h1>
            <p class="note">
                현재 좌표 권위는 canonical boss-06.json이다. Player 경로는 U1~U10, Warden은 Main↔Raised Ledge 점프,
                정점에서 5발 부채꼴 유도미사일을 발사한다.
            </p>
            <div class="frame">
                <svg viewBox="0 -2600 5600 2600" role="img" aria-label="Boss06 V3 authored arena map">
                    <rect x="0" y="-2600" width="5600" height="2600" fill="#07151f" />
                    <rect class="surface" x="640" y="-1040" width="3920" height="120" />
                    <rect class="ledge" x="1040" y="-1360" width="560" height="48" />
                    <rect class="ledge" x="2180" y="-1500" width="840" height="48" />
                    <rect class="ledge" x="3440" y="-1360" width="560" height="48" />
                    <rect class="recovery" x="220" y="-700" width="420" height="58" />
                    <rect class="recovery" x="4560" y="-700" width="360" height="58" />
                    <rect class="departure" x="4780" y="-1055" width="760" height="135" />
                    <rect class="gate" x="4560" y="-1760" width="220" height="705" />
                    <polyline
                        class="route"
                        points="850,-1430 1230,-1530 1610,-1630 1990,-1710 2370,-1750 2750,-1750 3130,-1710 3510,-1630 3890,-1530 4270,-1430"
                    />
                    <g>
                        <circle class="anchor" cx="850" cy="-1430" r="18" />
                        <circle class="anchor" cx="1230" cy="-1530" r="18" />
                        <circle class="anchor" cx="1610" cy="-1630" r="18" />
                        <circle class="anchor" cx="1990" cy="-1710" r="18" />
                        <circle class="anchor" cx="2370" cy="-1750" r="18" />
                        <circle class="anchor" cx="2750" cy="-1750" r="18" />
                        <circle class="anchor" cx="3130" cy="-1710" r="18" />
                        <circle class="anchor" cx="3510" cy="-1630" r="18" />
                        <circle class="anchor" cx="3890" cy="-1530" r="18" />
                        <circle class="anchor" cx="4270" cy="-1430" r="18" />
                        <circle class="anchor" cx="420" cy="-1020" r="18" />
                        <circle class="anchor" cx="4740" cy="-1020" r="18" />
                    </g>
                    <circle class="summon" cx="1280" cy="-1240" r="55" />
                    <circle class="summon" cx="3920" cy="-1240" r="55" />
                    <rect class="boss" x="3552" y="-1190" width="96" height="150" rx="20" />
                    <path class="jump" d="M3600 -1115 Q3000 -2050 2600 -1575" />
                    <path class="missile" d="M3000 -1920 Q2500 -2180 1850 -1250" />
                    <path class="missile" d="M3000 -1920 Q2650 -2060 2050 -1250" />
                    <path class="missile" d="M3000 -1920 Q2900 -1970 2300 -1250" />
                    <path class="missile" d="M3000 -1920 Q3150 -1860 2550 -1250" />
                    <path class="missile" d="M3000 -1920 Q3400 -1700 2800 -1250" />
                    <text class="label" x="690" y="-850">ENTRY</text>
                    <text class="label" x="4970" y="-850">BOARDING</text>
                    <text class="small" x="1900" y="-1880">JUMP APEX · 5-WAY HOMING FAN</text>
                    <text class="small" x="1680" y="-1210">3920px MAIN RUNWAY</text>
                    <text class="small" x="2110" y="-1385">CENTER LEDGE</text>
                    <text class="small" x="1030" y="-1130">SUMMON ×2</text>
                </svg>
            </div>
        </main>
    </body>
</html>
