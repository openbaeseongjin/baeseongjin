<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE ROPE 1-1 REV8 Story Atmosphere</title>
<style>
:root{--bg:#05090d;--p:#0d161c;--l:#2d444f;--t:#edf5f8;--m:#91a5ae;--c:#5de8ff;--a:#efb75b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:17px 21px;border-bottom:1px solid var(--l)}h1{margin:0;font-size:20px}.sub{font-size:13px;color:var(--m);margin-top:4px}.wrap{max-width:1450px;margin:auto;padding:15px}.note,.card{border:1px solid var(--l);background:var(--p);border-radius:9px;padding:10px}.note{border-color:#5d4c29;background:#17150d;color:#f2dc96;margin-bottom:12px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{padding:8px 11px;border:1px solid #3b5662;border-radius:8px;background:#10202a;color:var(--t);cursor:pointer}button.on{color:var(--c);border-color:var(--c)}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.stage{border:1px solid var(--l);background:var(--p);border-radius:10px;overflow:hidden}.head{padding:11px 13px;border-bottom:1px solid var(--l)}.scene{position:relative;aspect-ratio:16/9}.scene svg{width:100%;height:100%}.caption{position:absolute;left:12px;right:12px;bottom:12px;padding:9px 11px;background:#050a0ddd;border-left:3px solid var(--a)}.side{display:flex;flex-direction:column;gap:8px}.card h2{font-size:11px;color:var(--c);margin:0 0 5px}.card p{font-size:13px;line-height:1.5;margin:0}.toast{position:absolute;top:7%;left:50%;transform:translateX(-50%);padding:9px 13px;background:#071118e8;border:1px solid #58717d;border-radius:6px;text-align:center}.toast.hidden,.bark.hidden{display:none}.toast span{display:block;color:#bdcdd4;font-size:11px}.bark{position:absolute;top:66%;transform:translate(-50%,-100%);padding:9px 13px;background:#101a20ed;border:1px solid #efb75b;border-radius:8px}.bark:after{content:"";position:absolute;left:50%;bottom:-9px;transform:translateX(-50%);border-left:7px solid transparent;border-right:7px solid transparent;border-top:9px solid #efb75b}.structure{fill:#202a2f;stroke:#72848c;stroke-width:3}.platform{fill:#5b6e77}.player{fill:#eef5f8}.anchor{fill:#5de8ff;stroke:white;stroke-width:3}.rope{stroke:#5de8ff;stroke-width:5;fill:none}.ghost{stroke:#edf5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.4}
@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>1-1 SERVICE SHAFT · REV8 STORY / ATMOSPHERE</h1><div class="sub">Same psychology, larger spatial staging</div></header>
<div class="wrap"><div class="note"><b>Story는 유지하고 공간 연출을 다시 배치:</b> 넓어진 1280px 폭 때문에 처음부터 재난처럼 커 보이게 하지 않는다. 대신 익숙한 Service Riser 안에서 Player의 Swing 진폭이 점점 커지며 작은 통제감이 생기게 한다.</div>
<div id="buttons" class="toolbar"></div><div class="grid">
<section class="stage"><div class="head"><b id="title"></b><div class="sub" id="sig"></div></div><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#07131a"/><g id="visual"></g></svg><div id="toast" class="toast hidden"><b></b><span></span></div><div id="bark" class="bark hidden"><b></b></div><div id="caption" class="caption"></div></div></section>
<aside class="side"><div class="card"><h2>PSYCHOLOGY</h2><p id="psych"></p></div><div class="card"><h2>SPATIAL STAGING</h2><p id="space"></p></div><div class="card"><h2>CAMERA</h2><p id="camera"></p></div><div class="card"><h2>AUDIO</h2><p id="audio"></p></div><div class="card"><h2>DIALOGUE</h2><p id="dialogue"></p></div></aside></div></div>
<script>
const beats=[
["S0 · INCIDENT BAY","STARTLED","갑작스러운 이상을 아직 이해하지 못한다.","넓어진 P0에서 Ground Shutter는 왼쪽, 첫 A는 위쪽 안쪽에 둬 ‘아래 길은 닫혔고 위 공간은 열려 있음’을 한 프레임에 읽는다.","너무 Wide하게 잡지 않고 Player+Shutter+A를 중심으로 시작.","Normal facility hum → relay trip → shutter settle.","뭐야…?",["GROUND SERVICE ACCESS","LOCKDOWN"],`<rect class="platform" x="45" y="425" width="870" height="22"/><rect class="structure" x="80" y="245" width="155" height="180"/><g transform="translate(300 390)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><circle class="anchor" cx="505" cy="245" r="13"/>`],
["S1 · FIRST SWING","FOCUS","불안이 사라지지 않고 Rope 입력에 집중하면서 잠깐 뒤로 밀린다.","A에서 오른쪽 P1으로 실제 횡방향 Swing을 만들어 1280폭을 체감하게 한다.","A와 P1의 수평 관계를 보여주되 다음 전체 Route는 숨긴다.","Rope launch/attach/tension/release 우선.",null,null,`<circle class="anchor" cx="270" cy="340" r="13"/><rect class="platform" x="690" y="155" width="180" height="16"/><g transform="translate(500 285)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="rope" d="M500 285 L270 340"/>`],
["S2 · CROSS BACK","ENVIRONMENTAL UNDERSTANDING","오른쪽에 착지한 뒤 다시 왼쪽 구조를 읽으며 공간 자체를 이해하기 시작한다.","P1 RIGHT → P2 LEFT로 되돌아가며 Straight Shaft 안에서도 좌우 Movement가 있다는 걸 학습.","P1/P2와 Cable Overhang의 일부가 동시에 읽힐 수 있음.","Story sound 최소. 구조물/landing 금속음.",null,null,`<rect class="platform" x="650" y="345" width="180" height="16"/><rect class="platform" x="100" y="160" width="190" height="16"/><g transform="translate(560 300)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="ghost" d="M560 300 Q360 205 195 175"/>`],
["S3 · STRUCTURAL READ","SMALL CONTROL","실제 Maintenance 구조를 Rope 언어로 읽는 순간 작은 통제감이 생긴다.","오른쪽 Cable Overhang은 메인 Route 선상에서 살짝 벗어나 있어 발견처럼 느껴진다.","Player+Overhang+다음 C 방향을 보여주되 Tutorial arrow 없음.","일반 Anchor와 다른 structural metal attach resonance만 허용.",null,null,`<rect class="structure" x="560" y="125" width="300" height="45"/><g transform="translate(400 330)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="rope" d="M400 330 L710 148"/>`],
["S4 · OPEN SWING","BRIEF RELIEF","C에서 넓은 오른쪽 P3로 Swing하며 처음으로 움직임 자체가 시원해진다.","REV8의 넓어진 폭이 가장 크게 드러나는 Beat. P3는 큰 안전 착지로 만든다.","Open-swing Camera는 이 Beat에서만 더 넓어진다.","Alarm recedes; Rope/air/landing foreground.",null,null,`<circle class="anchor" cx="270" cy="315" r="13"/><rect class="platform" x="690" y="125" width="200" height="20"/><g transform="translate(520 230)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="rope" d="M520 230 L270 315"/><path class="ghost" d="M520 230 Q690 170 790 140"/>`],
["S5 · TERMINAL","RELIEF INTERRUPTED","움직임으로 얻은 안도 뒤 Terminal이 사고 범위를 다시 키운다.","Upper-right Terminal deck는 P3의 이동 방향 끝에 자연스럽게 나타난다.","Player+Terminal+Gate. 전 Stage 전체를 다시 Zoom-out하지 않는다.","Rope layer down, low hum returns.",null,["VERTICAL GRID / CASCADE FAILURE","LOWER TRANSIT / OFFLINE → ROOFTOP PAD 03 / SHUTTLE STANDBY"],`<rect class="platform" x="430" y="420" width="450" height="22"/><g transform="translate(545 385)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><rect class="structure" x="665" y="245" width="150" height="150"/>`],
["S6 · ROUTE OPEN","UNCERTAIN DIRECTION","완전히 안정된 것이 아니라 임시로 다음 행동을 정한다.","오른쪽 Gate가 열리지만 화면이 ‘승리’처럼 넓게 열리지 않는다.","Gate movement 우선, 다음 Stage는 전부 보여주지 않음.","Gate servo + distant ambiguous machinery.","…일단 위로.",["SERVICE SHAFT 02","ACCESS OPEN"],`<rect class="platform" x="420" y="420" width="470" height="22"/><g transform="translate(560 385)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><rect class="structure" x="745" y="170" width="70" height="250"/>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0].split(" · ")[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];title.textContent=b[0];sig.textContent=b[1];psych.textContent=b[2];space.textContent=b[3];camera.textContent=b[4];audio.textContent=b[5];dialogue.textContent=b[6]||"무대사";visual.innerHTML=b[8];caption.textContent=b[3];[...bs.children].forEach((x,j)=>x.classList.toggle("on",i===j));if(b[7]){toast.classList.remove("hidden");toast.querySelector("b").textContent=b[7][0];toast.querySelector("span").textContent=b[7][1]}else toast.classList.add("hidden");if(b[6]){bark.classList.remove("hidden");bark.style.left=i===0?"31%":"58%";bark.querySelector("b").textContent=b[6]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
