<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" role="img" aria-labelledby="title desc">
  <title id="title">Sector 01-1 Service Shaft approved blockout</title>
  <desc id="desc">Runtime-aligned 960 by 960 blockout with three grapple landmarks, recovery platforms, terminal, and exit gate. No enemy or wind hazard.</desc>
  <defs>
    <style>
      .bg { fill: #07111e; }
      .zone { fill: #0f2234; opacity: .38; }
      .wall { fill: #17283a; stroke: #49647b; stroke-width: 3; }
      .platform { fill: #526779; stroke: #c1d1dc; stroke-width: 2; }
      .recovery { fill: #385766; stroke: #79c7d5; stroke-width: 2; stroke-dasharray: 6 4; }
      .solid { fill: #2a3440; stroke: #8290a0; stroke-width: 2; }
      .anchor { fill: #07111e; stroke: #22d3ee; stroke-width: 5; }
      .route { fill: none; stroke: #22d3ee; stroke-width: 3; stroke-dasharray: 8 7; opacity: .8; }
      .terminal { fill: #102b35; stroke: #67e8f9; stroke-width: 4; }
      .gate { fill: #3c2530; stroke: #fb7185; stroke-width: 4; }
      .player { fill: #f8fafc; stroke: #fb4b5a; stroke-width: 3; }
      .label { fill: #d9f4ff; font: 700 17px ui-monospace, monospace; }
      .small { fill: #9fb7c7; font: 700 13px ui-monospace, monospace; }
      .zone-label { fill: #58768d; font: 700 14px ui-monospace, monospace; letter-spacing: 1px; }
    </style>
  </defs>
  <rect class="bg" width="960" height="960"/>
  <rect class="zone" x="0" y="0" width="960" height="128"/>
  <rect class="zone" x="0" y="352" width="960" height="256"/>
  <rect class="zone" x="0" y="800" width="960" height="160"/>
  <rect class="wall" x="0" y="0" width="32" height="960"/>
  <rect class="wall" x="928" y="0" width="32" height="960"/>
  <text class="zone-label" x="48" y="28">E · SERVICE CONTROL</text>
  <text class="zone-label" x="48" y="156">D · OPEN SWING VOID</text>
  <text class="zone-label" x="48" y="380">C · RELEASE CORRIDOR</text>
  <text class="zone-label" x="48" y="636">B · FIRST HOOK</text>
  <text class="zone-label" x="48" y="828">A · INCIDENT BAY</text>

  <polyline class="route" points="160,928 384,768 640,512 416,256 736,64 800,32"/>

  <rect class="platform" x="64" y="946" width="256" height="14"/>
  <text class="small" x="70" y="938">P0 START</text>
  <rect class="solid" x="32" y="832" width="128" height="128"/>
  <text class="small" x="40" y="852">GROUND</text>
  <text class="small" x="40" y="870">SHUTTER</text>

  <rect class="recovery" x="224" y="736" width="160" height="16"/>
  <text class="small" x="228" y="730">R1</text>
  <rect class="platform" x="544" y="672" width="192" height="16"/>
  <text class="small" x="548" y="666">P1</text>

  <rect class="recovery" x="192" y="480" width="192" height="16"/>
  <text class="small" x="196" y="474">R2</text>
  <rect class="platform" x="224" y="416" width="192" height="16"/>
  <text class="small" x="228" y="410">P2</text>
  <rect class="solid" x="544" y="352" width="224" height="32"/>
  <text class="small" x="552" y="374">CABLE OVERHANG</text>

  <rect class="recovery" x="256" y="224" width="160" height="16"/>
  <text class="small" x="260" y="218">R3</text>
  <rect class="platform" x="384" y="160" width="224" height="16"/>
  <text class="small" x="388" y="154">P3</text>
  <rect class="platform" x="512" y="96" width="320" height="32"/>
  <text class="small" x="516" y="90">P4 SAFE DECK</text>

  <circle class="anchor" cx="384" cy="768" r="12"/>
  <text class="label" x="404" y="774">A</text>
  <circle class="anchor" cx="640" cy="512" r="12"/>
  <text class="label" x="660" y="518">B</text>
  <circle class="anchor" cx="416" cy="256" r="12"/>
  <text class="label" x="436" y="262">C</text>

  <circle class="player" cx="160" cy="928" r="10"/>
  <text class="small" x="176" y="934">SPAWN</text>
  <rect class="terminal" x="672" y="48" width="32" height="48" rx="4"/>
  <text class="small" x="620" y="42">SERVICE TERMINAL</text>
  <rect class="gate" x="768" y="0" width="64" height="96"/>
  <text class="small" x="746" y="116">GATE 02</text>

  <g opacity=".35">
    <circle cx="192" cy="288" r="78" fill="#162c3c" stroke="#3f596c" stroke-width="7"/>
    <circle cx="192" cy="288" r="14" fill="#4a6478"/>
    <path d="M192 274 L164 224 L190 210 Z M206 288 L256 260 L270 286 Z M192 302 L220 352 L194 366 Z M178 288 L128 316 L114 290 Z" fill="#4a6478"/>
  </g>
</svg>
