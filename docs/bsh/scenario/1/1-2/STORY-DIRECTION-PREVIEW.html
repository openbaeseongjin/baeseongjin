<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE ROPE 1-2 REV8 Story Atmosphere</title>
<style>
:root{--bg:#05090d;--p:#0d161c;--l:#2d444f;--t:#edf5f8;--m:#91a5ae;--c:#5de8ff;--a:#efb75b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:17px 21px;border-bottom:1px solid var(--l)}h1{margin:0;font-size:20px}.sub{font-size:13px;color:var(--m);margin-top:4px}.wrap{max-width:1450px;margin:auto;padding:15px}.note,.card{border:1px solid var(--l);background:var(--p);border-radius:9px;padding:10px}.note{border-color:#5d4c29;background:#17150d;color:#f2dc96;margin-bottom:12px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{padding:8px 11px;border:1px solid #3b5662;border-radius:8px;background:#10202a;color:var(--t);cursor:pointer}button.on{color:var(--c);border-color:var(--c)}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.stage{border:1px solid var(--l);background:var(--p);border-radius:10px;overflow:hidden}.head{padding:11px 13px;border-bottom:1px solid var(--l)}.scene{position:relative;aspect-ratio:16/9}.scene svg{width:100%;height:100%}.caption{position:absolute;left:12px;right:12px;bottom:12px;padding:9px 11px;background:#050a0ddd;border-left:3px solid var(--a)}.side{display:flex;flex-direction:column;gap:8px}.card h2{font-size:11px;color:var(--c);margin:0 0 5px}.card p{font-size:13px;line-height:1.5;margin:0}.toast{position:absolute;top:7%;left:50%;transform:translateX(-50%);padding:9px 13px;background:#071118e8;border:1px solid #58717d;border-radius:6px;text-align:center}.toast.hidden,.bark.hidden{display:none}.toast span{display:block;color:#bdcdd4;font-size:11px}.bark{position:absolute;left:7%;bottom:12%;padding:9px 13px;background:#101a20ed;border:1px solid #6a8c9a;border-radius:8px}.bark:before{content:"PLAYER";display:block;color:var(--c);font-size:9px}.structure{fill:#202a2f;stroke:#72848c;stroke-width:3}.platform{fill:#5b6e77}.lift{fill:#292f33;stroke:#be8a61;stroke-width:3}.counter{fill:#343238;stroke:#9c8977;stroke-width:3}.player{fill:#eef5f8}.anchor{fill:#5de8ff;stroke:white;stroke-width:3}.rope{stroke:#5de8ff;stroke-width:5;fill:none}.ghost{stroke:#edf5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.4}
@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>1-2 DOUBLE ANCHOR SHAFT · REV8 STORY / ATMOSPHERE</h1><div class="sub">Lift failure is physically experienced through the new wide machinery layout.</div></header>
<div class="wrap"><div class="note"><b>핵심:</b> 1-1은 열린 Riser를 좌우로 읽었다. 1-2는 화면 중앙의 거대한 기계 두 덩어리가 길을 나누며, Player가 그 사이 좁은 Service Slot을 공중 Re-Attach로 통과한다.</div>
<div id="buttons" class="toolbar"></div><div class="grid">
<section class="stage"><div class="head"><b id="title"></b><div class="sub" id="sig"></div></div><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#07131a"/><g id="visual"></g></svg><div id="toast" class="toast hidden"><b></b><span></span></div><div id="bark" class="bark hidden"><b></b></div><div id="caption" class="caption"></div></div></section>
<aside class="side"><div class="card"><h2>PSYCHOLOGY</h2><p id="psych"></p></div><div class="card"><h2>SPACE / STORY</h2><p id="space"></p></div><div class="card"><h2>CAMERA</h2><p id="camera"></p></div><div class="card"><h2>AUDIO</h2><p id="audio"></p></div><div class="card"><h2>DIALOGUE</h2><p id="dialogue"></p></div></aside></div></div>
<script>
const beats=[
["S0 · DEAD LIFT","EXPECTATION BREAK","1-1에서 위로 가기로 한 뒤 Lift를 발견해 잠깐 기대하지만 바로 실망한다.","오른쪽 Entry에서 Dead Lift 전체와 정지한 Counterweight 일부가 보인다. 기계가 공간을 실제로 점유한다.","Player + A + Lift lower body. 전체 1664폭을 한 번에 보여주지 않는다.","있어야 할 motor hum이 없다. cable/brake settle만 남는다.","…리프트도?",["LIFT CONTROL","OFFLINE"],`<rect class="platform" x="610" y="420" width="280" height="20"/><rect class="lift" x="350" y="105" width="310" height="305"/><rect class="counter" x="85" y="150" width="70" height="260"/><g transform="translate(710 385)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><circle class="anchor" cx="560" cy="270" r="13"/>`],
["S1 · SLOT READ","FRUSTRATION → ACTION","Lift가 안 된다는 사실을 받아들이고, Counterweight와 Lift 사이 Maintenance Slot을 읽는다.","이 Stage의 길은 UI 화살표가 아니라 두 기계 덩어리 사이의 실제 빈 공간이다.","A + slot + C 방향이 연속적으로 읽힌다. C는 아직 멀지만 화면에 존재해야 한다.","Rope tension / metal creak가 전면으로 이동.","무대사",["AUTOMATIC LIFT SERVICE","SUSPENDED · MANUAL ACCESS ONLY"],`<rect class="counter" x="90" y="75" width="75" height="350"/><rect class="lift" x="425" y="145" width="310" height="280"/><circle class="anchor" cx="620" cy="350" r="13"/><circle class="anchor" cx="270" cy="120" r="13"/><g transform="translate(560 305)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="ghost" d="M560 305 Q430 240 275 135"/>`],
["S2 · AIRBORNE C","FIRST RE-ATTACH","A Swing에서 Release한 뒤 Rope가 없는 짧은 순간을 통과해 C를 다시 잡는다.","Static A→C는 400px 밖이다. 성공하려면 Player 몸이 Slot 안으로 들어가면서 C reach 안에 들어와야 한다.","Player + C + 두 기계 edge. C는 Release 전에 보이고 blind leap가 아니어야 한다.","Release sound → free-air gap → clear C attach snap. Tutorial chime 없음.","무대사",null,`<rect class="counter" x="85" y="60" width="75" height="380"/><rect class="lift" x="465" y="180" width="310" height="260"/><circle class="anchor" cx="250" cy="125" r="13"/><g transform="translate(420 270)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="ghost" d="M570 335 Q440 245 250 125"/>`],
["S3 · ROOF REVERSAL","PRACTICAL ADAPTATION","C를 잡은 뒤 Lift 상부를 향해 반대쪽으로 Swing한다. Rope를 연속 이동수단으로 이해하기 시작한다.","죽은 Lift 아래를 통과한 게 아니라 기계의 옆을 돌아 지붕 위로 감아 올라간다.","C + Lift roof + P2. 지나온 Slot이 아래쪽에 남아야 한다.","Rope / air foreground. Lift remains silent.","무대사",null,`<rect class="lift" x="315" y="275" width="330" height="195"/><circle class="anchor" cx="200" cy="270" r="13"/><rect class="platform" x="555" y="105" width="190" height="18"/><g transform="translate(410 210)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="rope" d="M410 210 L200 270"/><path class="ghost" d="M410 210 Q555 145 650 120"/>`],
["S4 · UPPER CATWALK","LOW-PRESSURE CLOSE","핵심 Re-Attach를 성공한 뒤에는 새 문제를 더하지 않는다.","넓은 Upper Catwalk가 왼쪽 Exit로 이어져 Stage가 빠르게 정리된다.","P2/P3/Exit가 읽히되, Camera는 다시 조금 가까워진다.","Landing / footstep / distant mechanical ambience.","무대사",null,`<rect class="platform" x="420" y="350" width="210" height="18"/><rect class="platform" x="180" y="255" width="260" height="22"/><rect class="platform" x="75" y="140" width="340" height="24"/><g transform="translate(505 315)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`],
["S5 · SECURITY PREVIEW","NEW UNEASE","Lift 문제를 넘겼지만 위쪽에서 더 정돈된 Security 신호가 살아 있는 것을 본다.","망가진 Lift와 대비되는 clean system light가 다음 Stage를 예고한다.","Final deck left + panel/gate. 1-3 전체는 미리 보여주지 않는다.","Dead machinery ambience → clean beep / servo handoff.","무대사",["POWER REDUCTION / STAGE 2","SECURITY ACCESS / CHECK"],`<rect class="platform" x="70" y="420" width="560" height="22"/><g transform="translate(330 385)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><rect class="structure" x="135" y="205" width="75" height="200"/><rect class="structure" x="245" y="275" width="55" height="40"/>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0].split(" · ")[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];title.textContent=b[0];sig.textContent=b[1];psych.textContent=b[2];space.textContent=b[3];camera.textContent=b[4];audio.textContent=b[5];dialogue.textContent=b[6];visual.innerHTML=b[8];caption.textContent=b[3];[...bs.children].forEach((x,j)=>x.classList.toggle("on",i===j));if(b[7]){toast.classList.remove("hidden");toast.querySelector("b").textContent=b[7][0];toast.querySelector("span").textContent=b[7][1]}else toast.classList.add("hidden");if(b[6] && b[6]!=="무대사"){bark.classList.remove("hidden");bark.querySelector("b").textContent=b[6]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
