<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 768 640" role="img" aria-labelledby="title desc">
  <title id="title">Sector 01-4 Maintenance Node approved blockout</title>
  <desc id="desc">Runtime-aligned 768 by 640 reward room with one industrial augment node, three fixed Foundation choices, three grapple landmarks, two recovery platforms, one non-hostile calibration dummy, and a Test Bay exit. No enemy, wind, or damage hazard.</desc>
  <defs>
    <style>
      .bg { fill: #07111e; }
      .zone { fill: #0f2234; opacity: .42; }
      .reward-zone { fill: #221d35; opacity: .32; }
      .wall { fill: #17283a; stroke: #49647b; stroke-width: 3; }
      .platform { fill: #526779; stroke: #c1d1dc; stroke-width: 2; }
      .recovery { fill: #385766; stroke: #79c7d5; stroke-width: 2; stroke-dasharray: 6 4; }
      .safe { fill: #35584c; stroke: #7dd3a7; stroke-width: 2; }
      .anchor { fill: #07111e; stroke: #22d3ee; stroke-width: 5; }
      .route { fill: none; stroke: #22d3ee; stroke-width: 3; stroke-dasharray: 8 7; opacity: .86; }
      .interaction { fill: none; stroke: #c084fc; stroke-width: 2; stroke-dasharray: 5 6; opacity: .7; }
      .node { fill: #17283a; stroke: #c084fc; stroke-width: 4; }
      .screen { fill: #102936; stroke: #b9efff; stroke-width: 2; }
      .profile { fill: none; stroke: #e5f7ff; stroke-width: 2.5; }
      .dummy { fill: #3d4650; stroke: #fbbf24; stroke-width: 3; }
      .panel { fill: #132b34; stroke: #fbbf24; stroke-width: 4; }
      .gate { fill: #3c2530; stroke: #fb7185; stroke-width: 4; }
      .player { fill: #f8fafc; stroke: #fb4b5a; stroke-width: 3; }
      .label { fill: #d9f4ff; font: 700 16px ui-monospace, monospace; }
      .small { fill: #9fb7c7; font: 700 12px ui-monospace, monospace; }
      .zone-label { fill: #58768d; font: 700 13px ui-monospace, monospace; letter-spacing: 1px; }
      .pending { fill: #fbbf24; font: 700 11px ui-monospace, monospace; }
    </style>
