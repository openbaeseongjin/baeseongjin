<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE ROPE 2-2 REV8 Story Atmosphere</title>
<style>
:root{--bg:#080c0d;--p:#111716;--l:#3d4742;--t:#f0f1e9;--m:#a6aaa0;--c:#5de8ff;--warm:#d3b06a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:17px 21px;border-bottom:1px solid var(--l)}h1{margin:0;font-size:20px}.sub{font-size:13px;color:var(--m);margin-top:4px}.wrap{max-width:1480px;margin:auto;padding:15px}.note,.card{border:1px solid var(--l);background:var(--p);border-radius:9px;padding:10px}.note{border-color:#6b5831;background:#19150c;color:#ead8a3;margin-bottom:12px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{padding:8px 11px;border:1px solid #485752;border-radius:8px;background:#16201e;color:var(--t);cursor:pointer}button.on{color:var(--c);border-color:var(--c)}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.stage{border:1px solid var(--l);background:var(--p);border-radius:10px;overflow:hidden}.head{padding:11px 13px;border-bottom:1px solid var(--l)}.scene{position:relative;aspect-ratio:16/9}.scene svg{width:100%;height:100%}.caption{position:absolute;left:12px;right:12px;bottom:12px;padding:9px 11px;background:#050a0ddd;border-left:3px solid var(--warm)}.side{display:flex;flex-direction:column;gap:8px}.card h2{font-size:11px;color:var(--c);margin:0 0 5px}.card p{font-size:13px;line-height:1.5;margin:0}.toast{position:absolute;top:7%;left:50%;transform:translateX(-50%);padding:9px 13px;background:#071118e8;border:1px solid #68766f;border-radius:6px;text-align:center;min-width:300px}.toast.hidden{display:none}.bark{position:absolute;left:7%;bottom:12%;padding:9px 13px;background:#111a18ed;border:1px solid #6d8882;border-radius:8px}.bark:before{content:'PLAYER';display:block;color:#5de8ff;font-size:9px}.bark.hidden{display:none}
.wall{fill:#29302d;stroke:#55605a;stroke-width:2}.walk{fill:#626d67}.door{fill:#343b38;stroke:#8b928c;stroke-width:2}.window{fill:#b49b5b;opacity:.35}.rail{stroke:#8c9691;stroke-width:3}.player{fill:#eef5f8}.drone{fill:#6e2424;stroke:#ff8e7c;stroke-width:3}.cover{fill:#424c49}.module{fill:#caa7ff;stroke:white;stroke-width:2}.carrier{fill:#482b61;stroke:#d1adff;stroke-width:3}.motion{stroke:#ff8e7c;stroke-width:3;stroke-dasharray:8 7}.ghost{stroke:#eef5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.38}
@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>2-2 PATROL WALKWAY · REV8 STORY / ATMOSPHERE</h1><div class="sub">The district is empty. The patrol system is not.</div></header>
<div class="wrap"><div class="note"><b>연출 핵심:</b> Drone이 먼저 움직이는 것을 보여준 뒤 Player를 압박한다. 첫 Moving Security가 “갑자기 맞는 적”이 되면 실패다. 2-2의 Story는 새로운 진실을 말하지 않고 <b>빈 주거지와 계속 작동하는 순찰의 부조화</b>만 강화한다.</div>
<div id="buttons" class="toolbar"></div><div class="grid">
<section class="stage"><div class="head"><b id="title"></b><div class="sub" id="sig"></div></div><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#0b1110"/><g id="visual"></g></svg><div id="toast" class="toast hidden"><b></b><span></span></div><div id="bark" class="bark hidden"><b></b></div><div id="caption" class="caption"></div></div></section>
<aside class="side"><div class="card"><h2>PSYCHOLOGY</h2><p id="psych"></p></div><div class="card"><h2>SPACE / STORY</h2><p id="space"></p></div><div class="card"><h2>CAMERA</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / MOTION</h2><p id="audio"></p></div><div class="card"><h2>DIALOGUE</h2><p id="dialogue"></p></div></aside></div></div>
<script>
const beats=[
["S0 · ENTRY","LONG TRANSIT","2-1의 좁은 Rowhouse를 빠져나오자 처음으로 주거동 사이를 잇는 긴 외부 Walkway가 열린다. 하지만 여전히 저층부 스케일이다.","긴 Bridge가 보이지만 바로 전투는 시작하지 않는다.","Default camera. Player + Observation Deck + 먼 Drone movement 일부.","주거 ambient 위로 멀리 작은 patrol motor가 반복된다.","무대사",["PATROL WALKWAY","SECURITY STILL ACTIVE"],`<rect class="wall" x="35" y="100" width="260" height="310"/><rect class="wall" x="695" y="100" width="230" height="310"/><rect class="walk" x="250" y="360" width="510" height="18"/><g transform="translate(285 325)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><circle class="drone" cx="680" cy="300" r="18"/>`],
["S1 · OBSERVE","SEE BEFORE PRESSURE","Player가 안전한 곳에서 Drone이 좌우로 실제 이동한다는 걸 먼저 본다. 공격 Telegraphed language는 이미 아는 것이고 새 정보는 위치가 변한다는 점이다.","Observation Deck은 안전. Cover A와 첫 Pivot이 같이 읽힌다.","Default camera. Player + Drone + 이동 방향 + Cover A 중 최소 3개.","Patrol motor가 좌→우로 이동하며 pan. 아직 lock/fire cue 없음.","무대사",["SECURITY PATROL","ACTIVE"],`<rect class="walk" x="145" y="370" width="690" height="18"/><rect class="cover" x="355" y="285" width="70" height="85"/><line class="motion" x1="430" y1="300" x2="720" y2="300"/><circle class="drone" cx="535" cy="300" r="18"/><g transform="translate(260 335)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`],
["S2 · RESTRICTED","CONTRADICTION","비어 있는 주거지인데 Residential Transit은 여전히 제한된다. 이유는 설명하지 않는다.","같은 Observation Beat에서 두 번째 System status.","Camera 변화 없음.","짧은 restriction tone. 이후 gameplay cue로 전환.","…사람은 없는데, 순찰은 그대로네.",["RESIDENTIAL TRANSIT","RESTRICTED"],`<rect class="walk" x="145" y="370" width="690" height="18"/><rect class="cover" x="355" y="285" width="70" height="85"/><circle class="drone" cx="650" cy="300" r="18"/><g transform="translate(260 335)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`],
["S3 · CROSS","MOVING LOS","이제 Player가 Drone의 위치를 기준으로 Attach/Release 시점을 바꾼다. 멈춰서 죽이는 것만 정답이면 실패다.","Cover A→중앙→Cover B 사이가 핵심. Drone path와 Player Rope line이 같은 공간을 공유한다.","Default camera. 다음 Cover/Pivot 우선. Drone을 따라 Camera가 움직이지 않는다.","known acquire→lock→fire + moving motor. Rope sound와 겹쳐도 방향성 유지.","무대사",null,`<rect class="walk" x="100" y="385" width="760" height="18"/><rect class="cover" x="250" y="285" width="70" height="100"/><rect class="cover" x="640" y="285" width="70" height="100"/><line class="motion" x1="270" y1="315" x2="700" y2="315"/><circle class="drone" cx="485" cy="315" r="18"/><g transform="translate(430 270)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="ghost" d="M360 350 Q475 210 590 350"/>`],
["S4 · DISENGAGE","LESSON ENDS","Patrol Bridge를 빠져나오면 Drone과의 관계가 끊긴다. 다음 분기에서 첫 학습을 다시 복잡하게 만들지 않는다.","Far-right Upper Landing은 안전한 전환점.","Player + Upper Landing + Access branch entrance.","Patrol motor가 뒤로 멀어지고 lock cue 종료.","무대사",null,`<rect class="walk" x="530" y="385" width="300" height="18"/><g transform="translate(690 350)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`],
["S5 · ACCESS A","OPTIONAL LOCAL BRANCH","현재 Runtime의 첫 Sector 02 Carrier다. Patrol 학습 후에만 분기시켜 두 위협이 처음부터 겹치지 않게 한다.","작은 Service Alcove. Carrier + Module diamond. 추가 escort 없음.","Default camera. Branch commit 때 Carrier와 return Anchor만.","Access marker UI + Carrier combat cue. 새로운 Story Toast 없음.","무대사",null,`<rect class="walk" x="250" y="390" width="230" height="18"/><circle class="carrier" cx="365" cy="350" r="19"/><path class="module" d="M365 312 l9 9 -9 9 -9 -9z"/><g transform="translate(620 350)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="ghost" d="M600 335 Q500 280 390 330"/>`],
["S6 · EXIT","REST NEXT","2-2는 이동형 위협 학습으로 끝난다. 다음 2-3 Service Node에 들어가기 전에 적 압력이 완전히 사라져야 한다.","Upper Exit Deck은 안전. 2-3의 Augment/Service 공간을 미리 설명하지 않는다.","Default camera. Exit만.","Patrol ambience fades; service hum ahead.","무대사",null,`<rect class="walk" x="535" y="390" width="300" height="18"/><g transform="translate(710 355)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0].split(" · ")[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];title.textContent=b[0];sig.textContent=b[1];psych.textContent=b[2];space.textContent=b[3];camera.textContent=b[4];audio.textContent=b[5];dialogue.textContent=b[6];visual.innerHTML=b[8];caption.textContent=b[3];[...bs.children].forEach((x,j)=>x.classList.toggle("on",i===j));if(b[7]){toast.classList.remove("hidden");toast.querySelector("b").textContent=b[7][0];toast.querySelector("span").textContent=b[7][1]}else toast.classList.add("hidden");if(b[6]&&b[6]!=="무대사"){bark.classList.remove("hidden");bark.querySelector("b").textContent=b[6]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
