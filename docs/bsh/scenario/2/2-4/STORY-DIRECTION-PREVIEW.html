<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ONE ROPE 2-4 REV8 Story Atmosphere</title>
<style>
:root{--bg:#080c0d;--p:#111716;--l:#3d4742;--t:#f0f1e9;--m:#a6aaa0;--c:#5de8ff;--warm:#d3b06a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--t);font-family:Inter,system-ui,sans-serif}header{padding:17px 21px;border-bottom:1px solid var(--l)}h1{margin:0;font-size:20px}.sub{font-size:13px;color:var(--m);margin-top:4px}.wrap{max-width:1480px;margin:auto;padding:15px}.note,.card{border:1px solid var(--l);background:var(--p);border-radius:9px;padding:10px}.note{border-color:#6b5831;background:#19150c;color:#ead8a3;margin-bottom:12px}.toolbar{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{padding:8px 11px;border:1px solid #485752;border-radius:8px;background:#16201e;color:var(--t);cursor:pointer}button.on{color:var(--c);border-color:var(--c)}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.stage{border:1px solid var(--l);background:var(--p);border-radius:10px;overflow:hidden}.head{padding:11px 13px;border-bottom:1px solid var(--l)}.scene{position:relative;aspect-ratio:16/9}.scene svg{width:100%;height:100%}.caption{position:absolute;left:12px;right:12px;bottom:12px;padding:9px 11px;background:#050a0ddd;border-left:3px solid var(--warm)}.side{display:flex;flex-direction:column;gap:8px}.card h2{font-size:11px;color:var(--c);margin:0 0 5px}.card p{font-size:13px;line-height:1.5;margin:0}.toast{position:absolute;top:7%;left:50%;transform:translateX(-50%);padding:9px 13px;background:#071118e8;border:1px solid #68766f;border-radius:6px;text-align:center;min-width:300px}.toast.hidden{display:none}.bark{position:absolute;left:7%;bottom:12%;padding:9px 13px;background:#111a18ed;border:1px solid #6d8882;border-radius:8px}.bark:before{content:'PLAYER';display:block;color:#5de8ff;font-size:9px}.bark.hidden{display:none}
.wall{fill:#29302d;stroke:#55605a;stroke-width:2}.walk{fill:#626d67}.door{fill:#343b38;stroke:#8b928c;stroke-width:2}.window{fill:#b49b5b;opacity:.35}.rail{stroke:#8c9691;stroke-width:3}.laundry{stroke:#ddd3bd;stroke-width:3}.cloth{fill:#83786a}.plant{fill:#729071}.crate{fill:#5c5548}.bench{fill:#6e6556}.player{fill:#eef5f8}.enemy{fill:#6e2424;stroke:#ff8e7c;stroke-width:3}.ghost{stroke:#eef5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.35}.chalk{stroke:#c7bd96;stroke-width:3;fill:none;opacity:.65}
@media(max-width:950px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>2-4 RESIDENTIAL STACK · REV8 STORY / ATMOSPHERE</h1><div class="sub">Not a tower reveal — a dense network of lived-in worker housing.</div></header>
<div class="wrap"><div class="note"><b>연출 핵심:</b> 2-4는 “높은 아파트”를 보여주는 Stage가 아니라 <b>저층 주거 블록이 여러 겹 이어져 하나의 거대한 생활 네트워크처럼 보이는 순간</b>입니다. Route 선택 자체가 생활 동선의 파손과 연결돼 있어야 합니다.</div>
<div id="buttons" class="toolbar"></div><div class="grid">
<section class="stage"><div class="head"><b id="title"></b><div class="sub" id="sig"></div></div><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#0b1110"/><g id="visual"></g></svg><div id="toast" class="toast hidden"><b></b><span></span></div><div id="bark" class="bark hidden"><b></b></div><div id="caption" class="caption"></div></div></section>
<aside class="side"><div class="card"><h2>PSYCHOLOGY</h2><p id="psych"></p></div><div class="card"><h2>SPACE / STORY</h2><p id="space"></p></div><div class="card"><h2>CAMERA</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / MOTION</h2><p id="audio"></p></div><div class="card"><h2>DIALOGUE</h2><p id="dialogue"></p></div></aside></div></div>
<script>
const beats=[
["S0 · ENTRY","ROOM OPENS","2-3의 작은 Utility Hall을 나오자 한 개의 Courtyard가 아니라 여러 주거 블록이 연결된 공간이 열린다.","넓어지지만 고층 Tower가 아니다. 2–4층 규모의 Housing façades가 앞·중간·뒤에 겹친다.","Default camera. 아직 모든 Route를 한 화면에 다 보여줄 필요는 없다.","Utility hum → 넓은 주거 외부 ambience. Patrol은 아직 멀리.","무대사",["RESIDENTIAL STACK","MULTI-ROUTE HOUSING"],`<rect class="wall" x="40" y="120" width="280" height="290"/><rect class="wall" x="350" y="75" width="270" height="335"/><rect class="wall" x="650" y="115" width="270" height="295"/><rect class="door" x="80" y="285" width="50" height="125"/><rect class="door" x="390" y="285" width="50" height="125"/><rect class="door" x="690" y="285" width="50" height="125"/><rect class="walk" x="40" y="410" width="880" height="20"/><g transform="translate(195 375)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`],
["S1 · REVEAL","HUMAN SCALE MULTIPLIED","Player가 Reveal Deck에 올라왔을 때 여러 Gallery와 Balcony가 동시에 보인다. ‘한 채’가 아니라 많은 생활공간이라는 감정이 생긴다.","주거 높이를 키우는 대신 중첩 수를 늘린다. 문, 빨래, 대기 Bench, 작은 개인물건이 반복된다.","Player + 2개 이상의 route starts + 여러 housing clusters.","먼 환풍기, 느슨한 난간, 여러 방향의 작은 생활 설비음.","…여기서 몇 명이나 살았던 거지.",null,`<rect class="wall" x="25" y="155" width="240" height="255"/><rect class="wall" x="285" y="95" width="215" height="315"/><rect class="wall" x="520" y="135" width="190" height="275"/><rect class="wall" x="730" y="75" width="205" height="335"/><line class="laundry" x1="65" y1="260" x2="230" y2="260"/><rect class="cloth" x="100" y="260" width="25" height="34"/><rect class="cloth" x="155" y="260" width="28" height="30"/><rect class="bench" x="330" y="380" width="85" height="18"/><circle class="plant" cx="565" cy="390" r="13"/><rect class="crate" x="785" y="372" width="42" height="38"/><g transform="translate(455 360)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`],
["S2 · BRAID A","CHOICE FROM ARCHITECTURE","길이 세 개로 색칠돼 있는 게 아니라 파손된 Gallery와 남아 있는 Balcony 때문에 자연스럽게 안전/Flow/Pressure 성향이 생긴다.","Route 사이가 서로 보이고 중간 Switch Deck이 보인다. 한 길에 들어갔다고 고정되지 않는다.","Next landing readability > housing detail.","Guard cue는 Pressure 쪽에서만 강하다. Safe/Flow에서도 위치는 인지 가능.","무대사",null,`<rect class="wall" x="45" y="120" width="270" height="290"/><rect class="wall" x="660" y="105" width="255" height="305"/><rect class="walk" x="75" y="360" width="250" height="18"/><rect class="walk" x="380" y="315" width="220" height="18"/><rect class="walk" x="660" y="380" width="250" height="18"/><circle class="enemy" cx="755" cy="342" r="18"/><g transform="translate(370 260)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="ghost" d="M360 280 Q250 220 180 340 M370 280 Q490 180 530 310 M385 290 Q650 240 755 350"/>`],
["S3 · SWITCH","CHOICE CAN CHANGE","첫 선택의 결과를 보고 다시 판단한다. Safe로 시작했다가 Flow로, Pressure에서 Recovery로 바꿀 수 있다.","여러 주거동의 공동 연결 Deck이 Route switch 역할을 한다.","Player + 최소 2개의 다음 방향.","Guard cue가 사라지고 먼 Patrol motor가 처음 들리기 시작.","무대사",null,`<rect class="walk" x="270" y="370" width="420" height="20"/><rect class="wall" x="30" y="90" width="220" height="320"/><rect class="wall" x="710" y="110" width="220" height="300"/><g transform="translate(480 335)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`],
["S4 · BRAID B","MOVING THREAT AS A PRICE","2-2에서 배운 Patrol을 다시 가르치지 않는다. 이번엔 얼마나 가까이 갈지 Player가 고른다.","Safe route는 Patrol 외곽, Flow는 짧게 교차, Pressure는 같은 Gallery를 오래 공유한다.","Camera follows Player route, not Drone.","Patrol motor already familiar. Lock/fire cue only when actual route creates exposure.","무대사",null,`<rect class="walk" x="60" y="385" width="840" height="18"/><circle class="enemy" cx="610" cy="320" r="18"/><g transform="translate(470 300)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g><path class="ghost" d="M150 350 Q300 210 455 350 M300 345 Q470 190 650 350 M410 350 Q650 270 790 350"/>`],
["S5 · MERGE","COMPARISON / RELIEF","Route가 다시 하나로 모인다. Player는 자기 선택이 빠르거나 안전했는지 자연스럽게 비교할 수 있다.","넓은 Shared Gallery. 이후에는 Enemy가 없다.","Default camera. Exit direction dominates.","Enemy cues fade. 2-5 쪽에서 더 공적인 Transit ambience가 들리기 시작.","무대사",null,`<rect class="wall" x="95" y="95" width="770" height="315"/><rect class="walk" x="170" y="410" width="650" height="20"/><g transform="translate(570 375)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`],
["S6 · EXIT","STORY PRESSURE NEXT","2-4는 생활 규모를 넓히는 데서 멈춘다. Evacuation의 명시적 정보는 2-5가 소유한다.","주거 Gallery가 보다 공적인 Upper Transit 구조로 바뀌기 시작한다.","No reveal pan. Exit only.","Residential ambience → transit PA / mechanical gate ambience.","무대사",null,`<rect class="walk" x="510" y="410" width="320" height="20"/><g transform="translate(690 375)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43" rx="8"/></g>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0].split(" · ")[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];title.textContent=b[0];sig.textContent=b[1];psych.textContent=b[2];space.textContent=b[3];camera.textContent=b[4];audio.textContent=b[5];dialogue.textContent=b[6];visual.innerHTML=b[8];caption.textContent=b[3];[...bs.children].forEach((x,j)=>x.classList.toggle("on",i===j));if(b[7]){toast.classList.remove("hidden");toast.querySelector("b").textContent=b[7][0];toast.querySelector("span").textContent=b[7][1]}else toast.classList.add("hidden");if(b[6]&&b[6]!=="무대사"){bark.classList.remove("hidden");bark.querySelector("b").textContent=b[6]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
