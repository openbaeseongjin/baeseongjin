<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-3 REV3 Story</title>
<style>
body{margin:0;background:#090b0f;color:#f1f0ea;font-family:system-ui,sans-serif}.wrap{max-width:1450px;margin:auto;padding:16px}h1{font-size:20px}.note,.card{background:#12161a;border:1px solid #454b50;border-radius:9px;padding:11px;margin-bottom:10px}.note{border-color:#6b5831;background:#19150c}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{background:#16201e;color:#eee;border:1px solid #485752;border-radius:7px;padding:7px 10px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.scene{position:relative;background:#0b1116;border:1px solid #454b50;border-radius:9px;aspect-ratio:16/9;overflow:hidden}.scene svg{width:100%;height:100%}.caption{position:absolute;bottom:10px;left:10px;right:10px;background:#050a0ddd;border-left:3px solid #d7b563;padding:9px}.toast{position:absolute;top:8%;left:50%;transform:translateX(-50%);background:#071118e8;border:1px solid #68766f;border-radius:6px;padding:8px 12px;text-align:center;min-width:290px}.hidden{display:none}.deck{fill:#606b6e}.player{fill:#eef5f8}.scanner{fill:#5de8ff;stroke:#fff;stroke-width:3}.patrol{fill:#8d4b3f;stroke:#ffba92;stroke-width:3}.support{fill:#553b68;stroke:#caa7ff;stroke-width:3}.ghost{stroke:#eef5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.35}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>3-3 CENTRAL RETAIL WALK · REV8 STORY / ATMOSPHERE · REV3</h1>
<div class="note"><b>방향성 수정:</b> 이번 버전은 단순히 공간을 복잡하게 만든 것이 아니라 <b>Player의 진행 벡터 자체를 ↗ → ↖ → ↘ → ↖ → ↗</b>로 바꾼다. 각 전환은 교차 배치된 Escalator Bank와 중앙 Gantry 때문에 생긴다.</div>
<div id="buttons" class="buttons"></div><div class="grid"><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#0b1116"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="caption" class="caption"></div></div><div><div class="card"><b>Movement</b><p id="move"></p></div><div class="card"><b>Purpose</b><p id="purpose"></p></div><div class="card"><b>Camera</b><p id="camera"></p></div><div class="card"><b>Dialogue</b><p>NONE</p></div></div></div></div>
<script>
const beats=[
["S0 Entry","↗","첫 에스컬레이터 뱅크를 오른쪽 위로 탄다.","Player + first upper-right landing.",["RETAIL SECURITY","ACTIVE"],`<rect class="deck" x="70" y="405" width="260" height="20"/><rect class="deck" x="650" y="250" width="220" height="20"/><g transform="translate(190 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M310 360 Q480 275 670 245"/>`],
["S1 East Mid","↖","다음 층의 에스컬레이터 방향이 반대로 꺾인다.","오른쪽 landing에서 왼쪽 위 Observation을 명확히 보여준다.",null,`<rect class="deck" x="665" y="405" width="220" height="20"/><rect class="deck" x="90" y="230" width="250" height="20"/><g transform="translate(710 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M690 350 Q500 245 320 225"/>`],
["S2 Observation","↘","안전한 서쪽 Balcony에서 아래 중앙 Security Gantry로 내려갈 타이밍을 읽는다.","C1/C2 + Patrol + central lower landing.",["VERTICAL SERVICE ROUTE","AUTHORIZATION INVALID"],`<rect class="deck" x="70" y="230" width="250" height="20"/><circle class="scanner" cx="480" cy="320" r="17"/><circle class="scanner" cx="625" cy="365" r="17"/><circle class="patrol" cx="565" cy="390" r="18"/><rect class="deck" x="735" y="405" width="170" height="20"/><g transform="translate(260 195)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S3 Security Dip","↘","Scanner와 Patrol을 읽고 의도적으로 아래/오른쪽으로 Commit한다.","Player가 '추락'이 아니라 목표가 있는 하강임을 읽게 한다.",["AUTOMATED PATROL","ONLINE"],`<circle class="scanner" cx="400" cy="270" r="17"/><circle class="scanner" cx="560" cy="340" r="17"/><circle class="patrol" cx="665" cy="365" r="18"/><rect class="deck" x="730" y="400" width="170" height="20"/><g transform="translate(315 210)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M330 230 Q485 300 740 385"/>`],
["S4 Central Gantry","↖","중앙 착지 후 다음 목적지는 다시 왼쪽 위다. 위협 구간은 여기서 끝난다.","Central safe landing + west-upper target.",null,`<rect class="deck" x="390" y="405" width="220" height="20"/><rect class="deck" x="70" y="220" width="240" height="20"/><g transform="translate(500 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M470 350 Q350 245 290 215"/>`],
["S5 West Upper","↗","Support Guard를 짧게 넘긴 뒤 마지막 방향을 다시 오른쪽 위로 전환한다.","Local combat only; Scanner/Patrol no longer in frame.",null,`<rect class="deck" x="70" y="405" width="330" height="20"/><circle class="support" cx="285" cy="365" r="18"/><rect class="deck" x="710" y="225" width="190" height="20"/><g transform="translate(180 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M390 345 Q550 250 720 220"/>`],
["S6 Exit","↗","높은 Exit Mezzanine으로 빠져나간다.","Player + 3-4 threshold.",null,`<rect class="deck" x="80" y="405" width="260" height="20"/><rect class="deck" x="680" y="220" width="220" height="20"/><g transform="translate(280 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M320 350 Q500 250 700 215"/>`]
];const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>show(i);bs.appendChild(x)});function show(i){const b=beats[i];move.textContent=b[1];purpose.textContent=b[2];camera.textContent=b[3];visual.innerHTML=b[5];caption.textContent=b[2];if(b[4]){toast.classList.remove("hidden");toast.innerHTML="<b>"+b[4][0]+"</b><br>"+b[4][1]}else toast.classList.add("hidden")}show(0);
</script></body></html>
