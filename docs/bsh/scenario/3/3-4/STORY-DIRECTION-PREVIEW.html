<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-4 Story</title>
<style>
body{margin:0;background:#090b0f;color:#f1f0ea;font-family:system-ui,sans-serif}.wrap{max-width:1450px;margin:auto;padding:16px}h1{font-size:20px}.note,.card{background:#12161a;border:1px solid #454b50;border-radius:9px;padding:11px;margin-bottom:10px}.note{border-color:#6b5831;background:#19150c}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{background:#16201e;color:#eee;border:1px solid #485752;border-radius:7px;padding:7px 10px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.scene{position:relative;background:#0b1116;border:1px solid #454b50;border-radius:9px;aspect-ratio:16/9;overflow:hidden}.scene svg{width:100%;height:100%}.caption{position:absolute;bottom:10px;left:10px;right:10px;background:#050a0ddd;border-left:3px solid #d7b563;padding:9px}.toast{position:absolute;top:8%;left:50%;transform:translateX(-50%);background:#071118e8;border:1px solid #68766f;border-radius:6px;padding:8px 12px;text-align:center;min-width:290px}.bark{position:absolute;bottom:12%;left:7%;background:#111a18ed;border:1px solid #6d8882;border-radius:7px;padding:8px 12px}.hidden{display:none}.deck{fill:#606b6e}.player{fill:#eef5f8}.scanner{fill:#5de8ff;stroke:#fff;stroke-width:3}.patrol{fill:#8d4b3f;stroke:#ffba92;stroke-width:3}.support{fill:#553b68;stroke:#caa7ff;stroke-width:3}.late{fill:#4f2b52;stroke:#f1a8e8;stroke-width:3}.wall{fill:#222b31;stroke:#607884;stroke-width:4}.ghost{stroke:#eef5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.35}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap"><h1>3-4 RETAIL SERVICE SPINE · REV8 STORY / ATMOSPHERE</h1>
<div class="note"><b>연출 핵심:</b> 선택창을 띄우지 않는다. Player가 실제 건축 단면에서 <b>왼쪽의 넓은 Public Front</b>와 <b>오른쪽의 좁은 Service Back</b>을 동시에 보고 고른다. Public은 공식 Authorization이 Invalid지만 물리적으로 남아 있고, Service는 Maintenance Clearance가 실제로 통한다.</div>
<div id="buttons" class="buttons"></div><div class="grid"><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#0b1116"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div><div id="caption" class="caption"></div></div><div><div class="card"><b>Purpose</b><p id="purpose"></p></div><div class="card"><b>Cost Profile</b><p id="cost"></p></div><div class="card"><b>Camera</b><p id="camera"></p></div><div class="card"><b>Dialogue</b><p id="dialogue"></p></div></div></div></div>
<script>
const beats=[
["S0 Split","실제 Public/Service 두 공간을 동시에 보여준다.","Public: 넓고 적은 Rope input, Scanner/Patrol. Service: 좁고 많은 input, Support Guard.","Player + both openings. 선택 UI 없음.","NONE",[["PUBLIC PROMENADE","←"],["FACILITY SERVICE","→"]],`<rect class="wall" x="420" y="125" width="120" height="300"/><rect class="deck" x="340" y="405" width="280" height="20"/><rect class="deck" x="65" y="260" width="260" height="20"/><rect class="deck" x="650" y="300" width="230" height="20"/><g transform="translate(480 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S1 Public Read","Public는 물리적으로 넓고 빠르지만 시스템상 허가되지 않은 경로다.","Fewer Rope inputs / Scanner timing / Patrol exposure.","Player + public deck + C1 + distant Patrol.","NONE",[["PUBLIC ROUTE","AUTHORIZATION INVALID"]],`<rect class="deck" x="60" y="405" width="410" height="20"/><circle class="scanner" cx="590" cy="300" r="17"/><circle class="patrol" cx="740" cy="355" r="18"/><g transform="translate(310 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S2 Service Read","Service에서는 Player의 유지보수 권한이 처음으로 실제 통과 권한으로 작동한다.","No Scanner / more Rope inputs / narrow landings / Support Guard.","Player + service panel + narrow static anchors.","…이쪽은 열리네.",[["FACILITY SERVICE ACCESS","MAINTENANCE CLEARANCE RECOGNIZED"],["LOCAL SERVICE ROUTE","AVAILABLE"]],`<rect class="wall" x="120" y="70" width="720" height="300"/><rect class="deck" x="320" y="405" width="220" height="20"/><circle cx="650" cy="300" r="14" fill="#5de8ff"/><circle class="support" cx="760" cy="360" r="18"/><g transform="translate(430 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S3 Public Commit","빠른 Public를 택하면 Scanner와 Patrol을 읽고 넓은 전면부를 통과한다.","Fast / exposed / timing-based.","Wide frame: Scanner state + Patrol + next broad deck.","NONE",null,`<rect class="deck" x="60" y="410" width="340" height="20"/><circle class="scanner" cx="500" cy="315" r="17"/><circle class="patrol" cx="665" cy="355" r="18"/><rect class="deck" x="730" y="250" width="180" height="20"/><g transform="translate(330 375)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M390 350 Q520 300 735 245"/>`],
["S4 Service Commit","Service를 택하면 Scanner 없이 좁은 구조를 여러 번 Rope로 연결한다.","Input-heavy / tighter / local combat.","Tighter camera with next static anchors only.","NONE",null,`<rect class="wall" x="90" y="80" width="780" height="320"/><circle cx="330" cy="340" r="13" fill="#5de8ff"/><circle cx="500" cy="265" r="13" fill="#5de8ff"/><circle cx="670" cy="190" r="13" fill="#5de8ff"/><g transform="translate(250 380)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M255 360 Q420 280 680 185"/>`],
["S5 Merge","서로 다른 비용을 지불한 두 경로가 같은 Upper Service Node에서 만난다.","FULL SAFE regroup / multiplayer convergence.","Player + both arrival directions + common upper path.","NONE",[["COMMERCIAL SERVICE NODE","UPPER LEVEL"]],`<rect class="deck" x="260" y="405" width="440" height="20"/><path class="ghost" d="M70 250 Q230 340 330 390"/><path class="ghost" d="M890 250 Q730 340 630 390"/><g transform="translate(480 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S6 Upper Guard","합류 뒤 공통 Late Pool Guard 하나만 상대한다.","Shared cost; route choice는 이미 끝남.","Ordinary combat framing.","NONE",null,`<rect class="deck" x="80" y="405" width="800" height="20"/><circle class="late" cx="650" cy="365" r="18"/><g transform="translate(450 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S7 Exit","3-5 Building Services Hub로 넘어간다.","Safe final traversal.","Player + easy exit anchor + service-hub threshold.","NONE",null,`<rect class="deck" x="80" y="405" width="280" height="20"/><rect class="deck" x="690" y="245" width="210" height="20"/><g transform="translate(310 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M345 350 Q520 260 710 240"/>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>show(i);bs.appendChild(x)});function show(i){const b=beats[i];purpose.textContent=b[1];cost.textContent=b[2];camera.textContent=b[3];dialogue.textContent=b[4];visual.innerHTML=b[6];caption.textContent=b[1];if(b[5]){toast.classList.remove("hidden");toast.innerHTML=b[5].map(x=>"<b>"+x[0]+"</b><br>"+x[1]).join("<br><br>")}else toast.classList.add("hidden");if(b[4]&&b[4]!=="NONE"){bark.classList.remove("hidden");bark.textContent=b[4]}else bark.classList.add("hidden")}show(0);
</script></body></html>
