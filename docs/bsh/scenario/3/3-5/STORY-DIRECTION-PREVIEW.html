<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-5 REV3 Story</title>
<style>
body{margin:0;background:#090b0f;color:#f1f0ea;font-family:system-ui,sans-serif}.wrap{max-width:1450px;margin:auto;padding:16px}h1{font-size:20px}.note,.card{background:#12161a;border:1px solid #454b50;border-radius:9px;padding:11px;margin-bottom:10px}.note{border-color:#6b5831;background:#19150c}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{background:#16201e;color:#eee;border:1px solid #485752;border-radius:7px;padding:7px 10px}.grid{display:grid;grid-template-columns:1.5fr .8fr;gap:12px}.scene{position:relative;background:#0b1116;border:1px solid #454b50;border-radius:9px;aspect-ratio:16/9;overflow:hidden}.scene svg{width:100%;height:100%}.caption{position:absolute;bottom:10px;left:10px;right:10px;background:#050a0ddd;border-left:3px solid #d7b563;padding:9px}.toast{position:absolute;top:7%;left:50%;transform:translateX(-50%);background:#071118e8;border:1px solid #68766f;border-radius:6px;padding:8px 12px;text-align:center;min-width:320px}.bark{position:absolute;bottom:12%;left:7%;background:#111a18ed;border:1px solid #6d8882;border-radius:7px;padding:8px 12px}.hidden{display:none}.deck{fill:#606b6e}.safe{fill:#34584b}.player{fill:#eef5f8}.enemy{fill:#553b68;stroke:#caa7ff;stroke-width:3}.late{fill:#4f2b52;stroke:#f1a8e8;stroke-width:3}.node{fill:#244f59;stroke:#77efff;stroke-width:4}.wall{fill:#1a2329;stroke:#657c86;stroke-width:4}.ghost{stroke:#eef5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.35}@media(max-width:900px){.grid{grid-template-columns:1fr}}

<h1>3-5 COMMERCIAL OPERATIONS HUB · REV8 STORY / ATMOSPHERE · REV3</h1>
<div class="note"><b>Sector 03 교정:</b> 산업 설비층이 아니다. 플레이어는 상업복합시설의 <b>매장 뒤 직원/물류 동선 → 운영 Balcony → Atrium Signage Catwalk → Tenant Transfer Deck</b>을 통과한다. 공간이 다양하지만 전부 CENTRAL EXCHANGE의 상업 운영 구조다.</div>
<div id="buttons" class="buttons"></div><div class="grid"><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#0b1116"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div><div id="caption" class="caption"></div></div>
<div><div class="card"><b>Purpose</b><p id="purpose"></p></div><div class="card"><b>Commercial Space</b><p id="space"></p></div><div class="card"><b>Camera</b><p id="camera"></p></div><div class="card"><b>Dialogue</b><p id="dialogue"></p></div></div></div></div>
<script>
const beats=[
["S0 Delivery Passage","3-4 Back-of-House에서 더 안쪽의 tenant delivery/staff circulation으로 들어간다.","매장 뒤 직원·재고 이동 통로. 낮고 압축된 상업 Back-of-House.","Player + route anchor + Entry Guard. Operations Balcony는 아직 감춤.","NONE",null,`<rect class="wall" x="430" y="70" width="390" height="300"/><rect class="deck" x="70" y="410" width="330" height="20"/><circle class="enemy" cx="330" cy="370" r="18"/><g transform="translate(185 375)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S1 Operations Rise","Delivery Passage에서 직원 Operations Balcony로 거의 수직 상승한다.","하부 물류/직원통로 → 보호된 운영공간으로 공간 성격 전환.","Player + vertical anchor + balcony above.","NONE",null,`<rect class="deck" x="110" y="430" width="250" height="18"/><circle cx="450" cy="330" r="13" fill="#5de8ff"/><rect class="safe" x="565" y="185" width="300" height="20"/><g transform="translate(315 395)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M330 380 Q410 305 565 190"/>`],
["S2 Safe Operations Balcony","Staff partition를 넘으면 전투 LOS가 끊기고 Calibration Frame이 나타난다.","Tenant operations/staff access pocket. 산업 제어실 아님.","Player + Node + teammate standing room.","NONE",[["COMMERCIAL FACILITY SERVICE NODE",""]],`<rect class="safe" x="120" y="405" width="720" height="22"/><rect class="node" x="435" y="255" width="90" height="150" rx="8"/><g transform="translate(330 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S3 Access Summary","Player의 Maintenance 정체성과 Local-vs-Vertical 권한 차이를 정리한다.","상업 운영 직원 공간에서만 조용히 표시.","No forced pan.","…내 구역 안에서는 통하는데.",[["EMPLOYEE CLASS","VERTICAL MAINTENANCE"],["LOCAL SERVICE CHANNEL","AVAILABLE"],["VERTICAL ROUTE AUTHORIZATION","INVALID"]],`<rect class="safe" x="120" y="405" width="720" height="22"/><rect class="node" x="435" y="255" width="90" height="150" rx="8"/><g transform="translate(330 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g>`],
["S4 Augment #3","Staff Equipment Calibration Frame에서 세 번째 generic Augment를 고른다.","완전 Safe. World continues; local chooser only.","Node remains spatially grounded.","NONE",null,`<rect class="safe" x="120" y="405" width="720" height="22"/><rect x="150" y="115" width="180" height="210" rx="10" fill="#17242b" stroke="#77efff"/><rect x="390" y="90" width="180" height="235" rx="10" fill="#17242b" stroke="#77efff"/><rect x="630" y="115" width="180" height="210" rx="10" fill="#17242b" stroke="#77efff"/>`],
["S5 Signage Catwalk","Node 뒤에서 Atrium 상부의 Signage Access Catwalk로 나간다.","행잉 사인/조명/wayfinding을 점검하는 상업 Atrium 상부 직원 통로.","Player + catwalk + distant transfer deck direction.","NONE",null,`<rect class="deck" x="100" y="395" width="300" height="20"/><rect class="deck" x="560" y="210" width="320" height="20"/><g transform="translate(330 360)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M350 345 Q475 250 580 205"/>`],
["S6 Tenant Transfer Drop","계속 상승하지 않고 상부 Catwalk에서 Tenant Transfer Deck으로 내려간다.","상층 매장 직원/재고 동선이 다시 모이는 측면 Back-of-House deck.","Player + drop target + Access-B carrier.","NONE",null,`<rect class="deck" x="80" y="190" width="310" height="20"/><rect class="deck" x="650" y="390" width="240" height="20"/><circle class="late" cx="770" cy="350" r="19"/><g transform="translate(300 155)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M330 175 Q500 260 660 380"/>`],
["S7 Grand Atrium Handoff","Tenant Transfer Deck에서 Upper Retail Link로 다시 올라가 3-6 Grand Central Atrium으로 향한다.","Back-of-House가 끝나고 다시 거대한 Public Atrium으로 나가기 직전.","Player + final anchor + brighter/open threshold.","NONE",null,`<rect class="deck" x="70" y="405" width="270" height="20"/><rect class="safe" x="690" y="225" width="210" height="20"/><g transform="translate(300 370)"><circle class="player" r="16"/><rect class="player" x="-11" y="12" width="22" height="43"/></g><path class="ghost" d="M335 350 Q515 250 710 220"/>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];purpose.textContent=b[1];space.textContent=b[2];camera.textContent=b[3];dialogue.textContent=b[4];visual.innerHTML=b[6];caption.textContent=b[1];if(b[5]){toast.classList.remove("hidden");toast.innerHTML=b[5].map(x=>"<b>"+x[0]+"</b><br>"+x[1]).join("<br><br>")}else toast.classList.add("hidden");if(b[4]&&b[4]!=="NONE"){bark.classList.remove("hidden");bark.textContent=b[4]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
