<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>3-6 Story / Atmosphere</title>
<style>
body{margin:0;background:#080a0e;color:#f1f0ea;font-family:system-ui,sans-serif}.wrap{max-width:1460px;margin:auto;padding:16px}h1{font-size:20px}.note,.card{background:#12161a;border:1px solid #454b50;border-radius:9px;padding:11px;margin-bottom:10px}.note{border-color:#6b5831;background:#19150c}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{background:#16201e;color:#eee;border:1px solid #485752;border-radius:7px;padding:7px 10px}.grid{display:grid;grid-template-columns:1.55fr .8fr;gap:12px}.scene{position:relative;background:#0b1116;border:1px solid #454b50;border-radius:9px;aspect-ratio:16/9;overflow:hidden}.scene svg{width:100%;height:100%}.caption{position:absolute;bottom:10px;left:10px;right:10px;background:#050a0ddd;border-left:3px solid #d7b563;padding:9px}.toast{position:absolute;top:7%;left:50%;transform:translateX(-50%);background:#071118e8;border:1px solid #68766f;border-radius:6px;padding:8px 12px;text-align:center;min-width:320px}.bark{position:absolute;bottom:12%;left:7%;background:#111a18ed;border:1px solid #6d8882;border-radius:7px;padding:8px 12px}.hidden{display:none}.deck{fill:#59656a}.safe{fill:#34584b}.player{fill:#eef5f8}.scanner{fill:#5de8ff;stroke:white;stroke-width:3}.patrol{fill:#8d4b3f;stroke:#ffba92;stroke-width:3}.support{fill:#553b68;stroke:#caa7ff;stroke-width:3}.late{fill:#4f2b52;stroke:#f1a8e8;stroke-width:3}.light{fill:#d9eff5;opacity:.12}.void{fill:#05090c}.ghost{stroke:#eef5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.35}.sign{fill:#d9eff5;opacity:.25}@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>3-6 GRAND CENTRAL ATRIUM · REV8 STORY / ATMOSPHERE</h1>
<div class="note"><b>연출 핵심:</b> 3-5의 좁은 직원 운영공간에서 나오자마자 화면 깊이와 높이가 폭발적으로 열린다. 사람은 없지만 <b>Premium Atrium의 전력·상업 네트워크·보안은 정상적으로 살아 있다.</b> 3-6은 설명보다 <b>거대한 공간을 Rope로 가로지르는 경험 자체</b>가 Story다.</div>
<div id="buttons" class="buttons"></div>
<div class="grid"><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#0b1116"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div><div id="caption" class="caption"></div></div>
<div><div class="card"><b>Purpose</b><p id="purpose"></p></div><div class="card"><b>Player Sees</b><p id="sees"></p></div><div class="card"><b>Camera</b><p id="camera"></p></div><div class="card"><b>Audio / Motion</b><p id="audio"></p></div><div class="card"><b>Dialogue</b><p id="dialogue"></p></div></div></div></div>
<script>
const beats=[
["S0 Atrium Reveal","3-5 압축에서 3-6 대공간으로의 Scale 폭발을 첫 2초 안에 느끼게 한다.","여러 층의 Public Balcony, 먼 East Event Balcony, 깊은 중앙 Void, 살아 있는 조명/디스플레이. 사람은 없음.","Player를 작게 두되 Rope target은 읽히는 wide framing. Final exit까지 한 번에 보여주지는 않음.","넓은 실내 잔향 + 멀리서 돌아가는 상업시설 ambience. 전투음 없음.","…잠깐, 위가 어디까지야.",[["PREMIUM ATRIUM",""]],`<rect class="void" x="180" y="95" width="650" height="360" rx="50"/><rect class="deck" x="40" y="430" width="230" height="20"/><rect class="deck" x="710" y="310" width="200" height="18"/><rect class="deck" x="650" y="130" width="220" height="18"/><rect class="sign" x="410" y="165" width="110" height="90"/><g transform="translate(180 395)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S1 Lower Flight","첫 Scanner를 장거리 Flow의 일부로 사용한다. Scanner 자체가 주인공이 아니다.","Player가 여러 Grapple point를 연속해서 타며 거대한 빈 중앙을 우상향으로 가로지름.","Horizontal lead가 충분히 앞서 다음 2개 target을 읽게 한다.","Rope/release 리듬이 공간 잔향 속에서 크게 들림. Security cue는 C1 부근에서만.","NONE",null,`<rect class="void" x="100" y="90" width="760" height="360" rx="45"/><g transform="translate(160 405)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g><circle class="scanner" cx="390" cy="320" r="16"/><circle cx="560" cy="260" r="12" fill="#5de8ff"/><circle cx="720" cy="205" r="12" fill="#5de8ff"/><path class="ghost" d="M180 385 Q410 255 745 195"/>`],
["S2 Powered Event Balcony","긴 비행 뒤 처음 멈추는 순간 이 Atrium이 단순히 불만 켜진 게 아니라 상업 운영 네트워크까지 살아 있음을 확인한다.","넓은 Event Balcony, 작동 중인 안내/광고 display, 짧은 Support Guard pressure.","Player + local Guard + Story display. 다음 수직 상승 target은 위쪽에 미리 보임.","상업 안내음/모터 ambience + 짧은 전투 cue.","NONE",[["LOCAL POWER BUS","ACTIVE"],["COMMERCIAL SERVICE NETWORK","ONLINE"]],`<rect class="deck" x="90" y="405" width="700" height="22"/><rect class="light" x="560" y="90" width="190" height="150"/><circle class="support" cx="610" cy="365" r="19"/><g transform="translate(330 370)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S3 East Sky Lobby","Support pressure를 벗어나 거의 수직으로 올라간 뒤, 완전 안전한 Balcony에서 중앙 Security Crossing을 읽는다.","반대편 West Upper Gallery, C2, Patrol의 얕은 대각선 이동이 한 프레임에 보임.","Player + C2 + Patrol path + far-left landing. 이 순간 다음 방향이 왼쪽임이 명확해야 함.","전투 cue 사라짐. Patrol motor가 중앙 공간을 횡단하며 위치를 알려줌.","NONE",null,`<rect class="deck" x="660" y="390" width="250" height="20"/><rect class="deck" x="70" y="170" width="250" height="20"/><circle class="scanner" cx="575" cy="320" r="16"/><path class="ghost" d="M570 325 Q390 250 280 190"/><circle class="patrol" cx="475" cy="280" r="18"/><g transform="translate(760 355)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S4 Security Crossing","C2 phase와 Patrol 위치를 읽고 Grand Atrium 중앙을 길게 왼쪽으로 가로지르는 Stage peak.","아래로 깊은 Void, 옆으로 이동하는 Patrol, 멀리 있는 West Gallery.","Wide enough to keep destination visible; Scanner state and Patrol remain readable.","Security motor + Rope release rhythm. hit/cut fantasy 금지.","NONE",null,`<rect class="void" x="90" y="110" width="780" height="350" rx="45"/><rect class="deck" x="60" y="190" width="230" height="20"/><rect class="deck" x="700" y="390" width="210" height="20"/><circle class="scanner" cx="650" cy="330" r="16"/><circle class="patrol" cx="500" cy="285" r="18"/><g transform="translate(760 355)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g><path class="ghost" d="M735 345 Q500 250 285 185"/>`],
["S5 West Upper Gallery","Security peak가 끝난 뒤 Late Guard 하나만 짧게 압박한다.","Upper Gallery와 다음 대형 Free-Flow arc가 동시에 읽힘.","Local combat frame. P3/C2는 화면 뒤로 빠져 pressure가 섞이지 않음.","짧은 Late enemy cue 후 공간 ambience가 다시 우세.","NONE",[["UPPER CONCOURSE",""]],`<rect class="deck" x="80" y="405" width="400" height="20"/><circle class="late" cx="350" cy="365" r="19"/><circle cx="620" cy="300" r="12" fill="#5de8ff"/><circle cx="790" cy="230" r="12" fill="#5de8ff"/><g transform="translate(200 370)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S6 Upper Free Flow","마지막은 보안이 아니라 순수한 Rope 이동의 보상으로 끝낸다.","Upper Atrium을 길게 우상향으로 가로지르며 3-7 threshold로 접근.","Forward lead; Player와 Rope line이 충분히 크게 유지됨.","음악/ambience가 가장 열리고 Security cue는 사라짐.","NONE",null,`<rect class="void" x="80" y="100" width="790" height="350" rx="45"/><g transform="translate(160 400)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g><circle cx="360" cy="325" r="12" fill="#5de8ff"/><circle cx="550" cy="260" r="12" fill="#5de8ff"/><circle cx="740" cy="190" r="12" fill="#5de8ff"/><path class="ghost" d="M180 385 Q430 290 765 180"/>`],
["S7 3-7 Handoff","Grand Atrium의 개방감이 끝나고 다음 Concourse에서 Access Control이 다시 강해질 것을 예고한다.","Upper Concourse threshold + Access Control signage. 세부 등급/우선순위 정보는 아직 없음.","Exit + next threshold only. 3-7 본문은 미리 보여주지 않음.","공간 ambience가 조금 좁아지고 Access terminal tone이 가까워짐.","NONE",[["ACCESS CONTROL AHEAD",""]],`<rect class="deck" x="90" y="405" width="350" height="20"/><rect class="deck" x="690" y="235" width="210" height="20"/><rect class="sign" x="720" y="115" width="160" height="80"/><g transform="translate(340 370)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];purpose.textContent=b[1];sees.textContent=b[2];camera.textContent=b[3];audio.textContent=b[4];dialogue.textContent=b[5];visual.innerHTML=b[7];caption.textContent=b[1];if(b[6]){toast.classList.remove("hidden");toast.innerHTML=b[6].map(x=>"<b>"+x[0]+"</b><br>"+x[1]).join("<br><br>")}else toast.classList.add("hidden");if(b[5]&&b[5]!=="NONE"){bark.classList.remove("hidden");bark.textContent=b[5]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
