<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-7 Story REV3 Priority Route</title>
<style>
body{margin:0;background:#080a0e;color:#f1f0ea;font-family:system-ui,sans-serif}.wrap{max-width:1460px;margin:auto;padding:16px}h1{font-size:20px}.note,.card{background:#12161a;border:1px solid #454b50;border-radius:9px;padding:11px;margin-bottom:10px}.note{border-color:#6b5831;background:#19150c}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{background:#16201e;color:#eee;border:1px solid #485752;border-radius:7px;padding:7px 10px}.grid{display:grid;grid-template-columns:1.55fr .85fr;gap:12px}.scene{position:relative;background:#0b1116;border:1px solid #454b50;border-radius:9px;aspect-ratio:16/9;overflow:hidden}.scene svg{width:100%;height:100%}.caption{position:absolute;bottom:10px;left:10px;right:10px;background:#050a0ddd;border-left:3px solid #d7b563;padding:9px}.toast{position:absolute;top:6%;left:50%;transform:translateX(-50%);background:#071118e8;border:1px solid #68766f;border-radius:6px;padding:8px 12px;text-align:center;min-width:360px}.bark{position:absolute;bottom:12%;left:7%;background:#111a18ed;border:1px solid #6d8882;border-radius:7px;padding:8px 12px}.hidden{display:none}.deck{fill:#59656a}.safe{fill:#34584b}.player{fill:#eef5f8}.scanner{fill:#5de8ff;stroke:white;stroke-width:3}.patrol{fill:#8d4b3f;stroke:#ffba92;stroke-width:3}.late{fill:#4f2b52;stroke:#f1a8e8;stroke-width:3}.sign{fill:#d9eff5;opacity:.23}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>3-7 TRANSFER MEZZANINE · STORY REV3 — PRIORITY ROUTE</h1>
<div class="note"><b>변경:</b> `SERVICE CLASS / STANDARD-PREMIUM / ACCESS TIER`를 플레이어-facing 핵심 스토리에서 제거. 3-7은 오직 <b>“상부에 우선 통로가 별도로 존재하고 현재도 활성 상태였다”</b>까지만 알려준다. 현재 Runtime 문구와 다르므로 구현 시 Story copy 변경이 필요하다.</div>
<div id="buttons" class="buttons"></div>
<div class="grid"><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#0b1116"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div><div id="caption" class="caption"></div></div>
<div><div class="card"><b>Purpose</b><p id="purpose"></p></div><div class="card"><b>Player Sees</b><p id="sees"></p></div><div class="card"><b>Boundary</b><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
["S0 Route Experience","세 이동방식의 차이는 먼저 Gameplay로 경험한다.","Outer / Priority / Facility Service가 한 Concourse 안에서 보인다.","아직 Story 설명 없음.",null,null,`<rect class="safe" x="350" y="425" width="260" height="20"/><circle class="scanner" cx="480" cy="265" r="15"/><circle class="patrol" cx="530" cy="305" r="17"/><circle class="late" cx="770" cy="320" r="17"/><g transform="translate(480 390)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S1 M2 Landing","Route를 통과한 뒤 완전 안전한 M2에 도착한다.","상부 Concourse Route-Control 단말.","A/B/C와 연결하지 않음.",null,null,`<rect class="safe" x="120" y="405" width="720" height="22"/><rect class="sign" x="385" y="135" width="230" height="210"/><g transform="translate(300 370)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S2 Route Control","일반/서비스 동선과 별도로 Priority Route가 활성 상태라는 사실만 확정한다.","정상 작동하는 상부 Route-Control 단말.","누가 Priority를 쓰는지는 UNKNOWN.",[["UPPER CONCOURSE ROUTE CONTROL",""],["PUBLIC / SERVICE ROUTES","ACTIVE"],["PRIORITY ROUTE","ACTIVE"]],null,`<rect class="safe" x="120" y="405" width="720" height="22"/><rect class="sign" x="385" y="135" width="230" height="210"/><g transform="translate(300 370)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S3 Player Bark","플레이어가 보이는 사실만 자연스럽게 확인한다.","같은 단말과 Priority Spine 방향.","A/B/C, 원인, 계층 해석 없음.",null,"…우선 통로가 따로 있었네.",`<rect class="safe" x="120" y="405" width="720" height="22"/><rect class="sign" x="385" y="135" width="230" height="210"/><g transform="translate(300 370)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S4 Handoff","다음 공간이 Transfer Control이라는 것만 예고한다.","UPPER MARKET GATE / TRANSFER CONTROL.","3-8에서 처음 C 기록과 Priority 상태를 병치.",[["UPPER MARKET GATE","TRANSFER CONTROL"]],null,`<rect class="deck" x="90" y="405" width="320" height="20"/><rect class="sign" x="700" y="105" width="170" height="100"/><g transform="translate(350 370)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];purpose.textContent=b[1];sees.textContent=b[2];boundary.textContent=b[3];visual.innerHTML=b[6];caption.textContent=b[1];if(b[4]){toast.classList.remove("hidden");toast.innerHTML=b[4].map(x=>"<b>"+x[0]+"</b><br>"+x[1]).join("<br><br>")}else toast.classList.add("hidden");if(b[5]){bark.classList.remove("hidden");bark.textContent=b[5]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
