<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>3-8 Story REV3 Priority Route</title>
<style>
body{margin:0;background:#080a0e;color:#f1f0ea;font-family:system-ui,sans-serif}.wrap{max-width:1480px;margin:auto;padding:16px}h1{font-size:20px}.note,.card{background:#12161a;border:1px solid #454b50;border-radius:9px;padding:11px;margin-bottom:10px}.note{border-color:#6b5831;background:#19150c}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{background:#16201e;color:#eee;border:1px solid #485752;border-radius:7px;padding:7px 10px}.grid{display:grid;grid-template-columns:1.55fr .85fr;gap:12px}.scene{position:relative;background:#0b1116;border:1px solid #454b50;border-radius:9px;aspect-ratio:16/9;overflow:hidden}.scene svg{width:100%;height:100%}.caption{position:absolute;bottom:10px;left:10px;right:10px;background:#050a0ddd;border-left:3px solid #d7b563;padding:9px}.toast{position:absolute;top:5%;left:50%;transform:translateX(-50%);background:#071118e8;border:1px solid #68766f;border-radius:6px;padding:8px 12px;text-align:center;min-width:370px}.bark{position:absolute;bottom:12%;left:7%;background:#111a18ed;border:1px solid #6d8882;border-radius:7px;padding:8px 12px}.hidden{display:none}.deck{fill:#59656a}.safe{fill:#34584b}.player{fill:#eef5f8}.screen{fill:#d9eff5;opacity:.20;stroke:#93a9b3;stroke-width:2}.cab{fill:#172126;stroke:#91a6ae;stroke-width:3}.ghost{stroke:#eef5f8;stroke-width:3;stroke-dasharray:8 10;fill:none;opacity:.35}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>3-8 UPPER EXCHANGE GATE · STORY REV3 — C SUSPENDED vs PRIORITY ACTIVE</h1>
<div class="note"><b>핵심 변경:</b> `이동 권한 / Access Tier` 이야기를 제거한다. 플레이어가 실제로 발견하는 두 사실은 단순하다. <b>GROUP C의 대피는 중단됐고, 같은 Incident Transfer Control 기록 환경에서 PRIORITY ROUTE는 ACTIVE로 남아 있다.</b> 둘의 원인은 아직 모른다.</div>
<div id="buttons" class="buttons"></div>
<div class="grid"><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#0b1116"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div><div id="caption" class="caption"></div></div>
<div><div class="card"><b>Purpose</b><p id="purpose"></p></div><div class="card"><b>Player Sees</b><p id="sees"></p></div><div class="card"><b>Boundary</b><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
["S0 Archive Arrival","Free-Weave 전투가 끝나고 Incident Transfer Control 기록 보관대에 도착한다.","하나의 cabinet 안에 LEFT 대피기록과 RIGHT 상부 통로상태 기록이 보인다.","아직 두 기록의 관계를 설명하지 않는다.",null,null,`<rect class="safe" x="100" y="420" width="760" height="22"/><rect class="cab" x="130" y="110" width="700" height="250" rx="12"/><rect class="screen" x="175" y="155" width="270" height="170"/><rect class="screen" x="515" y="155" width="270" height="170" opacity=".5"/><g transform="translate(330 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S1 LEFT · Evacuation Result","플레이어가 먼저 대피 결과를 읽는다.","A Complete / B Complete / C Suspended. 마지막 C Suspended가 화면에 남는다.","새 결과 없음.",[["EVACUATION TRANSFER RECORD","GROUP A · TRANSFER COMPLETE"],["GROUP B","TRANSFER COMPLETE"],["GROUP C","TRANSFER SUSPENDED"]],null,`<rect class="safe" x="100" y="420" width="760" height="22"/><rect class="cab" x="130" y="110" width="700" height="250" rx="12"/><rect class="screen" x="175" y="155" width="270" height="170"/><rect class="screen" x="515" y="155" width="270" height="170" opacity=".35"/><g transform="translate(330 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S2 Walk Right","왼쪽 기록이 끝나면 플레이어가 직접 오른쪽의 통로 상태 단말로 이동한다.","RIGHT terminal은 같은 cabinet 안에서 켜져 있다.","자동 카메라 이동이나 화살표 없음.",null,null,`<rect class="safe" x="100" y="420" width="760" height="22"/><rect class="cab" x="130" y="110" width="700" height="250" rx="12"/><rect class="screen" x="175" y="155" width="270" height="170" opacity=".7"/><rect class="screen" x="515" y="155" width="270" height="170"/><path class="ghost" d="M350 385 L600 385"/><g transform="translate(600 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S3 RIGHT · Route Status","오른쪽 단말에서 상부 이동로 상태를 확인한다.","PUBLIC/SERVICE ROUTES ACTIVE, PRIORITY ROUTE ACTIVE. 왼쪽에는 C SUSPENDED가 남아 있다.","누가 Priority를 썼는지는 말하지 않는다.",[["UPPER TRANSFER ROUTE STATUS","PUBLIC / SERVICE ROUTES · ACTIVE"],["PRIORITY ROUTE","ACTIVE"]],null,`<rect class="safe" x="100" y="420" width="760" height="22"/><rect class="cab" x="130" y="110" width="700" height="250" rx="12"/><rect class="screen" x="175" y="155" width="270" height="170"/><rect class="screen" x="515" y="155" width="270" height="170"/><text x="225" y="245" fill="#eef5f8" font-size="16">GROUP C</text><text x="215" y="275" fill="#eef5f8" font-size="16">TRANSFER SUSPENDED</text><text x="570" y="245" fill="#eef5f8" font-size="16">PRIORITY ROUTE</text><text x="625" y="275" fill="#eef5f8" font-size="16">ACTIVE</text><g transform="translate(600 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S4 Player Bark","화면에 두 사실이 동시에 남은 상태에서 플레이어가 그대로 읽어낸다.","LEFT: C SUSPENDED / RIGHT: PRIORITY ACTIVE.","인과관계는 아직 UNKNOWN.",null,"…C는 멈췄는데, 우선 통로는 열려 있었네.",`<rect class="safe" x="100" y="420" width="760" height="22"/><rect class="cab" x="130" y="110" width="700" height="250" rx="12"/><rect class="screen" x="175" y="155" width="270" height="170"/><rect class="screen" x="515" y="155" width="270" height="170"/><text x="225" y="245" fill="#eef5f8" font-size="16">GROUP C</text><text x="215" y="275" fill="#eef5f8" font-size="16">TRANSFER SUSPENDED</text><text x="570" y="245" fill="#eef5f8" font-size="16">PRIORITY ROUTE</text><text x="625" y="275" fill="#eef5f8" font-size="16">ACTIVE</text><g transform="translate(600 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S5 Final Control","답은 주지 않고 UPPER CONTROL / ROUTE STATUS PENDING에서 Sector 03을 끝낸다.","조용한 final deck과 pending status.","왜 C가 멈췄는지는 다음 Story로 넘긴다.",[["UPPER CONTROL","ROUTE STATUS PENDING"]],null,`<rect class="deck" x="100" y="405" width="760" height="22"/><rect class="screen" x="610" y="150" width="190" height="120"/><g transform="translate(330 370)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];purpose.textContent=b[1];sees.textContent=b[2];boundary.textContent=b[3];visual.innerHTML=b[6];caption.textContent=b[1];if(b[4]){toast.classList.remove("hidden");toast.innerHTML=b[4].map(x=>"<b>"+x[0]+"</b><br>"+x[1]).join("<br><br>")}else toast.classList.add("hidden");if(b[5]){bark.classList.remove("hidden");bark.textContent=b[5]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
