<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-1 REV3 Story Atmosphere</title>
<style>
body{margin:0;background:#090c0e;color:#f1f1eb;font-family:system-ui,sans-serif}.wrap{max-width:1460px;margin:auto;padding:16px}h1{font-size:20px}
.note,.card{background:#121719;border:1px solid #464d50;border-radius:9px;padding:11px;margin-bottom:10px}.note{background:#17170f;border-color:#6b6137}
.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{padding:7px 10px;background:#18211e;color:#eee;border:1px solid #515c56;border-radius:7px}
.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:12px}.scene{position:relative;aspect-ratio:16/9;background:#0d1517;border:1px solid #464d50;border-radius:9px;overflow:hidden}
.scene svg{width:100%;height:100%}.caption{position:absolute;bottom:10px;left:10px;right:10px;background:#06100ddd;border-left:3px solid #cbb66d;padding:9px}
.toast{position:absolute;top:6%;left:50%;transform:translateX(-50%);background:#081417eb;border:1px solid #697a76;border-radius:6px;padding:8px 12px;text-align:center;min-width:365px}
.bark{position:absolute;bottom:13%;left:8%;background:#111a18ed;border:1px solid #7b938a;border-radius:7px;padding:8px 12px}.hidden{display:none}
.sky{fill:#21343b}.building{fill:#43585c}.window{fill:#dfe1b8}.garden{fill:#45634d}.water{fill:#58828a}.deck{fill:#6b797b}.low{fill:#374f52}.player{fill:#f5f6ef}.patrol{fill:#9d6049;stroke:#ffc09a;stroke-width:3}.path{stroke:#ffc09a;stroke-width:3;stroke-dasharray:10 8;fill:none}.light{fill:#ded9a5}.lobby{fill:#52666a}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>4-1 UPPER RESIDENTIAL ARRIVAL · STORY / ATMOSPHERE REV3</h1>
<div class="note"><b>핵심 연출:</b> 높은 진입 테라스에서 “엄청난 정원 면적”을 먼저 내려다본 뒤, 플레이어가 그 공간으로 직접 내려가 통과한다. 4-1의 계층 대비는 설명이 아니라 <b>공간을 얼마나 넓게 생활환경에 쓰고 있는가</b>로 체감시킨다.</div>
<div id="buttons" class="buttons"></div>
<div class="grid"><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" class="sky"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div><div id="caption" class="caption"></div></div>
<div><div class="card"><b>Purpose</b><p id="purpose"></p></div><div class="card"><b>Player Sees</b><p id="sees"></p></div><div class="card"><b>Camera</b><p id="camera"></p></div><div class="card"><b>Audio / Motion</b><p id="audio"></p></div><div class="card"><b>Do Not Reveal</b><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
["S0 High Arrival","Sector04 첫 프레임에서 수직 높이보다 상층이 소비하는 수평 면적을 보여준다.","높은 왼쪽 테라스 아래로 넓은 sunken garden basin, 반대편 주거동, 유지되는 물과 조명.","Player를 작게 두고 Basin 바닥과 far-side residence를 동시에 포함. Scale reveal이 최우선.","Soft HVAC + 아래에서 들리는 물소리 + 먼 residential chime.","상층 거주자의 정체, Priority 사용자, Group C 관계.",null,null,`<rect class="building" x="40" y="65" width="235" height="320"/><rect class="building" x="720" y="75" width="205" height="315"/><path class="garden" d="M210 340 Q330 260 450 310 Q590 360 760 315 L820 420 L150 420 Z"/><rect class="water" x="320" y="370" width="330" height="18" rx="9"/><rect class="deck" x="40" y="250" width="250" height="20"/><g transform="translate(165 215)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S1 M0 Normality","Player가 아래로 내려가기 전 이 구역이 정상 운영 중임을 확인한다.","정돈된 정원, 순환하는 물, 켜진 보행등, intact residences. Patrol은 멀리 움직이지만 위협하지 않는다.","Player + Basin 전체 + far-side climb가 한 장면에 남는다.","Water circulation / ventilation / pathway light relay.","‘부유층’이라는 직접 설명, 왜 유지되는지.",[["UPPER RESIDENTIAL DISTRICT","ENVIRONMENTAL SERVICE / NORMAL"]],"…여긴 아직 다 돌아가고 있네.",`<rect class="building" x="50" y="70" width="240" height="310"/><rect class="building" x="725" y="75" width="190" height="305"/><path class="garden" d="M180 340 Q340 260 475 315 Q620 360 790 315 L840 420 L135 420 Z"/><rect class="water" x="325" y="370" width="330" height="18" rx="9"/><circle class="light" cx="270" cy="325" r="7"/><circle class="light" cx="700" cy="325" r="7"/><rect class="deck" x="40" y="250" width="260" height="20"/><g transform="translate(175 215)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S2 Descent","플레이어가 관찰자 위치에서 벗어나 실제로 Sunken Garden 안으로 내려간다.","주거 테라스가 위로 멀어지고, 낮은 정원 walkway와 water edge가 플레이 공간이 된다.","카메라는 Player를 따라 낮아지되 위쪽 M0와 far-side 목적지를 잠깐 함께 보여준다.","Footstep surface가 더 부드러워지고 물소리가 가까워진다.","낙하를 실패나 처벌처럼 연출하지 않는다.",null,null,`<rect class="building" x="45" y="55" width="220" height="270"/><rect class="deck" x="35" y="215" width="230" height="18"/><path class="garden" d="M150 355 Q370 290 500 325 Q650 365 835 320 L870 430 L100 430 Z"/><rect class="water" x="335" y="385" width="300" height="18" rx="9"/><rect class="low" x="230" y="410" width="470" height="20"/><g transform="translate(330 375)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S3 Basin Patrol","Sector04 Security를 처음 직접 읽되 아직 Pursuit는 시작하지 않는다.","정원 중심을 순환하는 Patrol Drone 한 기. Player는 낮은 Basin route를 계속 통과한다.","Player + Patrol loop + 다음 낮은 Rope point + far-side ascent base가 보이게 한다.","Patrol motor가 공간 안을 순환. Detection cue만 사용.","Persistent Pursuit, Override.",[["RESIDENTIAL SECURITY","ACTIVE"]],null,`<path class="garden" d="M70 335 Q320 275 485 320 Q680 375 900 310 L920 430 L45 430 Z"/><rect class="water" x="315" y="382" width="300" height="18" rx="9"/><rect class="low" x="70" y="410" width="820" height="20"/><path class="path" d="M350 260 L485 220 L620 260 L485 300 Z"/><circle class="patrol" cx="350" cy="260" r="20"/><g transform="translate(275 375)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S4 Far-side Ascent","넓은 공용 정원을 횡단한 뒤 반대편의 더 사적인 주거 frontage로 올라간다.","recessed façade와 여러 레벨의 balcony, 뒤로 멀어지는 Basin.","Player + recessed next ledge + 위쪽 Lobby 목표. Basin은 아래에 남는다.","Water ambience가 멀어지고 interior HVAC/door chime이 가까워진다.","왜 이곳이 보호되는지는 아직 답하지 않는다.",null,null,`<rect class="building" x="500" y="50" width="400" height="350"/><rect class="window" x="610" y="90" width="80" height="110"/><rect class="window" x="735" y="85" width="85" height="125"/><path class="garden" d="M30 390 Q260 315 520 370 L570 440 L20 440 Z"/><rect class="deck" x="450" y="390" width="410" height="20"/><g transform="translate(555 355)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S5 Private Lobby","첫 상층 주거 Stage를 안전한 사적 Lobby에서 마무리하고 Courtyard를 예고한다.","깨끗한 Lobby threshold와 안쪽 Resident Courtyard. Basin과 Patrol은 뒤로 사라짐.","Player + safe Lobby + Courtyard 방향만 남긴다.","Patrol motor 완전 fade. Quiet interior ambience.","Override A는 4-2에서 처음 공개.",[["RESIDENT COURTYARD","SECURITY CONTROL"]],null,`<rect class="lobby" x="105" y="65" width="750" height="335"/><rect class="window" x="610" y="125" width="145" height="190"/><rect class="garden" x="190" y="345" width="280" height="60" rx="25"/><rect class="deck" x="70" y="420" width="820" height="22"/><g transform="translate(535 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];purpose.textContent=b[1];sees.textContent=b[2];camera.textContent=b[3];audio.textContent=b[4];boundary.textContent=b[5];visual.innerHTML=b[8];caption.textContent=b[1];if(b[6]){toast.classList.remove("hidden");toast.innerHTML=b[6].map(x=>"<b>"+x[0]+"</b><br>"+x[1]).join("<br><br>")}else toast.classList.add("hidden");if(b[7]){bark.classList.remove("hidden");bark.textContent=b[7]}else bark.classList.add("hidden")}
show(0);
</script></body></html>
