<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-2 Resident Courtyard Story REV1</title>
<style>
body{margin:0;background:#090c0e;color:#f2f1eb;font-family:system-ui,sans-serif}.wrap{max-width:1460px;margin:auto;padding:16px}h1{font-size:20px}.note,.card{background:#121719;border:1px solid #464d50;border-radius:9px;padding:11px;margin-bottom:10px}.note{background:#17170f;border-color:#6b6137}
.buttons{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}button{padding:7px 10px;background:#18211e;color:#eee;border:1px solid #515c56;border-radius:7px}.grid{display:grid;grid-template-columns:1.6fr .8fr;gap:12px}.scene{position:relative;aspect-ratio:16/9;background:#0d1517;border:1px solid #464d50;border-radius:9px;overflow:hidden}.scene svg{width:100%;height:100%}.caption{position:absolute;bottom:10px;left:10px;right:10px;background:#06100ddd;border-left:3px solid #cbb66d;padding:9px}.toast{position:absolute;top:6%;left:50%;transform:translateX(-50%);background:#081417eb;border:1px solid #697a76;border-radius:6px;padding:8px 12px;text-align:center;min-width:365px}.hidden{display:none}
.sky{fill:#21343b}.building{fill:#43585c}.window{fill:#dfe1b8}.garden{fill:#45634d}.deck{fill:#6b797b}.arcade{fill:#354a4d}.player{fill:#f5f6ef}.pursuit{fill:#b85e52;stroke:#ffb0a6;stroke-width:3}.path{stroke:#ffb0a6;stroke-width:3;stroke-dasharray:10 8;fill:none}.override{fill:#8c67c9;stroke:#dbc8ff;stroke-width:3}
@media(max-width:900px){.grid{grid-template-columns:1fr}}
</style></head><body><div class="wrap">
<h1>4-2 RESIDENT COURTYARD · STORY / ATMOSPHERE REV1</h1>
<div class="note"><b>연출 핵심:</b> 4-2의 Story는 “상층이 보호된다”를 말로 설명하지 않는다. 정상적인 Resident Courtyard 안에서 Security가 Player를 실제로 쫓고, <b>건축적 안쪽 공간에 들어가면 추격이 끊기는 경험</b> 자체가 보호 시스템의 존재를 설명한다.</div>
<div id="buttons" class="buttons"></div>
<div class="grid"><div class="scene"><svg viewBox="0 0 960 540"><rect width="960" height="540" class="sky"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="caption" class="caption"></div></div>
<div><div class="card"><b>Purpose</b><p id="purpose"></p></div><div class="card"><b>Player Sees</b><p id="sees"></p></div><div class="card"><b>Camera</b><p id="camera"></p></div><div class="card"><b>Audio / Motion</b><p id="audio"></p></div><div class="card"><b>Boundary</b><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
["S0 Courtyard Read","4-1의 넓은 주거 환경에서 더 사적인 Courtyard Security로 들어간다.","정돈된 resident courtyard, 이동 가능한 exposed crescent, 멀리 Pursuit Drone 한 기, 안쪽 arcade opening.","Player + chase route + drone + arcade escape가 한 프레임에 읽힌다.","조용한 courtyard ambience + distant drone motor.","아직 Override A를 reward처럼 강조하지 않는다.",[["RESIDENT COURTYARD","SECURITY CONTROL / ACTIVE"]],`<rect class="building" x="40" y="80" width="240" height="310"/><rect class="building" x="700" y="85" width="220" height="305"/><path class="garden" d="M180 350 Q470 255 780 350 L820 420 L135 420 Z"/><rect class="deck" x="65" y="420" width="840" height="20"/><circle class="pursuit" cx="665" cy="260" r="20"/><g transform="translate(170 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S1 Tracking","첫 Pursuit acquire를 명확하게 체감한다.","Drone이 정적인 Patrol이 아니라 Player 방향으로 이동하기 시작한다.","Player + Pursuit + next Rope point + arcade escape 방향을 유지.","Drone motor 접근 + windup/dash cue. 별도 공포음 금지.","새 숫자 설명/tutorial box 없음.",[["RESIDENTIAL SECURITY","TRACKING"]],`<path class="garden" d="M90 345 Q470 240 865 345 L910 430 L50 430 Z"/><rect class="deck" x="50" y="420" width="860" height="20"/><path class="path" d="M600 220 L410 310"/><circle class="pursuit" cx="600" cy="220" r="20"/><g transform="translate(330 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S2 Arcade Break","플레이어가 Interior Arcade로 들어가며 제한 Pursuit Territory의 경계를 몸으로 배운다.","외부 courtyard가 뒤로 밀리고, 좁은 arcade 안쪽에서 Drone이 더 이상 따라오지 않는다.","카메라가 약간 좁아지지만 Player control은 그대로. Drone은 입구 바깥에 남음.","추격 motor가 빠르게 감쇠하고 interior HVAC가 전면으로.","‘안전구역’ UI처럼 과설명하지 않는다.",[["SECURITY CONTACT","LOST"]],`<rect class="building" x="80" y="60" width="800" height="350"/><rect class="arcade" x="300" y="160" width="380" height="245"/><rect class="deck" x="90" y="420" width="790" height="20"/><circle class="pursuit" cx="230" cy="300" r="20"/><g transform="translate(520 375)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S3 Override A","추격을 끊은 뒤 처음 Resident Security Override를 안전하게 발견한다.","작은 resident security vestibule의 Override terminal. 위협 없음.","Player + terminal + exit 방향. Courtyard chase는 프레임 밖.","조용한 terminal power tone + confirmation sound.","2-of-3 quorum 전체 규칙은 아직 굳이 설명하지 않음.",[["RESIDENT SECURITY OVERRIDE","SOURCE A"]],`<rect class="building" x="100" y="70" width="760" height="340"/><rect class="override" x="600" y="205" width="105" height="120" rx="10"/><rect class="deck" x="80" y="420" width="800" height="20"/><g transform="translate(500 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`],
["S4 Acquired / Handoff","Override A를 얻어도 Stage exit이 강제 연결되지 않으며 4-3 Skybridge를 예고한다.","terminal confirmation 뒤 상부 skybridge 방향.","Player + terminal residual + next space.","짧은 confirm tone → 외부 고층 ambience.","A를 못 먹어도 local exit은 가능해야 함.",[["RESIDENT SECURITY OVERRIDE","ACQUIRED"],["RESIDENTIAL SKYBRIDGE","SECURITY PATROL"]],`<rect class="building" x="70" y="80" width="300" height="300"/><rect class="building" x="690" y="80" width="210" height="300"/><rect class="deck" x="80" y="420" width="800" height="20"/><rect class="override" x="300" y="220" width="90" height="105" rx="10"/><g transform="translate(580 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`]
];
const bs=document.getElementById("buttons");beats.forEach((b,i)=>{const x=document.createElement("button");x.textContent=b[0];x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];purpose.textContent=b[1];sees.textContent=b[2];camera.textContent=b[3];audio.textContent=b[4];boundary.textContent=b[5];visual.innerHTML=b[7];caption.textContent=b[1];if(b[6]){toast.classList.remove("hidden");toast.innerHTML=b[6].map(x=>"<b>"+x[0]+"</b><br>"+x[1]).join("<br><br>")}else toast.classList.add("hidden")}
show(0);
</script></body></html>
