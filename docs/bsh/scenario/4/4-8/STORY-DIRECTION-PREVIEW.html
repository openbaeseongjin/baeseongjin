<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>4-8 Protected Ascent Gatehouse REV2 Story Direction</title>
<style>
:root{--bg:#071016;--panel:#0b171d;--line:#304955;--text:#eef5f5;--muted:#9fb0b6;--cyan:#5de8ff;--gold:#ffe173}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,Consolas,monospace}
header{padding:14px 18px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:19px}.sub{color:var(--muted)}
.wrap{padding:12px}.buttons{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
button{background:#13232b;color:var(--text);border:1px solid var(--line);border-radius:7px;padding:7px 10px;cursor:pointer}button.on{border-color:var(--cyan);color:var(--cyan)}
.grid{display:grid;grid-template-columns:minmax(620px,1.2fr) minmax(420px,.8fr);gap:12px}
.stage{position:relative;height:590px;background:#040b10;border:1px solid var(--line);border-radius:9px;overflow:hidden}
.stage svg{width:100%;height:100%}.toast{position:absolute;left:24px;top:24px;background:#07131ccc;border:1px solid #536d78;border-radius:8px;padding:9px 12px;min-width:250px}
.toast b{color:var(--cyan)}.bark{position:absolute;left:50%;bottom:40px;transform:translateX(-50%);background:#02070ccc;border:1px solid #7b8990;border-radius:8px;padding:10px 18px;min-width:360px;text-align:center}.bark .kr{font-family:system-ui,sans-serif;font-weight:700;font-size:22px}
.caption{position:absolute;right:18px;bottom:15px;color:#9fb1b7;font-size:11px}.hidden{display:none}.card{border:1px solid var(--line);border-radius:9px;background:var(--panel);padding:11px;margin-bottom:9px}.card h2{font-size:12px;color:var(--cyan);margin:0 0 7px}
.shell{fill:#0e1b21;stroke:#49636f;stroke-width:3}.deck{fill:#536b75;stroke:#afc1c7;stroke-width:2}.safe{fill:#365e4d;stroke:#7ed0a4;stroke-width:2}.gate{fill:#75633f;stroke:#d6c786;stroke-width:3}.panel{fill:#755f31;stroke:#ffe173;stroke-width:2}.player{fill:#dce8eb}.route{fill:none;stroke:#ffe173;stroke-width:5;stroke-dasharray:10 8}
@media(max-width:1120px){.grid{grid-template-columns:1fr}.stage{height:520px}}
</style></head>
<body>
<header><h1>4-8 PROTECTED ASCENT GATEHOUSE · REV2 STORY / DIRECTION</h1>
<div class="sub">MAP REV2 SYNC · DIRECTION CHANGES ARE ARCHITECTURAL · SYSTEM = FACT · PLAYER = REACTION</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid">
<div class="stage"><svg viewBox="0 0 960 540"><rect width="960" height="540" fill="#040b10"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"><div class="kr"></div></div><div id="caption" class="caption"></div></div>
<div><div class="card"><h2>PURPOSE</h2><p id="purpose"></p></div><div class="card"><h2>CAMERA / ROUTE READ</h2><p id="camera"></p></div><div class="card"><h2>VOICE</h2><p id="voice"></p></div><div class="card"><h2>AUDIO / MOTION</h2><p id="audio"></p></div><div class="card"><h2>PLAYER INTERPRETATION</h2><p id="emotion"></p></div><div class="card"><h2>BOUNDARY</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',title:'GATEHOUSE ARRIVAL',purpose:'4-7의 넓은 외부 Terrace에서 좁고 높은 Gatehouse로 압축하며 마지막 접근 판정임을 공간적으로 전환.',camera:'한 번에 직선 위쪽을 보여주지 않는다. Lower Console과 서로 반대편에 보이는 두 설비 Gallery를 동시에 읽혀 “위로 가지만 좌우를 바꿔야 한다”는 구조를 먼저 암시.',voice:'NONE.',audio:'외부 ambience 감소, pressurization hum 증가.',emotion:'“정면 승강로가 아니라 시설관리 Gallery를 따라 돌아 올라가야 한다.”',boundary:'사용자 계층 설명 금지.',toast:[['PROTECTED ASCENT GATE','RESIDENT SECURITY CHECK']],bark:null,caption:'SHOW THE SWITCHBACK BEFORE PLAY.',scene:`<rect class="shell" x="180" y="60" width="600" height="420"/><rect class="safe" x="200" y="420" width="240" height="20"/><rect class="deck" x="570" y="335" width="180" height="18"/><rect class="deck" x="210" y="230" width="180" height="18"/><rect class="deck" x="560" y="135" width="180" height="18"/><path class="route" d="M310 405 Q520 360 650 335 Q460 285 300 235 Q470 180 650 140"/><g transform="translate(290 385)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`},
{id:'S1',title:'QUORUM READ',purpose:'A/B/C 현재 상태를 읽고 Gate 접근권을 판정한다.',camera:'Lower Security Landing에 안정적으로 고정. 이후 성공 시 첫 목적지를 오른쪽 위 Mechanical Face로 팬.',voice:'NONE.',audio:'보유 Override별 relay tick + 최종 판정 tone.',emotion:'“지나온 선택이 실제 세계 접근권이 된다.”',boundary:'왜 2개면 충분한지 설명 금지.',toast:[['RESIDENT SECURITY','A / B / C'],['GATE REQUIREMENT','2 OF 3']],bark:null,caption:'STATE → WORLD ACCESS.',scene:`<rect class="safe" x="120" y="410" width="720" height="24"/><rect class="panel" x="310" y="150" width="340" height="190" rx="10"/><g transform="translate(450 375)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`},
{id:'S2',title:'LOWER EAST FACE',purpose:'Gate 해제 후 첫 상승은 우측 설비면을 따라 진행한다.',camera:'오른쪽 위 Gallery를 먼저 보여준 뒤 다음 Hook 직전 중앙 Crossover를 슬쩍 노출. 전체 Final Deck은 숨긴다.',voice:'NONE. Rope 구간.',audio:'actuator/vent machinery가 가까워진다.',emotion:'“Gatehouse 내부가 한 방향 사다리가 아니라 층별 설비면을 돌아가는 구조다.”',boundary:'정책 설명 없음.',toast:null,bark:null,caption:'UP + RIGHT.',scene:`<rect class="shell" x="210" y="50" width="540" height="440"/><rect class="deck" x="240" y="405" width="170" height="18"/><rect class="deck" x="430" y="315" width="170" height="18"/><rect class="deck" x="600" y="210" width="150" height="18"/><path class="route" d="M310 390 Q450 350 500 310 Q600 260 650 215"/><g transform="translate(300 365)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`},
{id:'S3',title:'CENTER CROSSOVER',purpose:'첫 설비면 끝에서 중앙을 가로질러 반대쪽 West Gallery로 방향을 전환한다.',camera:'Player가 우측 끝에 닿는 순간 카메라가 왼쪽 위 다음 Gallery를 잡아 방향 반전을 명확하게 전달.',voice:'NONE.',audio:'vent hum이 줄고 central pressure-core resonance가 커진다.',emotion:'“위로 가려면 이제 반대 설비면으로 건너가야 한다.”',boundary:'NONE.',toast:null,bark:null,caption:'FIRST HARD DIRECTION CHANGE.',scene:`<rect class="shell" x="180" y="60" width="600" height="420"/><rect class="deck" x="570" y="380" width="160" height="18"/><rect class="deck" x="390" y="290" width="160" height="18"/><rect class="deck" x="190" y="190" width="170" height="18"/><path class="route" d="M650 365 Q520 320 470 295 Q340 250 270 195"/><g transform="translate(640 340)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`},
{id:'S4',title:'MID INTERLOCK',purpose:'West Gallery 끝에서 첫 긴 상승을 끊고 완전 안전하게 리듬을 재설정.',camera:'수평 안정. 다음 Upper Lock이 반대편 오른쪽에 있다는 점만 보여준다.',voice:'NONE.',audio:'seal tone + pressure equalization.',emotion:'“Lock 하나를 통과했지만 다음 설비면은 다시 반대편이다.”',boundary:'NONE.',toast:[['ASCENT INTERLOCK','LOWER CHAMBER SEALED'],['UPPER CHAMBER','READY']],bark:null,caption:'FULL SAFE RESET.',scene:`<rect class="safe" x="160" y="400" width="600" height="24"/><rect class="gate" x="470" y="180" width="260" height="44"/><g transform="translate(350 365)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`},
{id:'S5',title:'UPPER EAST FACE',purpose:'두 번째 상승은 다시 오른쪽으로 전환해 Upper Service Face를 탄다.',camera:'Final Deck을 아직 감추고 East upper equipment rail만 명확히 읽힌다.',voice:'NONE.',audio:'steady power hum. 전투 cue 없음.',emotion:'“같은 패턴이지만 더 짧고 자신 있게 읽힌다.”',boundary:'NONE.',toast:null,bark:null,caption:'SECOND RIGHTWARD ASCENT.',scene:`<rect class="shell" x="210" y="50" width="540" height="440"/><rect class="deck" x="250" y="405" width="160" height="18"/><rect class="deck" x="430" y="300" width="170" height="18"/><rect class="deck" x="600" y="200" width="150" height="18"/><path class="route" d="M320 390 Q480 345 510 300 Q620 250 650 205"/><g transform="translate(310 365)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`},
{id:'S6',title:'FINAL WEST RETURN',purpose:'마지막에 한 번 더 좌측으로 돌아 Final Control side에 도달해 Stage silhouette를 단순 대각선으로 끝내지 않는다.',camera:'우측 상부 Gallery 도달 순간 Final Control을 왼쪽 위에 공개. 마지막 방향 반전이 Finale의 시각적 마침표.',voice:'NONE. 마지막 Rope에 대사 없음.',audio:'relay hum이 점점 선명해지고 threat music은 없음.',emotion:'“Gatehouse 전체를 돌아 최종 제어면에 도달했다.”',boundary:'NONE.',toast:null,bark:null,caption:'FINAL DIRECTION REVERSAL.',scene:`<rect class="shell" x="180" y="60" width="600" height="420"/><rect class="deck" x="590" y="390" width="150" height="18"/><rect class="deck" x="410" y="300" width="160" height="18"/><rect class="deck" x="230" y="210" width="160" height="18"/><rect class="safe" x="120" y="120" width="220" height="22"/><path class="route" d="M650 375 Q520 330 490 300 Q360 250 300 215 Q230 170 210 125"/><g transform="translate(640 345)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`},
{id:'S7',title:'FINAL ASCENT CONTROL',purpose:'Sector04가 보호 공간이 실제 정상 운용 중이라는 사실까지만 닫고 원인은 다음 Sector로 넘긴다.',camera:'완전 안전 착지 후 카메라 안정. 위쪽 Control Access만 일부 보임.',voice:'“…여긴 아직도 정상이라고?”',audio:'공간음 잠깐 비운 뒤 Bark, 이후 power hum 복귀.',emotion:'“아래의 붕괴와 달리 이 보호 상승 체계는 정상에 가깝다.”',boundary:'누가 보호되는지/누가 명령했는지/Continuity policy 이름은 Sector05.',toast:[['PROTECTED ASCENT','POWER NORMAL'],['ASCENT CONTROL','READY']],bark:'…여긴 아직도 정상이라고?',caption:'FACT → SHOCK.',scene:`<rect class="safe" x="120" y="410" width="720" height="24"/><rect class="panel" x="330" y="140" width="300" height="170" rx="10"/><g transform="translate(470 375)"><circle class="player" r="14"/><rect class="player" x="-10" y="12" width="20" height="38"/></g>`}
];
const buttons=document.getElementById('buttons');beats.forEach((b,i)=>{let bt=document.createElement('button');bt.textContent=`${b.id} · ${b.title}`;bt.onclick=()=>show(i);buttons.appendChild(bt)});
function show(i){let b=beats[i];purpose.textContent=b.purpose;camera.textContent=b.camera;voice.textContent=b.voice;audio.textContent=b.audio;emotion.textContent=b.emotion;boundary.textContent=b.boundary;visual.innerHTML=b.scene;caption.textContent=b.caption;[...buttons.children].forEach((x,j)=>x.classList.toggle('on',i===j));if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden');if(b.bark){bark.classList.remove('hidden');bark.querySelector('.kr').textContent=b.bark}else bark.classList.add('hidden')}
show(0);
</script></body></html>
