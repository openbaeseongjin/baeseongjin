<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5-2 Control Atrium Story Direction REV1</title>
<style>
:root{--bg:#071016;--panel:#0b171d;--line:#304955;--text:#eef5f5;--muted:#9fb0b6;--cyan:#5de8ff;--blue:#8ab9ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,Consolas,monospace}header{padding:14px 18px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:19px}.sub{color:var(--muted)}
.wrap{padding:12px}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{background:#13232b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}button.on{color:var(--cyan);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.stage{height:560px;position:relative;background:#03090d;border:1px solid var(--line);border-radius:8px;overflow:hidden}.stage svg{width:100%;height:100%}
.toast{position:absolute;left:24px;top:24px;min-width:260px;background:#07131cdd;border:1px solid #596f79;border-radius:8px;padding:10px 12px}.toast b{color:var(--cyan)}.hidden{display:none}.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;margin-bottom:8px}.card h2{font-size:12px;color:var(--cyan);margin:0 0 6px}
.glass{fill:#75a9b622;stroke:#9dc8d4;stroke-width:3}.deck{fill:#50656f;stroke:#aebfc5;stroke-width:2}.safe{fill:#355e4d;stroke:#76cf9d;stroke-width:2}.hp{fill:#5de8ff;stroke:white;stroke-width:2}.enemy{fill:#91baff;stroke:white;stroke-width:3}.shield{fill:#76a8ff22;stroke:#8ab9ff;stroke-width:3}.player{fill:#eef5f6}.route{fill:none;stroke:#ffe16f;stroke-width:4;stroke-dasharray:10 7}text{fill:#edf5f6;font-size:12px;paint-order:stroke;stroke:#061015;stroke-width:5}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>5-2 CONTROL ATRIUM · STORY / DIRECTION REV1</h1><div class="sub">FIRST AEGIS · SYSTEM FACTS ONLY · NO PLAYER BARK · USER APPROVAL REQUIRED</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid"><div class="stage">
<svg viewBox="0 0 920 540"><rect width="920" height="540" fill="#03090d"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div></div>
<div><div class="card"><h2>PURPOSE</h2><p id="purpose"></p></div><div class="card"><h2>CAMERA / TIMING</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / TELEGRAPH</h2><p id="audio"></p></div><div class="card"><h2>PLAYER READ</h2><p id="meaning"></p></div><div class="card"><h2>STORY BOUNDARY</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',name:'CONTROL ATRIUM ARRIVAL',purpose:'5-1의 Sealed-vs-Hardpoint 문법을 유지하면서, 이번에는 그 Hardpoint route를 감시하는 방향성 Security가 있음을 먼저 보여준다.',camera:'P0 Full Safe에서 AEGIS A, 전면 Shield 방향, H2/H3와 partition edge를 한 프레임에 읽힌다. 입력 잠금 없음.',audio:'Control hum + 낮은 security motor. 전투 sting 없음.',meaning:'“정면 bridge는 보안이 보고 있고, 옆 maintenance frame으로 돌아갈 수 있다.”',boundary:'Capacity/Priority/Authorization 공개 없음.',toast:[['CONTROL ATRIUM','CONTINUITY SECURITY / ACTIVE']],scene:`<rect class="glass" x="470" y="70" width="120" height="350"/><rect class="safe" x="80" y="400" width="300" height="22"/><circle class="hp" cx="430" cy="260" r="13"/><circle class="hp" cx="570" cy="190" r="13"/><circle class="enemy" cx="620" cy="330" r="22"/><path class="shield" d="M620 330 L480 250 A170 170 0 0 1 480 410 Z"/><g transform="translate(245 365)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S1',name:'AEGIS A READ',purpose:'첫 AEGIS는 다른 적 없이 방패 방향과 측면 이동의 관계만 가르친다.',camera:'Shield와 다음 side Hardpoint가 동시에 보인다. Shield arc를 UI 부채꼴로 그리는 것이 아니라 적 visual 방향으로 읽혀야 한다.',audio:'AEGIS turn motor + projectile acquire telegraph. Rope-cut sound 사용 금지.',meaning:'“정면 충돌은 막힌다. 빠르게 옆/위로 각도를 바꿔야 한다.”',boundary:'AEGIS 이름을 Story 정보처럼 설명하지 않는다.',toast:null,scene:`<rect class="glass" x="350" y="70" width="120" height="360"/><rect class="deck" x="455" y="330" width="280" height="20"/><circle class="enemy" cx="590" cy="305" r="23"/><path class="shield" d="M590 305 L430 225 A180 180 0 0 1 430 385 Z"/><circle class="hp" cx="300" cy="180" r="13"/><circle class="hp" cx="420" cy="120" r="13"/><path class="route" d="M220 390 Q260 230 300 180 Q360 130 420 120"/><g transform="translate(220 365)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S2',name:'LOWER FLANK COMMIT',purpose:'Partition edge를 따라 90° 이상 이동해 Shield가 따라오기 전에 side/rear attack window 또는 안전 bypass를 만든다.',camera:'Player 진행 방향을 위/옆으로 bias. AEGIS가 화면 밖으로 완전히 사라지지 않게 하되, Player보다 더 중요한 중앙 피사체로 만들지 않는다.',audio:'공격 중 대사 없음. projectile/Shield turn/Rope만.',meaning:'“죽일 필요는 없지만 정면으로 밀어붙이는 것보다 측면 route가 유리하다.”',boundary:'Kill objective 없음.',toast:null,scene:`<rect class="glass" x="390" y="80" width="120" height="340"/><circle class="enemy" cx="580" cy="320" r="22"/><path class="shield" d="M580 320 L450 240 A160 160 0 0 1 450 400 Z"/><circle class="hp" cx="310" cy="160" r="13"/><circle class="hp" cx="500" cy="110" r="13"/><path class="route" d="M240 390 Q290 220 310 160 Q400 110 500 110"/><g transform="translate(490 150)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S3',name:'POST-AEGIS SAFE READ',purpose:'첫 encounter 뒤 Story Fact를 하나만 추가한다: 실제 upper control floor가 여전히 powered다.',camera:'M0/P1 Safe deck에서 threat framing을 종료하고 control display와 다음 partition을 읽힌다.',audio:'Threat layer fade → neutral system confirmation.',meaning:'“Control Network가 online일 뿐 아니라 실제 upper control layer도 powered다.”',boundary:'왜 powered인지 아직 말하지 않는다.',toast:[['UPPER CONTROL','POWERED']],scene:`<rect class="safe" x="120" y="405" width="650" height="22"/><rect class="glass" x="590" y="80" width="180" height="250"/><g transform="translate(400 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S4',name:'AEGIS B REVERSE FLANK',purpose:'두 번째 AEGIS는 partition 방향을 반대로 두어 같은 원리를 복사하지 않고 opposite-side flank로 재확인한다.',camera:'P1에서 AEGIS B + opposite-side service frame을 함께 보여준다.',audio:'동일한 AEGIS telegraph family. 새 mechanic cue 추가 없음.',meaning:'“방패의 정답 방향이 고정된 것이 아니라, 내 위치와 공간 구조에 따라 계속 달라진다.”',boundary:'Jammer preview 금지. Hardpoint 자체는 아직 항상 정상.',toast:null,scene:`<rect class="glass" x="300" y="70" width="120" height="360"/><rect class="deck" x="100" y="320" width="300" height="20"/><circle class="enemy" cx="270" cy="295" r="22"/><path class="shield" d="M270 295 L430 215 A180 180 0 0 0 430 375 Z"/><circle class="hp" cx="510" cy="190" r="13"/><circle class="hp" cx="650" cy="120" r="13"/><path class="route" d="M720 390 Q620 250 510 190 Q590 130 650 120"/><g transform="translate(720 365)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S5',name:'FINAL CONTROL DECK',purpose:'두 AEGIS band를 통과한 뒤 이곳의 Security가 사고 상황에서도 active였다는 운영 사실만 고정한다.',camera:'완전 안전. upper command architecture scale을 다시 확보.',audio:'combat layer 완전 종료. control hum만.',meaning:'“이곳은 살아 있을 뿐 아니라 계속 지켜지고 있다.”',boundary:'보호 대상/명령 주체/우선순위 공개 없음.',toast:[['CONTINUITY SECURITY','ACTIVE']],scene:`<rect class="safe" x="100" y="400" width="700" height="24"/><rect class="glass" x="560" y="80" width="220" height="250"/><g transform="translate(430 365)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S6',name:'5-3 HANDOFF',purpose:'다음 Security Review 공간의 접근 제한만 예고하고 Jammer의 동작은 소비하지 않는다.',camera:'Exit를 상단 1/3에 두고 다음 Gallery 일부만 보인다.',audio:'restricted access tone. 위협 cue 없음.',meaning:'“다음에는 기록/Review 접근 자체가 제한되어 있다.”',boundary:'Incident record 내용은 5-3이 소유.',toast:[['SECURITY REVIEW GALLERY','ACCESS RESTRICTED']],scene:`<rect class="safe" x="100" y="410" width="680" height="22"/><rect class="glass" x="610" y="80" width="170" height="270"/><path class="route" d="M430 385 Q560 270 680 180"/><g transform="translate(430 375)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`}
];
const bs=document.getElementById('buttons');beats.forEach((b,i)=>{const x=document.createElement('button');x.textContent=b.id+' · '+b.name;x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];[...bs.children].forEach((x,j)=>x.classList.toggle('on',j===i));purpose.textContent=b.purpose;camera.textContent=b.camera;audio.textContent=b.audio;meaning.textContent=b.meaning;boundary.textContent=b.boundary;visual.innerHTML=b.scene;if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden')}
show(0);
</script></body></html>
