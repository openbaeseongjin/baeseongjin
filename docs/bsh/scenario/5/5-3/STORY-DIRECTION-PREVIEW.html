<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5-3 Security Review Gallery Story Direction REV2</title>
<style>
:root{--bg:#071016;--panel:#0b171d;--line:#304955;--text:#eef5f5;--muted:#9fb0b6;--cyan:#5de8ff;--jam:#c56cff;--warn:#ffc35c}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:13px/1.5 ui-monospace,Consolas,monospace}header{padding:14px 18px;border-bottom:1px solid var(--line)}h1{margin:0;font-size:19px}.sub{color:var(--muted)}
.wrap{padding:12px}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{background:#13232b;color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}button.on{color:var(--cyan);border-color:var(--cyan)}
.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.stage{height:560px;position:relative;background:#03090d;border:1px solid var(--line);border-radius:8px;overflow:hidden}.stage svg{width:100%;height:100%}
.toast{position:absolute;left:24px;top:24px;min-width:280px;background:#07131cdd;border:1px solid #596f79;border-radius:8px;padding:10px 12px}.toast b{color:var(--cyan)}.bark{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#07131cdd;border:1px solid #73858c;border-radius:8px;padding:10px 16px;font-family:system-ui,sans-serif;font-size:20px;font-weight:700}.hidden{display:none}
.card{border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:10px;margin-bottom:8px}.card h2{font-size:12px;color:var(--cyan);margin:0 0 6px}
.archive{fill:#45545d;stroke:#87989f;stroke-width:3}.glass{fill:#75a9b622;stroke:#9dc8d4;stroke-width:3}.safe{fill:#355e4d;stroke:#76cf9d;stroke-width:2}.hp{fill:#5de8ff;stroke:white;stroke-width:2}.jammer{fill:#a751cf;stroke:#f0d8ff;stroke-width:3}.warn{fill:none;stroke:#ffc35c;stroke-width:4;stroke-dasharray:5 4}.jam{fill:#b956df;stroke:#ffdeff;stroke-width:4}.player{fill:#eef5f6}.route{fill:none;stroke:#ffe16f;stroke-width:4;stroke-dasharray:10 7}text{fill:#edf5f6;font-size:12px;paint-order:stroke;stroke:#061015;stroke-width:5}
@media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>5-3 SECURITY REVIEW GALLERY · STORY / DIRECTION REV2</h1><div class="sub">NEW SILHOUETTE · FIRST HARDPOINT JAMMER · STORY BOUNDARY UNCHANGED</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid"><div class="stage">
<svg viewBox="0 0 920 540"><rect width="920" height="540" fill="#03090d"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div></div>
<div><div class="card"><h2>PURPOSE</h2><p id="purpose"></p></div><div class="card"><h2>CAMERA / TIMING</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / VFX</h2><p id="audio"></p></div><div class="card"><h2>PLAYER READ</h2><p id="meaning"></p></div><div class="card"><h2>STORY BOUNDARY</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',name:'VERTICAL ARRIVAL',purpose:'5-2의 대각 상승 리듬을 끊고 중앙 수직 Spine으로 바로 올라가며 공간 리듬을 리셋한다.',camera:'Entry와 위쪽 P0, 중앙 Archive Wall 하부가 수직 축으로 읽힌다.',audio:'Clean archive/control ambience. threat cue 없음.',meaning:'“이번 공간은 옆으로 흘러가는 Atrium이 아니라 위로 쌓인 Review Stack이다.”',boundary:'기록 내용 공개 없음.',toast:[['SECURITY REVIEW GALLERY','ACCESS RESTRICTED']],bark:null,scene:`<rect class="safe" x="385" y="415" width="150" height="20"/><rect class="archive" x="335" y="90" width="250" height="210"/><circle class="hp" cx="460" cy="365" r="13"/><circle class="hp" cx="460" cy="315" r="13"/><g transform="translate(460 395)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S1',name:'BAY A LEFT / RIGHT READ',purpose:'첫 Archive Wall에서 좌우 두 Rail 모두 실제 경로임을 Jam 이전에 보여준다.',camera:'중앙 Player, 좌/우 candidate, 위쪽 merge 방향을 한 프레임에 둔다.',audio:'Jammer idle hum만.',meaning:'“왼쪽도 오른쪽도 올라갈 수 있다.”',boundary:'UI가 정답 방향을 지정하지 않는다.',toast:null,bark:null,scene:`<rect class="archive" x="345" y="130" width="230" height="250"/><circle class="hp" cx="285" cy="260" r="14"/><circle class="hp" cx="635" cy="260" r="14"/><circle class="hp" cx="460" cy="90" r="14"/><path class="route" d="M460 430 Q330 360 285 260 Q330 130 460 90 M460 430 Q590 360 635 260 Q590 130 460 90"/><g transform="translate(460 405)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S2',name:'JAMMER A',purpose:'두 candidate 중 하나만 Warning→Jam 하고, 다른 쪽은 그대로 남긴다.',camera:'두 candidate를 계속 같은 프레임에 유지. 강제 pan 없음.',audio:'Amber warning scan → violet interference. damage/cut sound 없음.',meaning:'“잠긴 쪽을 버리고 반대쪽으로 즉시 전환.”',boundary:'현재 Rope에는 영향 없음.',toast:null,bark:null,scene:`<rect class="archive" x="345" y="130" width="230" height="250"/><circle class="warn" cx="285" cy="260" r="28"/><circle class="hp" cx="635" cy="260" r="14"/><circle class="jammer" cx="755" cy="155" r="22"/><path class="route" d="M460 430 Q590 360 635 260 Q590 130 460 90"/><g transform="translate(460 405)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S3',name:'RIGHTWARD TRANSFER',purpose:'Bay A 후 곧바로 또 분기를 주지 않고 긴 수평 Transfer로 진행축을 바꾼다.',camera:'Player가 화면 중앙을 가로질러 오른쪽으로 이동. 위로만 당기는 카메라를 피한다.',audio:'Jammer cue 종료. cable/data bridge ambience.',meaning:'“이동축이 상승→수평으로 바뀌고 다음 Review Bay가 오른쪽에 있다.”',boundary:'Story toast 없음.',toast:null,bark:null,scene:`<rect class="safe" x="100" y="350" width="180" height="20"/><rect class="glass" x="260" y="315" width="500" height="28"/><circle class="hp" cx="360" cy="300" r="13"/><circle class="hp" cx="520" cy="285" r="13"/><circle class="hp" cx="690" cy="270" r="13"/><path class="route" d="M200 340 L360 300 L520 285 L690 270"/><g transform="translate(200 320)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S4',name:'BAY B REVERSE RETURN',purpose:'두 번째 Archive Wall은 far-right에서 시작해 왼쪽으로 돌아오며 상승시켜 진행 방향을 뒤집는다.',camera:'오른쪽 P1에서 왼쪽 merge를 읽게 한다. Upper/Lower first candidate 동시 노출.',audio:'같은 Jammer family, 새 mechanic cue 없음.',meaning:'“두 번째 Jam은 방향 전환 중에도 같은 원리로 처리한다.”',boundary:'Cutter/AEGIS/Artillery 없음.',toast:null,bark:null,scene:`<rect class="archive" x="300" y="120" width="340" height="260"/><circle class="hp" cx="700" cy="345" r="14"/><circle class="hp" cx="610" cy="210" r="14"/><circle class="hp" cx="610" cy="330" r="14"/><circle class="hp" cx="230" cy="130" r="14"/><path class="route" d="M700 345 Q650 250 610 210 Q420 150 230 130 M700 345 Q650 340 610 330 Q420 250 230 130"/><circle class="jammer" cx="770" cy="150" r="22"/><g transform="translate(700 385)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S5',name:'FINAL VERTICAL CLIMB',purpose:'다시 짧은 수직 상승으로 공간 리듬을 정리한 뒤 Story를 읽을 Full Safe Archive Deck에 도달한다.',camera:'아래 Bay B가 멀어지고 Final Deck이 상부에 명확히 보인다.',audio:'Jammer interference 완전 종료.',meaning:'“두 Jam encounter가 끝났고 이제 기록 자체를 읽을 수 있다.”',boundary:'High-input 구간 종료 뒤에만 Story.',toast:null,bark:null,scene:`<rect class="safe" x="240" y="90" width="300" height="22"/><circle class="hp" cx="460" cy="350" r="13"/><circle class="hp" cx="400" cy="230" r="13"/><path class="route" d="M500 440 L460 350 L400 230 L390 110"/><g transform="translate(500 405)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S6',name:'ARCHIVE FACT / BARK',purpose:'Final Full Safe에서 Incident Review Archive가 존재하고 접근 제한 상태임을 확정한다.',camera:'고정된 안전 deck. system text 이후 Bark.',audio:'0.4–0.7초 clean archive hum → Bark.',meaning:'“사고 기록은 남아 있지만 접근은 통제되고 있다.”',boundary:'Capacity/Priority/Authorization 내용은 공개하지 않는다.',toast:[['INCIDENT REVIEW ARCHIVE','RECORD SET / AVAILABLE<br>ACCESS / RESTRICTED']],bark:'…기록까지 잠가놨네.',scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><rect class="archive" x="560" y="100" width="220" height="240"/><g transform="translate(410 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S7',name:'5-4 HANDOFF',purpose:'Capacity Allocation Core의 존재만 예고한다.',camera:'Exit 방향만 짧게 제시.',audio:'neutral access transition.',meaning:'“다음 공간이 Capacity Allocation을 담당한다.”',boundary:'CAPACITY RECORD 1/3 내용은 5-4 소유.',toast:[['CAPACITY ALLOCATION CORE','ACCESS AHEAD']],bark:null,scene:`<rect class="safe" x="100" y="410" width="670" height="22"/><path class="route" d="M420 385 Q310 280 240 170"/><g transform="translate(420 375)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`}
];
const bs=document.getElementById('buttons');beats.forEach((b,i)=>{const x=document.createElement('button');x.textContent=b.id+' · '+b.name;x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];[...bs.children].forEach((x,j)=>x.classList.toggle('on',j===i));purpose.textContent=b.purpose;camera.textContent=b.camera;audio.textContent=b.audio;meaning.textContent=b.meaning;boundary.textContent=b.boundary;visual.innerHTML=b.scene;if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden');if(b.bark){bark.classList.remove('hidden');bark.textContent=b.bark}else bark.classList.add('hidden')}
show(0);
</script></body></html>
