<header><h1>5-4 CAPACITY ALLOCATION CORE · STORY / DIRECTION REV2</h1><div class="sub">ALLOCATION ISLAND FIELD · FIRST ARTILLERY · CAPACITY RECORD 1/3</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid"><div class="stage"><svg viewBox="0 0 920 540"><rect width="920" height="540" fill="#03090d"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div></div>
<div><div class="card"><h2>PURPOSE</h2><p id="purpose"></p></div><div class="card"><h2>CAMERA / TIMING</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / TELEGRAPH</h2><p id="audio"></p></div><div class="card"><h2>PLAYER READ</h2><p id="meaning"></p></div><div class="card"><h2>STORY BOUNDARY</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',name:'ISLAND FIELD ARRIVAL',purpose:'5-3의 복잡한 Jam route-choice를 끊고 넓고 깨끗한 Allocation Island Field를 제시한다.',camera:'Island A/B와 짧은 Control Void, Artillery A를 한 번에 읽힌다.',audio:'Jammer interference fade out → allocation operations hum.',meaning:'“이번 공간은 하나의 floor가 아니라 여러 allocation station 사이를 Rope로 횡단하는 곳이다.”',boundary:'Capacity 내용 아직 없음.',toast:[['CAPACITY ALLOCATION CORE','OPERATIONS ACTIVE']],bark:null,scene:`<rect class="floor" x="80" y="350" width="250" height="50"/><rect class="floor" x="430" y="320" width="250" height="55"/><circle class="hp" cx="360" cy="285" r="13"/><circle class="art" cx="760" cy="210" r="24"/><g transform="translate(190 315)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S1',name:'FIRST LANDING TELEGRAPH',purpose:'Island B에 착지한 직후 현재 위치에 Telegraph가 고정되고 다음 Island가 이미 보이게 한다.',camera:'Old landing telegraph + next Hardpoint + Island C를 같은 프레임에 유지.',audio:'0.65초 telegraph tone.',meaning:'“머무르지 말고 다음 섬으로 이동.”',boundary:'공격 중 대사 없음.',toast:null,bark:null,scene:`<rect class="floor" x="170" y="340" width="240" height="50"/><rect class="floor" x="520" y="300" width="240" height="50"/><circle class="tele" cx="300" cy="325" r="58"/><circle class="hp" cx="470" cy="270" r="13"/><path class="route" d="M300 325 Q390 270 470 270 Q550 270 610 300"/><g transform="translate(600 275)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S2',name:'ISLAND FLOW',purpose:'Island C→D에서 같은 원리를 자연스럽게 이어가며 Artillery를 튜토리얼 텍스트 없이 체화한다.',camera:'앞쪽 Island를 우측에 유지. telegraph는 뒤에 남는다.',audio:'strike old island → cooldown → next acquire.',meaning:'“포격은 내가 있던 자리를 지우고, 나는 계속 앞으로 간다.”',boundary:'Kill objective 없음.',toast:null,bark:null,scene:`<rect class="floor" x="130" y="330" width="230" height="50"/><rect class="floor" x="500" y="360" width="230" height="50"/><circle class="tele" cx="245" cy="315" r="55"/><circle class="hp" cx="430" cy="280" r="13"/><path class="route" d="M245 315 Q340 260 430 280 Q520 300 610 345"/><g transform="translate(610 320)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S3',name:'BUS RISER TURN',purpose:'Island Field를 끝내고 우측에서 이동축을 90° 돌려 수직 상승으로 전환한다.',camera:'horizontal follow → vertical follow 전환.',audio:'allocation floor ambience → vertical bus hum.',meaning:'“Stage 후반은 수직 maintenance climb으로 바뀐다.”',boundary:'Story 없음.',toast:null,bark:null,scene:`<rect class="floor" x="130" y="390" width="340" height="30"/><rect class="floor" x="650" y="90" width="65" height="330"/><circle class="hp" cx="650" cy="340" r="13"/><circle class="hp" cx="650" cy="225" r="13"/><circle class="hp" cx="650" cy="110" r="13"/><path class="route" d="M420 385 L650 340 L650 225 L650 110"/><g transform="translate(420 350)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S4',name:'ARTILLERY B REINFORCEMENT',purpose:'작은 Riser Shelf에서도 landing dwell이 위험하다는 같은 원리를 재확인한다.',camera:'current shelf + telegraph + next upper Hardpoint.',audio:'same artillery family, no new mechanic cue.',meaning:'“넓은 Island뿐 아니라 작은 maintenance shelf에서도 같은 규칙.”',boundary:'Jammer/AEGIS/Cutter 없음.',toast:null,bark:null,scene:`<rect class="floor" x="620" y="80" width="65" height="380"/><rect class="safe" x="500" y="330" width="240" height="20"/><circle class="art" cx="800" cy="230" r="24"/><circle class="tele" cx="620" cy="330" r="55"/><circle class="hp" cx="640" cy="185" r="13"/><g transform="translate(640 170)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S5',name:'CAPACITY RECORD 1/3',purpose:'모든 Artillery activation에서 벗어난 Full Safe에서 첫 실제 원인 단서를 공개한다.',camera:'Player와 Capacity display 중심. high-input framing 종료.',audio:'Artillery layer fade → neutral record access.',meaning:'“모든 시스템을 동시에 안정 운영할 Capacity가 부족했다.”',boundary:'Priority/Authorization은 아직 모른다.',toast:[['CAPACITY ALLOCATION RECORD · 01 / 03','AVAILABLE CAPACITY / CRITICAL DEFICIT<br>SIMULTANEOUS STABLE OPERATION / UNAVAILABLE']],bark:'…전부 살릴 수는 없었던 거네.',scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><rect class="floor" x="550" y="100" width="230" height="220"/><g transform="translate(400 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S6',name:'5-5 HANDOFF',purpose:'다음 Stage가 Priority Routing을 다룬다는 사실만 예고한다.',camera:'exit direction only.',audio:'neutral transition.',meaning:'“Capacity 부족 뒤 실제 무엇을 우선했는지는 5-5에서 확인.”',boundary:'Priority Directive 내용은 5-5 소유.',toast:[['PRIORITY ROUTING HALL','ACCESS AHEAD']],bark:null,scene:`<rect class="safe" x="100" y="410" width="670" height="22"/><path class="route" d="M430 385 Q330 280 260 170"/><g transform="translate(430 375)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`}
];
const bs=document.getElementById('buttons');beats.forEach((b,i)=>{const x=document.createElement('button');x.textContent=b.id+' · '+b.name;x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];[...bs.children].forEach((x,j)=>x.classList.toggle('on',j===i));purpose.textContent=b.purpose;camera.textContent=b.camera;audio.textContent=b.audio;meaning.textContent=b.meaning;boundary.textContent=b.boundary;visual.innerHTML=b.scene;if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden');if(b.bark){bark.classList.remove('hidden');bark.textContent=b.bark}else bark.classList.add('hidden')}
show(0);
</script></body></html>
