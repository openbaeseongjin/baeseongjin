<title>5-5 Priority Routing Hall Story REV4</title>
<style>
body{margin:0;background:#071016;color:#eef5f5;font:13px/1.5 ui-monospace,Consolas,monospace}header{padding:14px 18px;border-bottom:1px solid #304955}h1{margin:0;font-size:19px}.sub{color:#9fb0b6}.wrap{padding:12px}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{background:#13232b;color:#eef5f5;border:1px solid #304955;border-radius:6px;padding:7px 10px;cursor:pointer}button.on{color:#5de8ff;border-color:#5de8ff}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.stage{height:560px;position:relative;background:#03090d;border:1px solid #304955;border-radius:8px;overflow:hidden}.stage svg{width:100%;height:100%}.toast{position:absolute;left:24px;top:24px;min-width:330px;background:#07131cdd;border:1px solid #596f79;border-radius:8px;padding:10px 12px}.toast b{color:#5de8ff}.bark{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#07131cdd;border:1px solid #73858c;border-radius:8px;padding:10px 16px;font-family:system-ui,sans-serif;font-size:20px;font-weight:700}.hidden{display:none}.card{border:1px solid #304955;border-radius:8px;background:#0b171d;padding:10px;margin-bottom:8px}.card h2{font-size:12px;color:#5de8ff;margin:0 0 6px}.matrix{fill:#45545d;stroke:#87989f;stroke-width:3}.glass{fill:#75a9b622;stroke:#9dc8d4;stroke-width:3}.safe{fill:#355e4d;stroke:#76cf9d;stroke-width:2}.hp{fill:#5de8ff;stroke:white;stroke-width:2}.jammer{fill:#a751cf;stroke:#f0d8ff;stroke-width:3}.aegis{fill:#507fd7;stroke:#d9e8ff;stroke-width:3}.warn{fill:none;stroke:#ffc35c;stroke-width:4;stroke-dasharray:5 4}.jam{fill:#b956df;stroke:#ffdeff;stroke-width:4}.player{fill:#eef5f6}.route{fill:none;stroke:#ffe16f;stroke-width:4;stroke-dasharray:10 7}.lock{fill:#ffba661a;stroke:#ffba66;stroke-width:4;stroke-dasharray:8 6}text{fill:#edf5f6;font-size:12px;paint-order:stroke;stroke:#061015;stroke-width:5}@media(max-width:1000px){.grid{grid-template-columns:1fr}}

<header><h1>5-5 PRIORITY ROUTING HALL · STORY / DIRECTION REV4</h1><div class="sub">ROUTE + ANGLE SYNTHESIS · PRIORITY DIRECTIVE 02/03 · USER APPROVAL REQUIRED</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid"><div class="stage"><svg viewBox="0 0 920 540"><rect width="920" height="540" fill="#03090d"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div></div>
<div><div class="card"><h2>PURPOSE</h2><p id="purpose"></p></div><div class="card"><h2>CAMERA / TIMING</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / VFX</h2><p id="audio"></p></div><div class="card"><h2>PLAYER READ</h2><p id="meaning"></p></div><div class="card"><h2>STORY BOUNDARY</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',name:'HUB / VISIBLE LOCK',purpose:'오른쪽 Evacuation Ascent가 목표라는 사실과, 정면 Authorized Access가 잠겨 있다는 사실을 동시에 보여준다.',camera:'Hub에 도착하면 오른쪽 locked ascent와 왼쪽 ROUTING CONTROL / SERVICE ACCESS를 같은 프레임에 둔다. 강제 pan 최소화.',audio:'clean command-hall ambience. Jammer/AEGIS combat cue 아직 없음.',meaning:'“가야 할 곳은 오른쪽이지만 정면으로는 못 간다. 왼쪽 Control service path가 우회 경로다.”',boundary:'Priority Directive 내용은 아직 안 보인다.',toast:[['PRIORITY ROUTING HALL','EVACUATION ASCENT / AUTHORIZED ACCESS ONLY<br>ROUTING CONTROL / SERVICE ACCESS']],bark:null,scene:`<rect class="safe" x="330" y="390" width="260" height="22"/><rect class="lock" x="620" y="130" width="180" height="250"/><rect class="glass" x="90" y="130" width="210" height="250"/><g transform="translate(455 355)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S1',name:'CONTROL ARC READ',purpose:'왼쪽 Routing Matrix로 들어가며 Jammer와 AEGIS, 두 flank 후보를 commitment 전에 한 번에 읽힌다.',camera:'P1에서 Jammer booth, AEGIS, upper/lower flank candidate가 모두 보이도록 framing.',audio:'Jammer idle hum + AEGIS shield hum. 아직 warning 없음.',meaning:'“이번엔 route denial과 angle denial이 같이 존재한다.”',boundary:'전투 중 Story 없음.',toast:null,bark:null,scene:`<rect class="matrix" x="350" y="105" width="230" height="280"/><circle class="jammer" cx="180" cy="155" r="22"/><circle class="aegis" cx="600" cy="265" r="25"/><circle class="hp" cx="305" cy="175" r="14"/><circle class="hp" cx="305" cy="350" r="14"/><g transform="translate(180 390)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S2',name:'JAM WARNING + AEGIS FACE',purpose:'Jammer가 한 flank를 예고하는 동안 AEGIS는 Player를 향해 shield를 돌린다. 남은 flank가 angle-change route가 된다.',camera:'두 flank를 같은 프레임에 유지. Jammed 후보를 보려고 카메라를 따로 돌리지 않는다.',audio:'Amber Jam warning + AEGIS shield movement. Projectile/impact cue는 기존 Runtime 그대로.',meaning:'“남아 있는 flank가 단순 우회가 아니라 AEGIS의 측후면 angle을 만드는 경로다.”',boundary:'Jammer가 current Rope를 자르거나 AEGIS가 omnidirectional shield가 되어선 안 됨.',toast:null,bark:null,scene:`<rect class="matrix" x="350" y="105" width="230" height="280"/><circle class="warn" cx="305" cy="175" r="28"/><circle class="hp" cx="305" cy="350" r="14"/><circle class="aegis" cx="610" cy="265" r="25"/><path class="route" d="M180 400 Q220 355 305 350 Q470 380 670 270"/><g transform="translate(180 390)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S3',name:'FLANK / BYPASS',purpose:'Player가 unjammed route로 이동해 AEGIS 정면을 벗어나 Directive Deck에 접근한다.',camera:'movement 중심. system text 없음.',audio:'Jam Active interference + shield turn. 이후 Directive Deck 진입 시 combat layers fade.',meaning:'“5-2의 angle lesson과 5-3의 route lesson을 한 행동으로 결합.”',boundary:'Kill optional. terminal 접근에 enemy death requirement 없음.',toast:null,bark:null,scene:`<circle class="jam" cx="300" cy="165" r="17"/><circle class="hp" cx="320" cy="350" r="14"/><circle class="hp" cx="560" cy="330" r="14"/><circle class="aegis" cx="555" cy="230" r="25"/><rect class="safe" x="650" y="160" width="180" height="24"/><path class="route" d="M180 400 Q250 365 320 350 Q440 360 560 330 Q650 270 710 180"/><g transform="translate(600 300)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S4',name:'PRIORITY DIRECTIVE 02/03',purpose:'Full Safe Directive Deck에서 Capacity 부족 이후 실제로 “무엇을 유지할지” 우선순위가 설정됐다는 첫 선택 증거를 공개한다.',camera:'Player + Directive display. Jammer/AEGIS high-input framing 종료.',audio:'combat layer fade → record access tone → system text → Bark.',meaning:'“부족했던 것에서 끝난 게 아니라 유지 대상으로 상층 핵심 시스템과 대피 capacity가 선택됐다.”',boundary:'Lower Ascent suspension authorization / 책임자 / Group C 희생은 아직 확정하지 않는다.',toast:[['PRIORITY ROUTING DIRECTIVE · 02 / 03','UPPER CORE CONTROL / MAINTAIN<br>UPPER EVACUATION CAPACITY / MAINTAIN<br>GENERAL DISTRIBUTION / CAPACITY HOLD']],bark:'…부족한 데서, 뭘 남길지 골랐던 거네.',scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><rect class="matrix" x="555" y="95" width="230" height="240"/><g transform="translate(390 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S5',name:'BACKSIDE SERVICE CROSSING',purpose:'Directive chamber가 바로 right ascent를 마법처럼 unlock하지 않는다. Player가 Routing Control 뒤쪽 service structure를 건너 front lock의 뒤편으로 이동한다.',camera:'왼쪽 Directive Deck에서 오른쪽 protected ascent 내부로 수평 crossing.',audio:'security combat cues off. service bridge ambience.',meaning:'“Priority를 결정하는 control infrastructure와 protected ascent가 물리적으로 연결돼 있다.”',boundary:'authorization 원문은 여전히 5-6.',toast:null,bark:null,scene:`<rect class="safe" x="100" y="360" width="180" height="22"/><rect class="glass" x="270" y="330" width="430" height="45"/><rect class="lock" x="650" y="190" width="140" height="220"/><circle class="hp" cx="380" cy="300" r="13"/><circle class="hp" cx="540" cy="280" r="13"/><path class="route" d="M180 340 L380 300 L540 280 L690 240"/><g transform="translate(180 320)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S6',name:'RIGHT ASCENT',purpose:'이제 protected right-side ascent 내부에서 순수 Rope 상승으로 Stage를 마무리한다.',camera:'vertical follow. 5-4의 Bus Riser보다 좁고 보호된 clean ascent.',audio:'protected ascent mechanical hum. no special enemy.',meaning:'“직접 접근은 막혔지만 control backside를 통해 route 내부에 들어왔다.”',boundary:'추가 Story 없음.',toast:null,bark:null,scene:`<rect class="glass" x="620" y="70" width="120" height="390"/><circle class="hp" cx="680" cy="355" r="13"/><circle class="hp" cx="680" cy="245" r="13"/><circle class="hp" cx="620" cy="145" r="13"/><path class="route" d="M680 420 L680 355 L680 245 L620 145"/><g transform="translate(680 395)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S7',name:'5-6 HANDOFF',purpose:'다음 Stage가 Authorization을 다룬다는 사실만 예고한다.',camera:'exit landing stable.',audio:'neutral access transition.',meaning:'“Priority가 실제 중단 명령으로 어떻게 승인됐는지는 5-6에서 확인.”',boundary:'LOWER ASCENT / SUSPENSION AUTHORIZED 문구는 여기서 쓰지 않는다.',toast:[['INCIDENT AUTHORIZATION ANNEX','ACCESS AHEAD']],bark:null,scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><g transform="translate(420 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`}
];
const bs=document.getElementById('buttons');beats.forEach((b,i)=>{const x=document.createElement('button');x.textContent=b.id+' · '+b.name;x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];[...bs.children].forEach((x,j)=>x.classList.toggle('on',j===i));purpose.textContent=b.purpose;camera.textContent=b.camera;audio.textContent=b.audio;meaning.textContent=b.meaning;boundary.textContent=b.boundary;visual.innerHTML=b.scene;if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden');if(b.bark){bark.classList.remove('hidden');bark.textContent=b.bark}else bark.classList.add('hidden')}
show(0);
</script></body></html>
