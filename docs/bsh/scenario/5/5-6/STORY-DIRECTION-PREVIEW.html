<header><h1>5-6 INCIDENT AUTHORIZATION ANNEX · STORY / DIRECTION REV1</h1><div class="sub">NEXT ROUTE + CURRENT ROPE · AUTHORIZATION 03/03 · USER APPROVAL REQUIRED</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid"><div class="stage"><svg viewBox="0 0 920 540"><rect width="920" height="540" fill="#03090d"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div></div>
<div><div class="card"><h2>PURPOSE</h2><p id="purpose"></p></div><div class="card"><h2>CAMERA / TIMING</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / VFX</h2><p id="audio"></p></div><div class="card"><h2>PLAYER READ</h2><p id="meaning"></p></div><div class="card"><h2>STORY BOUNDARY</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',name:'AUTHORIZATION STACK ARRIVAL',purpose:'5-5의 넓은 Routing Hall을 벗어나 좁고 수직으로 압축된 Annex Stack으로 공간 리듬을 바꾼다.',camera:'우측 수직 entry rise와 위쪽 P0만 읽힌다. 아직 하부 trench 전체는 숨긴다.',audio:'contained authorization-room hum. 5-5 security layer fade.',meaning:'“이번 공간은 넓은 hall이 아니라 여러 authorization layer가 수직으로 겹친 Annex다.”',boundary:'Authorization 내용은 아직 공개하지 않는다.',toast:[['INCIDENT AUTHORIZATION ANNEX','RESPONSE CONTROL / ACTIVE']],bark:null,scene:`<rect class="glass" x="610" y="80" width="130" height="380"/><circle class="hp" cx="675" cy="375" r="13"/><circle class="hp" cx="675" cy="270" r="13"/><circle class="hp" cx="675" cy="160" r="13"/><path class="route" d="M675 440 L675 375 L675 270 L675 160"/><g transform="translate(675 415)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S1',name:'JAMMER NEXT-ROUTE READ',purpose:'P0 Full Safe에서 다음 두 Hardpoint가 보이고, Jammer가 그중 하나만 잠근다.',camera:'현재 position + 두 candidate + lower drop direction을 같은 프레임에 유지.',audio:'Jammer warning family only. Cutter audio 아직 없음.',meaning:'“다음 선택 하나가 막혀도 다른 route로 내려갈 수 있다.”',boundary:'현재 attached Rope에는 영향 없음.',toast:null,bark:null,scene:`<rect class="safe" x="600" y="390" width="230" height="22"/><circle class="hp" cx="470" cy="270" r="14"/><circle class="hp" cx="520" cy="365" r="14"/><circle class="warn" cx="470" cy="270" r="28"/><circle class="jammer" cx="760" cy="160" r="22"/><g transform="translate(690 360)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S2',name:'CONTROL DROP',purpose:'첫 Jam 선택 뒤 바로 올라가지 않고 Annex 하부 Credential Trench로 의도적으로 고도를 잃는다.',camera:'vertical follow가 아래 방향으로 전환된다. 하부 recovery shelf가 먼저 보이게 한다.',audio:'Jammer cue fade → deep service/credential hum.',meaning:'“진행 = 항상 상승이 아니다. 보안 구조를 우회하려면 하부 service layer로 내려가야 한다.”',boundary:'Story 없음.',toast:null,bark:null,scene:`<rect class="wall" x="360" y="80" width="130" height="380"/><circle class="hp" cx="420" cy="155" r="13"/><circle class="hp" cx="370" cy="280" r="13"/><circle class="hp" cx="330" cy="405" r="13"/><path class="route" d="M520 95 L420 155 L370 280 L330 405"/><g transform="translate(500 90)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S3',name:'CUTTER TRENCH PREVIEW',purpose:'Cutter를 맞기 전에 current Rope line, Cutter projectile line, R3 recovery, next Hardpoint를 동시에 보게 한다.',camera:'Trench 전체를 낮고 넓게 framing. Cutter는 Rope가 아니라 Player를 조준한다는 방향성이 보이게 한다.',audio:'Cutter acquire/track family. no Jammer warning.',meaning:'“여기서 위험한 건 다음 route가 아니라 지금 붙어 있는 Rope다.”',boundary:'Cutter가 Rope를 자동조준하는 연출 금지.',toast:null,bark:null,scene:`<rect class="glass" x="100" y="330" width="720" height="80"/><circle class="cutter" cx="680" cy="235" r="25"/><circle class="hp" cx="260" cy="300" r="13"/><circle class="hp" cx="480" cy="300" r="13"/><line class="cutline" x1="680" y1="235" x2="300" y2="365"/><rect class="safe" x="310" y="430" width="280" height="20"/><g transform="translate(220 365)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S4',name:'CUTTER CURRENT-ROPE PRESSURE',purpose:'Trench crossing에서 Player가 projectile timing과 current Rope segment를 같이 읽는다.',camera:'current anchor / player / next anchor / recovery 모두 유지. 화면 흔들림 최소.',audio:'Cutter fire → rope-cut if actual segment intersection. no scripted cut.',meaning:'“잘릴 수 있다는 걸 알면서 다음 anchor와 recovery를 함께 준비한다.”',boundary:'Invisible cut zone, forced cut, auto Rope-targeting 금지.',toast:null,bark:null,scene:`<rect class="glass" x="90" y="350" width="740" height="70"/><circle class="cutter" cx="720" cy="220" r="25"/><circle class="hp" cx="250" cy="285" r="13"/><circle class="hp" cx="520" cy="285" r="13"/><path class="route" d="M250 285 Q390 235 520 285"/><line class="cutline" x1="720" y1="220" x2="380" y2="340"/><g transform="translate(380 340)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S5',name:'SAFE HANDOFF / RE-ASCENT',purpose:'Cutter band가 끝난 뒤 Safe Shelf를 명확히 두고 다음 route-reading으로 전환한다. 최대 강도 Jam+Cutter overlap을 피한다.',camera:'trench exit shelf → vertical verification riser.',audio:'Cutter layer full fade before any next security warning.',meaning:'“현재 Rope 위협을 끝낸 다음에야 다음 route 위협을 다시 읽는다.”',boundary:'Cutter projectile active 상태에서 Jam Active 시작 금지.',toast:null,bark:null,scene:`<rect class="safe" x="560" y="390" width="250" height="22"/><rect class="wall" x="650" y="80" width="100" height="320"/><circle class="hp" cx="700" cy="320" r="13"/><circle class="hp" cx="700" cy="210" r="13"/><circle class="hp" cx="700" cy="100" r="13"/><path class="route" d="M600 375 L700 320 L700 210 L700 100"/><g transform="translate(600 350)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S6',name:'AEGIS SIGN-OFF GATE',purpose:'상부에 복귀한 뒤 Jammer/Cutter가 끝난 상태에서 AEGIS 하나로 짧은 angle-confidence check를 한다.',camera:'AEGIS face + two-step route to side angle. no Jam state.',audio:'AEGIS shield family only.',meaning:'“마지막 관문은 익숙한 angle control이며 새 규칙을 추가하지 않는다.”',boundary:'Kill optional. no Jammer/Cutter overlap.',toast:null,bark:null,scene:`<rect class="safe" x="620" y="390" width="200" height="22"/><circle class="aegis" cx="480" cy="230" r="25"/><circle class="hp" cx="360" cy="320" r="13"/><circle class="hp" cx="250" cy="200" r="13"/><path class="route" d="M680 370 Q520 340 360 320 Q300 260 250 200"/><g transform="translate(680 345)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S7',name:'AUTHORIZATION 03/03',purpose:'모든 threat가 완전히 끝난 Full Safe Sign-off Gallery에서 Priority가 실제 Lower Ascent 중단 승인으로 이어졌음을 확정한다.',camera:'Player + authorization panel. movement pressure 없음.',audio:'security layers off → document/access confirmation → Bark.',meaning:'“Lower Ascent 중단은 고장이나 자동 isolation만이 아니라 post-cascade 대응에서 승인된 조치였다.”',boundary:'실제 lower evacuation outcome, 정확한 승인 조직/개인은 아직 공개하지 않는다.',toast:[['ROUTING AUTHORIZATION · 03 / 03','INCIDENT RESPONSE / POST-CASCADE<br>LOWER ASCENT ROUTING / SUSPENSION AUTHORIZED']],bark:'…고장이 아니라, 멈추라고 승인한 거였네.',scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><rect class="wall" x="545" y="95" width="240" height="240"/><g transform="translate(390 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S8',name:'5-7 HANDOFF',purpose:'다음 Stage에서 Authorization의 실제 evacuation consequence를 확인한다.',camera:'exit stable.',audio:'neutral archive transition.',meaning:'“승인이 실제로 어떤 결과를 냈는지는 기록에서 확인해야 한다.”',boundary:'LOWER SECTORS EVACUATION SUSPENDED outcome 문구는 5-7 소유.',toast:[['EVACUATION CONSEQUENCE ARCHIVE','POST-INCIDENT RECORDS / AHEAD']],bark:null,scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><g transform="translate(420 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`}
];
const bs=document.getElementById('buttons');beats.forEach((b,i)=>{const x=document.createElement('button');x.textContent=b.id+' · '+b.name;x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];[...bs.children].forEach((x,j)=>x.classList.toggle('on',j===i));purpose.textContent=b.purpose;camera.textContent=b.camera;audio.textContent=b.audio;meaning.textContent=b.meaning;boundary.textContent=b.boundary;visual.innerHTML=b.scene;if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden');if(b.bark){bark.classList.remove('hidden');bark.textContent=b.bark}else bark.classList.add('hidden')}
show(0);
</script></body></html>
