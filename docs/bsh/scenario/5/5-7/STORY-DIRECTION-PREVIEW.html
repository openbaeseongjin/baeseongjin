<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>5-7 Evacuation Consequence Archive Story REV1.1</title>
<style>
body{margin:0;background:#071016;color:#eef5f5;font:13px/1.5 ui-monospace,Consolas,monospace}header{padding:14px 18px;border-bottom:1px solid #304955}h1{margin:0;font-size:19px}.sub{color:#9fb0b6}.wrap{padding:12px}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{background:#13232b;color:#eef5f5;border:1px solid #304955;border-radius:6px;padding:7px 10px;cursor:pointer}button.on{color:#5de8ff;border-color:#5de8ff}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.stage{height:560px;position:relative;background:#03090d;border:1px solid #304955;border-radius:8px;overflow:hidden}.stage svg{width:100%;height:100%}.toast{position:absolute;left:24px;top:24px;min-width:350px;background:#07131cdd;border:1px solid #596f79;border-radius:8px;padding:10px 12px}.toast b{color:#5de8ff}.bark{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#07131cdd;border:1px solid #73858c;border-radius:8px;padding:10px 16px;font-family:system-ui,sans-serif;font-size:20px;font-weight:700}.hidden{display:none}.card{border:1px solid #304955;border-radius:8px;background:#0b171d;padding:10px;margin-bottom:8px}.card h2{font-size:12px;color:#5de8ff;margin:0 0 6px}.archive{fill:#45545d;stroke:#87989f;stroke-width:3}.glass{fill:#75a9b622;stroke:#9dc8d4;stroke-width:3}.safe{fill:#355e4d;stroke:#76cf9d;stroke-width:2}.hp{fill:#5de8ff;stroke:white;stroke-width:2}.art{fill:#d66852;stroke:#ffd3c9;stroke-width:3}.cut{fill:#d94d48;stroke:#ffd3d1;stroke-width:3}.tele{fill:#ffd16a22;stroke:#ffd16a;stroke-width:4}.cutline{stroke:#ff6e68;stroke-width:4;stroke-dasharray:7 5}.player{fill:#eef5f6}.route{fill:none;stroke:#ffe16f;stroke-width:4;stroke-dasharray:10 7}text{fill:#edf5f6;font-size:12px;paint-order:stroke;stroke:#061015;stroke-width:5}@media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style></head><body>
<header><h1>5-7 EVACUATION CONSEQUENCE ARCHIVE · STORY / DIRECTION REV1.1</h1><div class="sub">ARTILLERY → CUTTER → THREAT-FREE CONSEQUENCE · USER APPROVAL REQUIRED</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid"><div class="stage"><svg viewBox="0 0 920 540"><rect width="920" height="540" fill="#03090d"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div></div>
<div><div class="card"><h2>PURPOSE</h2><p id="purpose"></p></div><div class="card"><h2>CAMERA / TIMING</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / VFX</h2><p id="audio"></p></div><div class="card"><h2>PLAYER READ</h2><p id="meaning"></p></div><div class="card"><h2>STORY BOUNDARY</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',name:'ARCHIVE ARRIVAL',purpose:'5-6의 수직 압축 Annex에서 길고 조용한 기록 Mezzanine으로 공간을 확장한다.',camera:'첫 하층 Archive Spine이 오른쪽으로 길게 이어지는 것이 한눈에 보인다.',audio:'authorization-room hum → quiet archival cooling / data ambience.',meaning:'“이제 결정 공간이 아니라 결과 기록을 따라간다.”',boundary:'Outcome 문구 아직 없음.',toast:[['EVACUATION CONSEQUENCE ARCHIVE','POST-INCIDENT RECORDS / AVAILABLE']],bark:null,scene:`<rect class="glass" x="80" y="350" width="760" height="60"/><rect class="archive" x="250" y="220" width="190" height="120"/><rect class="archive" x="520" y="220" width="190" height="120"/><g transform="translate(150 320)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S1',name:'ARTILLERY EVENT-LOG SPINE',purpose:'하층에서 익숙한 Artillery dwell-control을 짧게 재사용해 Player를 기록 Spine 앞으로 계속 밀어낸다.',camera:'old-position telegraph와 next Hardpoint/record bay를 동시에 유지.',audio:'Artillery telegraph → strike. Story voice/text 없음.',meaning:'“이 기록층에서는 멈춰서 읽지 말고 앞으로 이동해야 한다.”',boundary:'Artillery는 stored position strike 그대로. continuous tracking 금지.',toast:null,bark:null,scene:`<rect class="glass" x="80" y="370" width="760" height="45"/><circle class="art" cx="700" cy="200" r="25"/><circle class="tele" cx="350" cy="345" r="58"/><circle class="hp" cx="500" cy="300" r="13"/><path class="route" d="M350 345 Q420 295 500 300"/><g transform="translate(480 280)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S2',name:'ARCHIVE INDEX SAFE',purpose:'첫 end-riser에서 Artillery를 완전히 끄고 Archive 기록이 정리돼 있음을 사실로만 보여준다.',camera:'full-safe landing. 다음 중층 방향이 왼쪽이라는 것이 보인다.',audio:'Artillery layer off → index confirmation tone.',meaning:'“기록이 남아 있고 이제 route-status layer로 들어간다.”',boundary:'주요 outcome은 아직 공개하지 않는다.',toast:[['EVACUATION ARCHIVE','POST-CASCADE RECORDS / INDEXED']],bark:null,scene:`<rect class="safe" x="500" y="395" width="300" height="22"/><rect class="glass" x="650" y="80" width="80" height="300"/><g transform="translate(610 360)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S3',name:'CUTTER ROUTE-STATUS SPINE',purpose:'중층은 진행 방향을 왼쪽으로 뒤집고 Cutter로 current-Rope continuity를 압박한다.',camera:'Player, current anchor, next leftward anchor, below recovery catwalk 모두 한 프레임.',audio:'Cutter acquire/fire. no Artillery layer.',meaning:'“이제 머무름이 아니라 현재 Rope가 위험하다. 그래도 기록 Spine을 계속 전진해야 한다.”',boundary:'Rope-homing / scripted cut 없음.',toast:null,bark:null,scene:`<rect class="glass" x="80" y="350" width="760" height="45"/><circle class="cut" cx="470" cy="190" r="25"/><circle class="hp" cx="650" cy="300" r="13"/><circle class="hp" cx="350" cy="300" r="13"/><path class="route" d="M650 300 Q500 250 350 300"/><line class="cutline" x1="470" y1="190" x2="560" y2="340"/><rect class="safe" x="300" y="440" width="340" height="18"/><g transform="translate(560 340)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S4',name:'THREAT END / UPPER ENTRY',purpose:'두 번째 end-riser에서 Cutter가 완전히 종료되고, 상층이 짧고 넓은 Evidence Deck으로 열리며 Stage를 Story-safe 상태로 전환한다.',camera:'중층은 아래로 멀어지고 상층 Evidence Spine이 오른쪽으로 열림.',audio:'Cutter layer full fade. 이후 combat sound 없음.',meaning:'“이제부터는 기록을 읽는 구간이다.”',boundary:'이후 새로운 적 등장 금지.',toast:null,bark:null,scene:`<rect class="safe" x="100" y="390" width="300" height="22"/><rect class="glass" x="120" y="80" width="90" height="300"/><rect class="glass" x="200" y="95" width="600" height="55"/><g transform="translate(250 355)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S5',name:'EVIDENCE A',purpose:'5-6의 Authorization과 실제 운영 상태 사이의 연결 기록을 먼저 보여준다.',camera:'full-safe evidence bay.',audio:'quiet archive ambience + subtle record access.',meaning:'“승인된 Lower Ascent suspension이 실제 routing interruption 상태로 적용됐다.”',boundary:'아직 `LOWER SECTORS / EVACUATION STATUS / SUSPENDED` 최종 문장은 다음 beat.',toast:[['POST-CASCADE EVACUATION LOG','LOWER-SECTOR TRANSFER / ROUTING INTERRUPTED<br>LOWER ASCENT / SUSPENSION IN EFFECT']],bark:null,scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><rect class="archive" x="550" y="100" width="230" height="220"/><g transform="translate(380 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S6',name:'EVIDENCE B / CONSEQUENCE',purpose:'다음 Outcome Deck에서 실제 lower-sector evacuation 운영 결과를 명확히 확정한다.',camera:'정적인 full-safe framing. 충분한 읽기 시간.',audio:'record confirmation → short silence → Bark.',meaning:'“중단 승인은 실제 Lower-sector evacuation suspension으로 이어졌다.”',boundary:'사망자 수, 전원 사망, 영구적 불가능, 고의적 희생은 의미하지 않는다.',toast:[['LOWER SECTORS','EVACUATION STATUS / SUSPENDED']],bark:'…승인한 대로, 실제 대피까지 멈췄어.',scene:`<rect class="safe" x="80" y="405" width="760" height="22"/><rect class="archive" x="560" y="90" width="240" height="235"/><g transform="translate(390 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S7',name:'5-8 HANDOFF',purpose:'다음 Stage에서 조직 차원의 authority / responsibility record를 확인한다.',camera:'final rise and exit stable.',audio:'quiet authority-record transition.',meaning:'“결과는 확인했다. 이제 누가 어떤 원칙으로 이 선택을 조직적으로 내렸는지 확인해야 한다.”',boundary:'5-8 책임 결론을 여기서 선공개하지 않는다.',toast:[['CONTINUITY COMMAND SPINE','AUTHORITY RECORDS / AHEAD']],bark:null,scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><path class="route" d="M610 380 L610 260 L450 170 L300 110"/><g transform="translate(610 355)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`}
];
const bs=document.getElementById('buttons');beats.forEach((b,i)=>{const x=document.createElement('button');x.textContent=b.id+' · '+b.name;x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];[...bs.children].forEach((x,j)=>x.classList.toggle('on',j===i));purpose.textContent=b.purpose;camera.textContent=b.camera;audio.textContent=b.audio;meaning.textContent=b.meaning;boundary.textContent=b.boundary;visual.innerHTML=b.scene;if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden');if(b.bark){bark.classList.remove('hidden');bark.textContent=b.bark}else bark.classList.add('hidden')}
show(0);
</script></body></html>
