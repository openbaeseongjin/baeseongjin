<header><h1>5-8 CONTINUITY COMMAND SPINE · STORY / DIRECTION REV2</h1><div class="sub">SECTOR05 FINALE · 최종 종합 · 책임 / 이유 · 승인본</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid"><div class="stage"><svg viewBox="0 0 920 540"><rect width="920" height="540" fill="#03090d"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div></div>
<div><div class="card"><h2>PURPOSE</h2><p id="purpose"></p></div><div class="card"><h2>CAMERA / TIMING</h2><p id="camera"></p></div><div class="card"><h2>AUDIO / VFX</h2><p id="audio"></p></div><div class="card"><h2>PLAYER READ</h2><p id="meaning"></p></div><div class="card"><h2>STORY BOUNDARY</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',name:'TWIN-SPINE ARRIVAL',purpose:'5-7의 Archive를 떠나 두 개의 평행 Command Bus가 위로 뻗는 Sector05 최종 구조를 한 번에 보여준다.',camera:'Primary/Redundant Bus 둘 다 프레임에 넣되 첫 목표는 왼쪽 하부 Rail로 명확히 읽힌다.',audio:'archive ambience → deep redundant-control pulse.',meaning:'“최종 제어부가 하나가 아니야. 이중으로 나뉘어 있어.”',boundary:'최종 책임 기록은 아직 없음.',toast:[['CONTINUITY COMMAND SPINE','AUTHORITY RECORDS / AVAILABLE']],bark:null,scene:`<rect class="bus" x="250" y="80" width="120" height="390"/><rect class="bus" x="560" y="80" width="120" height="390"/><g transform="translate(455 440)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S1',name:'AEGIS RECALL',purpose:'첫 Rail에서 설명 없이 angle-control을 다시 요구한다.',camera:'AEGIS front + off-axis Hardpoint + higher re-entry를 동시에 보여준다.',audio:'AEGIS shield family only.',meaning:'“정면이 막히면 옆으로 돌아서 각도를 만들면 돼.”',boundary:'Kill optional. 다른 special threat 없음.',toast:null,bark:null,scene:`<rect class="bus" x="280" y="70" width="110" height="400"/><circle class="aegis" cx="500" cy="260" r="25"/><circle class="hp" cx="250" cy="300" r="13"/><circle class="hp" cx="320" cy="170" r="13"/><path class="route" d="M340 420 Q240 360 250 300 Q260 210 320 170"/><g transform="translate(340 395)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S2',name:'JAMMER CROSS-LINK',purpose:'첫 Cross-link에서 upper/lower 두 이동 후보 중 하나만 Jammed된다.',camera:'두 candidate와 반대쪽 Right Bus destination을 한 프레임에 유지.',audio:'Jammer warning → active. AEGIS audio already off.',meaning:'“하나가 막혀도 다른 연결점으로 넘어가면 돼.”',boundary:'current Rope 영향 없음.',toast:null,bark:null,scene:`<rect class="bus" x="180" y="70" width="100" height="400"/><rect class="bus" x="650" y="70" width="100" height="400"/><rect class="glass" x="260" y="200" width="400" height="150"/><circle class="jammer" cx="455" cy="150" r="24"/><circle class="hp" cx="360" cy="240" r="13"/><circle class="hp" cx="360" cy="330" r="13"/><circle class="hp" cx="650" cy="285" r="13"/><path class="route" d="M240 285 L360 240 L500 250 L650 285"/><g transform="translate(230 270)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S3',name:'CUTTER RIGHT BUS',purpose:'Right Bus의 좁은 수직 Rope run에서 current Rope continuity를 다시 요구한다.',camera:'current anchor / next upper anchor / Cutter line / lower recovery가 동시에 보인다.',audio:'Cutter acquire/fire only.',meaning:'“이번엔 다음 길보다 지금 잡고 있는 로프가 더 위험해.”',boundary:'Rope-homing projectile 금지.',toast:null,bark:null,scene:`<rect class="bus" x="610" y="60" width="110" height="420"/><circle class="cut" cx="440" cy="250" r="25"/><circle class="hp" cx="665" cy="350" r="13"/><circle class="hp" cx="665" cy="190" r="13"/><path class="route" d="M665 430 L665 350 L665 190"/><g transform="translate(665 330)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S4',name:'SAFE CROSS-LINK 2',purpose:'두 Bus를 동시에 보여주는 완전 중립 Transfer로 마지막 Artillery 전에 입력 압박을 리셋한다.',camera:'Right → Left cross-connect. 양쪽 command trunk가 아래로 이어지는 모습 강조.',audio:'Cutter layer full fade. neutral control relay.',meaning:'“두 제어선이 결국 같은 상부 기록실로 모이고 있어.”',boundary:'Story conclusion 아직 없음.',toast:[['CONTINUITY BUS CROSS-CONNECT','CONTROL RELAY / SYNCHRONIZED']],bark:null,scene:`<rect class="bus" x="180" y="70" width="100" height="400"/><rect class="bus" x="650" y="70" width="100" height="400"/><rect class="glass" x="260" y="220" width="400" height="90"/><circle class="hp" cx="550" cy="200" r="13"/><circle class="hp" cx="390" cy="205" r="13"/><path class="route" d="M680 280 L550 200 L390 205 L230 280"/><g transform="translate(680 265)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S5',name:'ARTILLERY FINAL RECALL',purpose:'Upper Primary Bus의 짧은 staging landings에서 move-after-landing을 마지막으로 재확인한다.',camera:'old landing telegraph + next platform. 다른 special threat 없음.',audio:'Artillery telegraph/strike only.',meaning:'“착지하자마자 다음 지점으로 움직여야 해.”',boundary:'final Story 전에 Artillery band 완전 종료.',toast:null,bark:null,scene:`<rect class="bus" x="250" y="60" width="120" height="420"/><circle class="art" cx="540" cy="230" r="25"/><circle class="hp" cx="310" cy="350" r="13"/><circle class="hp" cx="310" cy="210" r="13"/><path class="route" d="M310 430 L310 350 L310 210"/><g transform="translate(310 330)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S6',name:'AUTHORITY / WHO',purpose:'모든 위협이 끝난 Authority Deck에서 처음으로 최종 조직적 decision function을 명시한다.',camera:'Player와 중앙 Authority wall 고정. 충분한 읽기 시간.',audio:'all combat layers off → authority-record access.',meaning:'“개인이 아니라 사고 대응 통제 조직이 이 결정을 관리한 거야.”',boundary:'planned Cascade나 고의적 casualty directive로 확대하지 않는다.',toast:[['POST-CASCADE CONTINUITY DIRECTIVE','AUTHORITY / INCIDENT CONTINUITY CONTROL<br>BASIS / CRITICAL CAPACITY DEFICIT']],bark:null,scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><rect class="glass" x="530" y="90" width="260" height="240"/><g transform="translate(390 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S7',name:'WHY / FULL CHAIN',purpose:'5-4~5-7의 네 증거를 최종 Directive 안에서 한 번에 결합한다.',camera:'same safe authority deck. system records advance without movement requirement.',audio:'subtle record-page confirmations only.',meaning:'“용량 부족에서 시작해 상층 우선 유지, 하층 상승로 중단, 실제 대피 중단까지 하나의 지시 체계로 이어졌어.”',boundary:'named executive 없음. accident intentionality 없음.',toast:[['CONTINUITY PRIORITY','UPPER CORE CONTROL / PRESERVE<br>UPPER EVACUATION CAPACITY / PRESERVE'],['ROUTING ACTION','LOWER ASCENT / SUSPEND'],['RECORDED OUTCOME','LOWER-SECTOR EVACUATION / SUSPENDED']],bark:'…무엇을 계속 돌릴지 정했고, 그 선택 때문에 아래 대피가 멈춘 거네.',scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><rect class="glass" x="530" y="90" width="260" height="240"/><g transform="translate(390 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S8',name:'ESCAPE GOAL / SECTOR END',purpose:'Sector05의 정책 서사를 닫고 다음 탈출 목표를 제시한다.',camera:'Authority display에서 exterior service indicator로 시선 이동. 직접 6-1 wiring 없음.',audio:'first faint exterior/roof ambience.',meaning:'“다음 목표는 옥상 03번 패드의 정비 셔틀이야. 실제 연결은 다음 전환 구간에서 확정한다.”',boundary:'5-8→6-1 직접 연결 금지. 6-1의 Open Sky transition을 여기서 소비하지 않는다.',toast:[['ROOFTOP PAD 03','MAINTENANCE SHUTTLE / STANDBY'],['ROOFTOP SERVICE ACCESS','ROUTE AVAILABLE']],bark:null,scene:`<rect class="safe" x="100" y="405" width="700" height="22"/><path class="route" d="M430 380 L560 290 L700 190"/><g transform="translate(430 365)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`}
];
const bs=document.getElementById('buttons');beats.forEach((b,i)=>{const x=document.createElement('button');x.textContent=b.id+' · '+b.name;x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];[...bs.children].forEach((x,j)=>x.classList.toggle('on',j===i));purpose.textContent=b.purpose;camera.textContent=b.camera;audio.textContent=b.audio;meaning.textContent=b.meaning;boundary.textContent=b.boundary;visual.innerHTML=b.scene;if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden');if(b.bark){bark.classList.remove('hidden');bark.textContent=b.bark}else bark.classList.add('hidden')}
show(0);
</script></body></html>
