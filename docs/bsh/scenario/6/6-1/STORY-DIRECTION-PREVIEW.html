<style>
body{margin:0;background:#07131d;color:#eef5f6;font:13px/1.5 ui-monospace,Consolas,monospace}header{padding:14px 18px;border-bottom:1px solid #355361}h1{margin:0;font-size:19px}.sub{color:#9fb4bd}.wrap{padding:12px}.buttons{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}button{background:#132631;color:#eef5f6;border:1px solid #355361;border-radius:6px;padding:7px 10px;cursor:pointer}button.on{color:#5de8ff;border-color:#5de8ff}.grid{display:grid;grid-template-columns:1.15fr .85fr;gap:12px}.stage{height:560px;position:relative;background:linear-gradient(#0d293c,#071019);border:1px solid #355361;border-radius:8px;overflow:hidden}.stage svg{width:100%;height:100%}.toast{position:absolute;left:24px;top:24px;min-width:330px;background:#07131ddd;border:1px solid #5d7480;border-radius:8px;padding:10px 12px}.toast b{color:#5de8ff}.bark{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);background:#07131ddd;border:1px solid #7b8e96;border-radius:8px;padding:10px 16px;font-family:system-ui,sans-serif;font-size:20px;font-weight:700}.hidden{display:none}.card{border:1px solid #355361;border-radius:8px;background:#0d1b25;padding:10px;margin-bottom:8px}.card h2{font-size:12px;color:#5de8ff;margin:0 0 6px}.island{fill:#465a64;stroke:#95a7ae;stroke-width:3}.mast{fill:#30454f;stroke:#a5b4ba;stroke-width:3}.safe{fill:#365f4e;stroke:#76d5a1;stroke-width:2}.recover{fill:#5f522e;stroke:#d6b65e;stroke-width:2}.hp{fill:#5de8ff;stroke:white;stroke-width:2}.player{fill:#eef5f6}.route{fill:none;stroke:#ffe16f;stroke-width:4;stroke-dasharray:10 7}text{fill:#edf5f6;font-size:12px;paint-order:stroke;stroke:#07131d;stroke-width:5}@media(max-width:1000px){.grid{grid-template-columns:1fr}}

<header><h1>6-1 SKYBREAK ACCESS · STORY / DIRECTION REV3</h1><div class="sub">SKYBREAK DROP · RECOVERY SHADOW · FREESTANDING MAST · 한글 대사 우선</div></header>
<div class="wrap"><div id="buttons" class="buttons"></div><div class="grid"><div class="stage"><svg viewBox="0 0 920 540"><rect width="920" height="540" fill="transparent"/><g id="visual"></g></svg><div id="toast" class="toast hidden"></div><div id="bark" class="bark hidden"></div></div>
<div><div class="card"><h2>목적</h2><p id="purpose"></p></div><div class="card"><h2>카메라 / 타이밍</h2><p id="camera"></p></div><div class="card"><h2>사운드 / 연출</h2><p id="audio"></p></div><div class="card"><h2>플레이어가 읽어야 하는 것</h2><p id="meaning"></p></div><div class="card"><h2>스토리 경계</h2><p id="boundary"></p></div></div></div></div>
<script>
const beats=[
{id:'S0',name:'ROOF HATCH',purpose:'Sector05의 밀폐된 통제 공간에서 처음으로 실제 하늘과 아래쪽 구조물 깊이를 공개한다.',camera:'Roof Hatch에서 화면 아래/왼쪽의 Drop H1, H2, Lower Sky Island가 동시에 보이게 한다. Blind Leap 금지.',audio:'실내 저주파를 줄이고 일반 옥상 고도감만 연다. Wind mechanic cue는 아직 없음.',meaning:'“길은 위가 아니라 아래 바깥쪽으로도 이어진다.”',boundary:'Pad03/Shuttle/Access Denied는 비공개.',toast:[['ROOFTOP ZONE','EXTERIOR SERVICE ACCESS']],bark:'…이제 진짜 밖이네.',scene:`<rect class="safe" x="600" y="90" width="220" height="24"/><rect class="island" x="430" y="185" width="150" height="30"/><rect class="island" x="250" y="285" width="150" height="30"/><rect class="safe" x="70" y="405" width="220" height="24"/><path class="route" d="M690 120 Q570 175 500 195 Q360 250 320 295 Q190 360 180 405"/><g transform="translate(680 125)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S1',name:'SKYBREAK DROP',purpose:'기존 Rope를 하강 방향으로 연속 사용해 건물 외피에서 열린 하늘로 실제 이탈하게 한다.',camera:'Player와 다음 두 구조물, 아래 Recovery Shadow를 동시에 유지한다.',audio:'새 경고음 없음. 고도감과 구조물 진동음만.',meaning:'“떨어지는 게 실패가 아니라 이번에는 진행 그 자체다.”',boundary:'새 Rope 기능 없음.',toast:null,bark:null,scene:`<rect class="island" x="650" y="110" width="150" height="30"/><rect class="island" x="450" y="220" width="150" height="30"/><rect class="island" x="230" y="330" width="150" height="30"/><rect class="recover" x="330" y="445" width="320" height="18"/><path class="route" d="M720 125 Q610 180 525 230 Q390 285 305 340"/><g transform="translate(560 210)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S2',name:'LOWER SKY ISLAND',purpose:'Stage 최저점의 큰 안전 섬에서 방금 내려온 Roof와 앞으로 오를 Freestanding Mast를 한 번에 읽힌다.',camera:'조금 넓혀 위쪽 Roof edge와 Mast 전체 실루엣을 보여준다.',audio:'안정된 exterior ambience.',meaning:'“아래까지 내려왔고, 이제 저 독립 구조물을 올라간다.”',boundary:'Story text 없음.',toast:null,bark:null,scene:`<rect class="safe" x="100" y="405" width="310" height="26"/><rect class="mast" x="590" y="70" width="90" height="350"/><circle class="hp" cx="600" cy="320" r="13"/><circle class="hp" cx="620" cy="220" r="13"/><circle class="hp" cx="630" cy="120" r="13"/><path class="route" d="M360 395 Q500 360 600 320 L620 220 L630 120"/><g transform="translate(260 370)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S3',name:'FREESTANDING MAST',purpose:'벽 없이 독립 구조물 자체를 오르게 해 Sector06의 structural-island 문법을 확정한다.',camera:'큰 wall이 프레임에 들어오지 않게 하고 Mast bracket / ring만 명확히 읽힌다.',audio:'얇은 금속 구조물 진동과 exterior ambience. Wind 강제력 없음.',meaning:'“공간 안이 아니라 구조물 자체를 타고 오른다.”',boundary:'고입력 중 대사 없음.',toast:null,bark:null,scene:`<rect class="mast" x="440" y="50" width="100" height="430"/><rect class="recover" x="310" y="380" width="260" height="18"/><circle class="hp" cx="490" cy="360" r="13"/><circle class="hp" cx="480" cy="255" r="13"/><circle class="hp" cx="500" cy="150" r="13"/><path class="route" d="M490 440 L490 360 L480 255 L500 150"/><g transform="translate(490 340)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`},
{id:'S4',name:'CROWN HANDOFF',purpose:'Mast 상단에서 짧게 Crown으로 건너가 6-2를 예고한다. 6-1을 또 하나의 긴 좌우 Stage로 만들지 않는다.',camera:'Crown Deck과 멀리 Crosswind Mast 실루엣만 보인다.',audio:'Streamer/태그가 흔들리는 비물리적 ambience만. 실제 Wind force 없음.',meaning:'“다음 구간에는 바람이 있는 Mast들이 있다.”',boundary:'Wind는 6-2 소유. Pad03 직접 visual 금지.',toast:[['CROSSWIND MASTS','AHEAD']],bark:null,scene:`<rect class="island" x="120" y="270" width="170" height="35"/><rect class="island" x="360" y="210" width="170" height="35"/><rect class="safe" x="610" y="150" width="220" height="24"/><path class="route" d="M180 260 Q300 235 430 220 Q560 185 690 160"/><g transform="translate(190 240)"><circle class="player" r="13"/><rect class="player" x="-9" y="12" width="18" height="34"/></g>`}
];
const bs=document.getElementById('buttons');beats.forEach((b,i)=>{const x=document.createElement('button');x.textContent=b.id+' · '+b.name;x.onclick=()=>show(i);bs.appendChild(x)});
function show(i){const b=beats[i];[...bs.children].forEach((x,j)=>x.classList.toggle('on',j===i));purpose.textContent=b.purpose;camera.textContent=b.camera;audio.textContent=b.audio;meaning.textContent=b.meaning;boundary.textContent=b.boundary;visual.innerHTML=b.scene;if(b.toast){toast.classList.remove('hidden');toast.innerHTML=b.toast.map(x=>'<b>'+x[0]+'</b><br>'+x[1]).join('<br><br>')}else toast.classList.add('hidden');if(b.bark){bark.classList.remove('hidden');bark.textContent=b.bark}else bark.classList.add('hidden')}
show(0);
</script></body></html>
