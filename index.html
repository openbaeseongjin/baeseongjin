<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="description" content="절차 생성 월드를 로프로 등반하는 2D 액션 프로토타입" />
        <title>Baeseongjin Rope Roguelike</title>
        <style>
            :root {
                color-scheme: dark;
                --canvas-background: #0f172a;
                --text: #f8fafc;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
            }
            body {
                background: var(--canvas-background);
                color: var(--text);
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            #game-canvas {
                position: fixed;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                height: 100dvh;
                touch-action: none;
                user-select: none;
            }
            #game-canvas:focus-visible {
                outline: 2px solid #93c5fd;
                outline-offset: -2px;
            }
            .controls-hint {
                position: fixed;
                left: max(8px, env(safe-area-inset-left));
                bottom: max(8px, env(safe-area-inset-bottom));
                margin: 0;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(15, 23, 42, 0.82);
                color: #cbd5e1;
                font-size: 12px;
                line-height: 1.5;
                pointer-events: none;
                user-select: none;
            }
            .version-badge {
                position: fixed;
                right: max(8px, env(safe-area-inset-right));
                bottom: max(8px, env(safe-area-inset-bottom));
                margin: 0;
                padding: 3px 7px;
                border: 1px solid rgba(203, 213, 225, 0.22);
                border-radius: 5px;
                background: rgba(7, 11, 20, 0.58);
                color: rgba(203, 213, 225, 0.72);
                font:
                    10px/1.2 ui-monospace,
                    monospace;
                letter-spacing: 0.04em;
                pointer-events: none;
                user-select: none;
            }
            .orientation-notice {
                display: none;
            }
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }
            @media (orientation: portrait) and (pointer: coarse) {
                .orientation-notice {
                    position: fixed;
                    z-index: 10;
                    inset: 0;
                    display: grid;
                    place-items: center;
                    margin: 0;
                    padding: 24px;
                    background: #080b10;
                    color: #e2e8f0;
                    font-size: 20px;
                    text-align: center;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <canvas
                id="game-canvas"
                tabindex="0"
                role="img"
                aria-label="로프로 절차 생성 암석 지형을 등반하는 액션 게임 화면"
                aria-describedby="controls-description"
            ></canvas>
            <p class="sr-only" id="controls-description">
                PC에서는 A와 D로 이동하고 W로 점프합니다. 마우스로 지형을 누르면 로프를 부착하고 드래그하면 스윙하며
                놓으면 해제합니다. 모바일에서는 왼쪽 영역을 이동 스틱으로, 오른쪽 영역을 로프 조작으로 사용합니다.
            </p>
            <p class="controls-hint">PC: A/D 이동 · W 점프 · 마우스 로프 / 모바일: 왼쪽 이동 · 오른쪽 로프</p>
            <p class="orientation-notice" role="status">
                로프 액션은 가로 화면에 맞춰져 있습니다.<br />기기를 가로로 돌려주세요.
            </p>
            <output class="version-badge" id="app-version" data-version="0.6.0" aria-label="배포 버전">v0.6.0</output>
        </main>
        <noscript><p>이 게임을 실행하려면 JavaScript가 필요합니다.</p></noscript>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
