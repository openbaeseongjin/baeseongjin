<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#171d2a" />
        <meta name="multiplayer-server" content="https://cultures-euros-underwear-presented.trycloudflare.com" />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
        <link rel="manifest" href="./manifest.webmanifest" />
        <link rel="icon" type="image/png" sizes="64x64" href="./assets/icons/favicon-64.png" />
        <link rel="apple-touch-icon" sizes="180x180" href="./assets/icons/apple-touch-icon.png" />
        <meta name="description" content="절차 생성 월드를 로프로 등반하는 2D 액션 프로토타입" />
        <title>Baeseongjin Rope Roguelike</title>
        <style>
            :root {
                color-scheme: dark;
                --canvas-background: #0f172a;
                --text: #f8fafc;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
                overflow: hidden;
                overscroll-behavior: none;
            }
            body {
                background: var(--canvas-background);
                color: var(--text);
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            #game-canvas {
                position: fixed;
                inset: 0;
                display: block;
                width: 100%;
                height: 100%;
                height: 100dvh;
                touch-action: none;
                user-select: none;
            }
            #game-canvas:focus-visible {
                outline: 2px solid #93c5fd;
                outline-offset: -2px;
            }
            .controls-hint {
                position: fixed;
                left: max(8px, env(safe-area-inset-left));
                bottom: max(8px, env(safe-area-inset-bottom));
                margin: 0;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(15, 23, 42, 0.82);
                color: #cbd5e1;
                font-size: 12px;
                line-height: 1.5;
                pointer-events: none;
                user-select: none;
            }
            .version-badge {
                position: fixed;
                right: max(8px, env(safe-area-inset-right));
                bottom: max(8px, env(safe-area-inset-bottom));
                margin: 0;
                padding: 3px 7px;
                border: 1px solid rgba(203, 213, 225, 0.22);
                border-radius: 5px;
                background: rgba(7, 11, 20, 0.58);
                color: rgba(203, 213, 225, 0.72);
                font:
                    10px/1.2 ui-monospace,
                    monospace;
                letter-spacing: 0.04em;
                pointer-events: none;
                user-select: none;
            }
            .orientation-notice {
                display: none;
            }
            .game-mode-menu {
                position: fixed;
                z-index: 30;
                inset: 0;
                display: grid;
                place-items: center;
                padding: 24px;
                background: rgba(5, 9, 17, 0.84);
                backdrop-filter: blur(8px);
            }
            .game-mode-menu[hidden] {
                display: none;
            }
            .game-mode-card [hidden] {
                display: none !important;
            }
            .game-mode-card {
                width: min(460px, 100%);
                padding: 24px;
                border: 1px solid rgba(103, 232, 249, 0.4);
                border-radius: 18px;
                background: rgba(15, 23, 42, 0.96);
                box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
                text-align: center;
            }
            .game-mode-card h1 {
                margin: 0 0 8px;
                font-size: 26px;
            }
            .game-mode-card p {
                margin: 0 0 18px;
                color: #cbd5e1;
            }
            .game-mode-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .game-mode-actions button {
                min-height: 54px;
                border: 1px solid rgba(148, 163, 184, 0.35);
                border-radius: 12px;
                color: #f8fafc;
                background: #243047;
                font-weight: 800;
                cursor: pointer;
            }
            .game-mode-actions button:last-child {
                color: #082f49;
                background: #67e8f9;
            }
            .game-mode-actions button:disabled {
                cursor: wait;
                opacity: 0.5;
            }
            .channel-panel {
                display: grid;
                gap: 10px;
            }
            .channel-panel input {
                width: 100%;
                min-height: 52px;
                border: 1px solid rgba(148, 163, 184, 0.5);
                border-radius: 12px;
                color: #f8fafc;
                background: #0f172a;
                font:
                    800 22px/1 ui-monospace,
                    monospace;
                letter-spacing: 0.35em;
                text-align: center;
            }
            .channel-panel-actions {
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap: 10px;
            }
            .channel-panel button {
                min-height: 48px;
                border: 1px solid rgba(148, 163, 184, 0.35);
                border-radius: 12px;
                color: #f8fafc;
                background: #243047;
                font-weight: 800;
            }
            .channel-badge {
                position: fixed;
                z-index: 8;
                top: max(8px, env(safe-area-inset-top));
                right: max(8px, env(safe-area-inset-right));
                padding: 5px 9px;
                border-radius: 7px;
                color: #082f49;
                background: rgba(103, 232, 249, 0.9);
                font:
                    800 12px/1.2 ui-monospace,
                    monospace;
            }
            .copy-diagnostics {
                position: fixed;
                z-index: 9;
                top: max(238px, env(safe-area-inset-top));
                right: max(8px, env(safe-area-inset-right));
                min-height: 38px;
                padding: 0 12px;
                border: 1px solid rgba(103, 232, 249, 0.65);
                border-radius: 8px;
                color: #e2e8f0;
                background: rgba(7, 11, 20, 0.9);
                font:
                    800 11px/1 ui-monospace,
                    monospace;
            }
            .copy-diagnostics[hidden] {
                display: none;
            }
            [data-mode-status][data-error="true"] {
                color: #fda4af;
            }
            .install-prompt {
                position: fixed;
                z-index: 20;
                top: max(14px, env(safe-area-inset-top));
                left: 50%;
                width: min(420px, calc(100% - 28px));
                padding: 16px;
                border: 1px solid rgba(103, 232, 249, 0.45);
                border-radius: 14px;
                background: rgba(7, 11, 20, 0.94);
                box-shadow: 0 16px 44px rgba(0, 0, 0, 0.42);
                transform: translateX(-50%);
            }
            .install-prompt[hidden] {
                display: none;
            }
            .install-prompt strong,
            .install-prompt span {
                display: block;
            }
            .install-prompt strong {
                margin-bottom: 5px;
                color: #67e8f9;
                font-size: 16px;
            }
            .install-prompt span {
                color: #cbd5e1;
                font-size: 13px;
                line-height: 1.45;
            }
            .install-actions {
                display: flex;
                justify-content: flex-end;
                gap: 8px;
                margin-top: 12px;
            }
            .install-actions button {
                min-height: 40px;
                padding: 0 14px;
                border: 0;
                border-radius: 9px;
                color: #e2e8f0;
                background: #334155;
                font-weight: 700;
            }
            .install-actions [data-install-action] {
                color: #082f49;
                background: #67e8f9;
            }
            .install-actions [data-install-action]:disabled {
                opacity: 0.48;
            }
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }
            @media (orientation: portrait) and (pointer: coarse) {
                .orientation-notice {
                    position: fixed;
                    z-index: 10;
                    inset: 0;
                    display: grid;
                    place-items: center;
                    margin: 0;
                    padding: 24px;
                    background: #080b10;
                    color: #e2e8f0;
                    font-size: 20px;
                    text-align: center;
                }
            }
        </style>
    </head>
    <body>
        <main>
            <section class="game-mode-menu" id="game-mode-menu" aria-labelledby="game-mode-title">
                <div class="game-mode-card">
                    <h1 id="game-mode-title">로프 원정 시작</h1>
                    <p data-mode-status aria-live="polite">플레이 방식을 선택하세요.</p>
                    <div class="game-mode-actions" data-mode-actions>
                        <button type="button" data-game-mode="single">싱글 플레이</button>
                        <button type="button" data-game-mode="multiplayer">멀티 플레이</button>
                    </div>
                    <div class="channel-panel" data-channel-panel hidden>
                        <button type="button" data-channel-create>새 채널 만들기</button>
                        <form data-channel-form>
                            <label class="sr-only" for="channel-number">채널 번호</label>
                            <input
                                id="channel-number"
                                data-channel-input
                                inputmode="numeric"
                                pattern="[0-9]{4}"
                                maxlength="4"
                                autocomplete="one-time-code"
                                placeholder="0000"
                            />
                            <div class="channel-panel-actions">
                                <button type="button" data-channel-back>뒤로</button>
                                <button type="submit">채널 참가</button>
                            </div>
                        </form>
                    </div>
                </div>
            </section>
            <canvas
                id="game-canvas"
                tabindex="0"
                role="img"
                aria-label="로프로 절차 생성 암석 지형을 등반하는 액션 게임 화면"
                aria-describedby="controls-description"
            ></canvas>
            <p class="sr-only" id="controls-description">
                PC에서는 A와 D로 이동하고 W로 점프합니다. 마우스로 지형을 누르면 로프를 부착하고 드래그하면 스윙하며
                놓으면 해제합니다. 모바일에서는 하단의 좌우 이동과 점프 버튼을 사용하고 나머지 화면에서 로프를
                조작합니다.
            </p>
            <p class="controls-hint">PC: A/D 이동 · W 점프 · 마우스 로프 / 모바일: 하단 이동·점프 · 화면 로프</p>
            <output class="channel-badge" id="channel-badge" hidden></output>
            <button class="copy-diagnostics" id="copy-diagnostics" type="button" hidden>진단 복사</button>
            <p class="orientation-notice" role="status">
                로프 액션은 가로 화면에 맞춰져 있습니다.<br />기기를 가로로 돌려주세요.
            </p>
            <section class="install-prompt" id="install-prompt" aria-live="polite" hidden>
                <strong>전체 화면으로 플레이</strong>
                <span data-install-message></span>
                <div class="install-actions">
                    <button type="button" data-install-dismiss>나중에</button>
                    <button type="button" data-install-action>앱 설치</button>
                </div>
            </section>
            <output class="version-badge" id="app-version" data-version="0.12.23" aria-label="배포 버전"
                >v0.12.23</output
            >
        </main>
        <noscript><p>이 게임을 실행하려면 JavaScript가 필요합니다.</p></noscript>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
