<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="절차 생성 월드를 탄성 로프로 횡단하는 2D 액션 프로토타입" />
        <title>Baeseongjin Rope Roguelike</title>
        <style>
            :root {
                color-scheme: dark;
                --canvas-background: #0f172a;
                --text: #f8fafc;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }
            body {
                background: var(--canvas-background);
                color: var(--text);
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            #game-canvas {
                display: block;
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            #game-canvas:focus-visible {
                outline: 2px solid #93c5fd;
                outline-offset: -2px;
            }
            .controls-hint {
                position: fixed;
                left: 8px;
                bottom: 8px;
                margin: 0;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(15, 23, 42, 0.82);
                color: #cbd5e1;
                font-size: 12px;
                line-height: 1.5;
                pointer-events: none;
                user-select: none;
            }
            .version-badge {
                position: fixed;
                right: 8px;
                bottom: 8px;
                margin: 0;
                padding: 3px 7px;
                border: 1px solid rgba(203, 213, 225, 0.22);
                border-radius: 5px;
                background: rgba(7, 11, 20, 0.58);
                color: rgba(203, 213, 225, 0.72);
                font:
                    10px/1.2 ui-monospace,
                    monospace;
                letter-spacing: 0.04em;
                pointer-events: none;
                user-select: none;
            }
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }
        </style>
    </head>
    <body>
        <main>
            <canvas
                id="game-canvas"
                tabindex="0"
                role="img"
                aria-label="로프 로그라이크 게임 화면. 지형을 조준해 마우스를 누르면 로프가 부착되고 놓으면 해제됩니다."
                aria-describedby="controls-description"
            ></canvas>
            <p class="sr-only" id="controls-description">
                이동: A와 D 또는 방향키. 점프: W 또는 위쪽 방향키. 지형을 조준해 마우스를 누르면 로프를 부착하고, 줄에
                수직인 방향으로 드래그하면 부착당 한 번 스윙합니다. 놓으면 해제합니다.
            </p>
            <p class="controls-hint">
                이동 A/D · 마우스 홀드: 부착 · 줄의 수직 방향 드래그: 1회 스윙 · 해제: 관성 비행
            </p>
            <output class="version-badge" id="app-version" data-version="0.4.2" aria-label="배포 버전">v0.4.2</output>
        </main>
        <noscript>
            <p>이 게임을 실행하려면 JavaScript가 필요합니다.</p>
        </noscript>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
