<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="description" content="탄성 로프 로그라이크 — 캔버스 런타임 마일스톤 0 스캐폴드" />
        <title>Baeseongjin Rope Roguelike</title>
        <style>
            :root {
                color-scheme: dark;
                --canvas-background: #0f172a;
                --text: #f8fafc;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                margin: 0;
                padding: 0;
                width: 100%;
                height: 100%;
            }
            body {
                background: var(--canvas-background);
                color: var(--text);
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            #game {
                display: block;
                position: fixed;
                inset: 0;
                width: 100%;
                height: 100%;
                touch-action: none;
            }
            #game:focus-visible {
                outline: 2px solid #93c5fd;
                outline-offset: -2px;
            }
            .controls-hint {
                position: fixed;
                left: 8px;
                bottom: 8px;
                margin: 0;
                padding: 6px 10px;
                border-radius: 6px;
                background: rgba(15, 23, 42, 0.82);
                color: #cbd5e1;
                font-size: 12px;
                line-height: 1.5;
                pointer-events: none;
                user-select: none;
            }
            .sr-only {
                position: absolute;
                width: 1px;
                height: 1px;
                padding: 0;
                margin: -1px;
                overflow: hidden;
                clip: rect(0 0 0 0);
                white-space: nowrap;
                border: 0;
            }
        </style>
    </head>
    <body>
        <main>
            <canvas
                id="game-canvas"
                tabindex="0"
                role="img"
                aria-label="로프 로그라이크 게임 화면. 마우스나 키보드로 하얀 플레이어 점을 이동합니다."
                aria-describedby="controls-description"
            ></canvas>
            <p class="sr-only" id="controls-description">
                이동: WASD 또는 방향키. 화면에 표시되지 않는 상황을 대신 설명해 주는 접근성 안내 텍스트입니다.
            </p>
            <p class="controls-hint">이동: WASD / 방향키 · 화면 채우기</p>
        </main>
        <noscript>
            <p>이 게임을 실행하려면 JavaScript가 필요합니다.</p>
        </noscript>
        <script type="module" src="./src/main.js"></script>
    </body>
</html>
