<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Sector transit visual harness</title>
        <style>
            html,
            body,
            canvas {
                width: 100%;
                height: 100%;
                margin: 0;
                overflow: hidden;
                background: #080b10;
            }
            canvas {
                display: block;
            }
            button {
                position: fixed;
                z-index: 10;
                top: 10px;
                right: 10px;
                min-height: 40px;
                padding: 0 14px;
                border: 1px solid #67e8f9;
                border-radius: 8px;
                color: #ecfeff;
                background: rgba(8, 47, 73, 0.92);
                font-weight: 800;
            }
            #focus-carrier {
                top: 58px;
            }
        </style>
    </head>
    <body>
        <canvas id="preview" aria-label="Sector transit 장치 시각 검증"></canvas>
        <button id="unlock" type="button">3/3 개방</button>
        <button id="focus-carrier" type="button">Carrier 보기</button>
        <script type="module" src="./sectorTransitVisualHarness.mjs"></script>
    </body>
</html>
