<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>Baeseongjin Map Editor</title>
        <link rel="stylesheet" href="./editor.css" />
    </head>
    <body>
        <main class="editor-shell" aria-label="맵 에디터">
            <header class="editor-header">
                <div>
                    <p id="stage-scope" class="eyebrow">SECTOR 01~06 / 맵 저작 콘솔</p>
                    <h1>맵 에디터</h1>
                </div>
                <label class="stage-picker"
                    >스테이지
                    <select id="stage-select" aria-label="편집할 스테이지"></select
                ></label>
            </header>
            <aside class="layer-sidebar" aria-label="스테이지 레이어와 오브젝트">
                <label class="layer-filter"
                    >오브젝트 찾기
                    <input id="layer-filter" type="search" placeholder="id 또는 종류 검색" autocomplete="off" />
                </label>
                <nav id="layer-panel" class="panel layer-panel" aria-label="스테이지 레이어와 오브젝트"></nav>
            </aside>
            <section class="canvas-workspace" aria-label="월드 캔버스 작업 공간">
                <div class="workspace-ruler top-ruler" aria-hidden="true"></div>
                <div class="workspace-ruler side-ruler" aria-hidden="true"></div>
                <canvas id="editor-canvas" aria-label="맵 편집 캔버스"></canvas>
                <div class="canvas-tools" aria-label="캔버스 보기 조작">
                    <button id="fit-stage" type="button" title="전체 스테이지 보기 (0)">전체 보기 <kbd>0</kbd></button>
                    <button id="focus-selection" type="button" title="선택 항목으로 이동 (F)">
                        선택 집중 <kbd>F</kbd>
                    </button>
                    <button id="clear-selection" type="button" title="선택 해제 (Esc)">선택 해제 <kbd>Esc</kbd></button>
                </div>
                <p id="selection-readout" class="selection-readout" aria-live="polite">선택 없음</p>
                <p id="canvas-hint" class="canvas-hint">
                    클릭: 선택 · 선택 항목 드래그: 이동 · 휠: 확대 · Space+드래그: 화면 이동
                </p>
            </section>
            <aside id="inspector-panel" class="panel inspector-panel" aria-label="선택한 오브젝트 속성"></aside>
            <footer class="draft-strip" aria-live="polite">
                <div id="draft-status" class="draft-status">스테이지를 불러오는 중입니다.</div>
                <div class="draft-actions" aria-label="초안 작업">
                    <button id="undo-draft" type="button" title="되돌리기 (Ctrl 또는 Cmd + Z)">되돌리기</button>
                    <button id="redo-draft" type="button" title="다시 실행 (Ctrl 또는 Cmd + Shift + Z)">
                        다시 실행
                    </button>
                    <button id="validate-draft" type="button">초안 검증</button>
                    <button id="apply-draft" type="button" class="primary">저장 적용</button>
                    <button id="preview-stage" type="button" class="preview">새 미리보기</button>
                </div>
            </footer>
        </main>
        <script type="module" src="./main.js"></script>
    </body>
</html>
