<!doctype html>
<html lang="ko">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark" />
        <title>맵 에디터 미리보기</title>
        <link rel="stylesheet" href="./preview.css" />
    </head>
    <body>
        <main class="preview-shell">
            <header class="preview-header">
                <a href="./">← 에디터로 돌아가기</a>
                <p id="preview-label">실제 게임 화면의 새 싱글플레이 실행을 준비하는 중입니다.</p>
                <button id="reload-preview" type="button">새 실행 다시 시작</button>
            </header>
            <canvas id="preview-canvas" aria-label="맵 에디터 실제 게임 화면 미리보기"></canvas>
            <output id="preview-status" aria-live="polite"></output>
        </main>
        <script type="module" src="./preview.js"></script>
    </body>
</html>
